<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Формула здоровья ЖКТ — личный кабинет</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="css-u">
:root{
  --e-dk:#14372E;--e:#1E4D3E;--lime:#7AC143;--mint:#A8E4C0;--mint-pale:#EAF5EE;
  --mint-bd:#8DC63F;--mag:#A0197E;--lav:#F0D6E8;--ink:#1B3A2F;--grey:#6B8A7C;
  --bg:#FFFFFF;--surface:#FFFFFF;--soft:#F6FAF7;--line:#D6E8DC;--on-dark:#FFFFFF;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ink:#E3F0E8;--grey:#9DB8AA;--bg:#0E211B;--surface:#132B23;--soft:#17342A;
    --mint-pale:#1B3A30;--line:#2A4B3F;--lav:#3A2536;--mint:#2F6A50;
  }
}
:root[data-theme="dark"]{
  --ink:#E3F0E8;--grey:#9DB8AA;--bg:#0E211B;--surface:#132B23;--soft:#17342A;
  --mint-pale:#1B3A30;--line:#2A4B3F;--lav:#3A2536;--mint:#2F6A50;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:Montserrat,"Segoe UI",system-ui,-apple-system,sans-serif;font-size:15.5px;line-height:1.55;
  -webkit-text-size-adjust:100%}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--mag);outline-offset:2px;border-radius:8px}
.wrap{max-width:820px;margin:0 auto;padding:0 16px 96px}

/* верхняя строка */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);
  border-bottom:1px solid var(--line)}
.bar .in{max-width:820px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;min-height:54px}
.brand{font-weight:800;font-size:14px;letter-spacing:.04em;color:var(--ink)}
.brand i{font-style:normal;color:var(--mint-bd);font-size:11px;margin-left:2px}
.bar .prog{margin-left:auto;font-size:12px;color:var(--grey);font-weight:600;text-align:right}
.back{border:none;background:var(--mint-pale);width:36px;height:36px;border-radius:50%;
  display:grid;place-items:center;flex:0 0 auto}
.back svg{width:18px;height:18px}

/* типографика */
h1{font-size:24px;line-height:1.3;margin:0 0 10px;font-weight:800}
h2{font-size:19px;line-height:1.5;margin:30px 0 12px;font-weight:700}
h2 span{background:var(--mint);padding:2px 8px;border-radius:3px;
  box-decoration-break:clone;-webkit-box-decoration-break:clone}
h2.neg span{background:var(--mag);color:#fff}
h3{font-size:16px;margin:18px 0 8px;font-weight:700}
p{margin:0 0 12px}
.muted{color:var(--grey)}
.small{font-size:13px}

/* кнопки */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;
  background:var(--e-dk);color:#fff;font-weight:700;font-size:15px;padding:14px 22px;border-radius:999px;
  min-height:48px;text-decoration:none}
.btn:hover{background:var(--e)}
.btn.full{width:100%}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--mint-bd)}
.btn.ghost:hover{background:var(--mint-pale)}
.btn.mag{background:var(--mag)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.btn{flex:1 1 160px}

/* брендовая «шапка» */
.top{background:linear-gradient(135deg,#14372E,#1E4D3E);border-radius:18px;padding:26px 24px;color:#fff;margin:20px 0 24px}
.top .sub{color:#A8E4C0;font-weight:700;font-size:12px;letter-spacing:.06em;margin-bottom:14px}
.top h1{color:#fff}
.top p{color:#DDEFE4}
.tag{display:inline-block;background:var(--lime);color:#fff;font-weight:800;padding:3px 12px;border-radius:5px}

.card{background:var(--mint-pale);border:2px solid var(--mint-bd);border-radius:14px;padding:16px 18px;margin:0 0 14px}
.card>*:last-child{margin-bottom:0}
.card.alt{border-color:var(--mag);background:var(--surface)}
.out{background:var(--lav);border-radius:14px;padding:16px 20px;margin:0 0 14px;text-align:center;font-weight:700}
.mark{background:var(--mag);color:#fff;font-weight:700;padding:1px 7px;border-radius:3px}

/* анкета */
.steps{display:flex;gap:4px;margin:20px 0 6px}
.steps i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.steps i.on{background:var(--mint-bd)}
.q{margin:22px 0}
.q .qt{font-weight:700;margin-bottom:10px}
.opts{display:grid;gap:8px}
.opt{display:flex;align-items:flex-start;gap:12px;text-align:left;width:100%;border:2px solid var(--line);
  background:var(--surface);border-radius:12px;padding:12px 14px;font-size:15px;line-height:1.4}
.opt:hover{border-color:var(--mint-bd)}
.opt .box{flex:0 0 22px;height:22px;border-radius:6px;border:2px solid var(--mint-bd);display:grid;place-items:center;margin-top:-1px}
.opt.radio .box{border-radius:50%}
.opt.on{border-color:var(--mint-bd);background:var(--mint-pale);font-weight:600}
.opt.on .box{background:var(--mint-bd)}
.opt.on .box:after{content:"";width:8px;height:8px;border-radius:2px;background:#fff}
.opt.radio.on .box:after{border-radius:50%}
.sl{background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.sl .h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-weight:600}
.sl .v{font-weight:800;font-size:18px;color:var(--mag);font-variant-numeric:tabular-nums;min-width:2ch;text-align:right}
.sl input{width:100%;accent-color:var(--mag);margin:10px 0 2px;height:28px}
.sl .ends{display:flex;justify-content:space-between;font-size:12px;color:var(--grey)}

/* поля анкеты */
.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px;margin:0 0 12px}
.fields.one{grid-template-columns:1fr;margin-top:6px}
.fld label{display:block;font-weight:600;font-size:14px;margin-bottom:6px}
.fld.wide{grid-column:1/-1}
.inp{width:100%;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:12px 14px;font:inherit;font-size:15px}
.inp:focus{border-color:var(--mint-bd);outline:none;box-shadow:0 0 0 3px var(--mint-pale)}
.inp.err{border-color:var(--mag)}
textarea.inp{min-height:120px;resize:vertical}
.errt{color:var(--mag);font-size:12.5px;font-weight:600;margin-top:5px}
.codebox{background:var(--lav);border-radius:14px;padding:16px 18px;margin:6px 0 16px}
.codebox .fields{margin-bottom:4px}
.linkbtn{border:none;background:none;padding:6px 0;color:var(--mag);font-weight:700;font-size:14px;text-decoration:underline;text-underline-offset:3px}
.lnk{color:var(--mag);font-weight:700}
.gate{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-width:420px}
.dg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.qi{background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.qi.on{border-color:var(--mint-bd);background:var(--mint-pale)}
.qi .qt{font-weight:600;margin-bottom:10px;font-size:15px;line-height:1.4}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{border:2px solid var(--mint-bd);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600;line-height:1.25}
.pill:hover{background:var(--mint-pale)}
.pill.on{background:var(--e-dk);border-color:var(--e-dk);color:#fff}
.hint-strong{display:flex;gap:12px;align-items:flex-start;background:var(--lav);border-left:5px solid var(--mag);border-radius:12px;padding:14px 16px;margin:18px 0 14px;font-size:17px;font-weight:700;line-height:1.4;color:var(--ink)}
.hint-strong .hint-ic{flex:0 0 28px;height:28px;border-radius:50%;background:var(--mag);color:#fff;font-weight:800;font-size:17px;display:grid;place-items:center}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;padding:0;margin:-1px}
.vh:focus-visible+label{outline:3px solid var(--mag);outline-offset:2px}
label.btn{cursor:pointer}
.tongue-prev{display:block;max-width:240px;width:100%;border-radius:12px;border:2px solid var(--mint-bd);margin:6px 0 12px}
.upcard{background:var(--lav);border:2px solid var(--mag);border-radius:14px;padding:16px 18px;margin:0 0 14px}
.testnote{border:2px dashed var(--mag);color:var(--mag);border-radius:12px;padding:10px 14px;font-size:13px;font-weight:700;margin:0 0 14px}
.sum{background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 10px}
.sum-h{font-weight:800;font-size:13px;color:var(--mag);margin-bottom:6px}
.sum-r{display:flex;justify-content:space-between;gap:14px;padding:5px 0;border-top:1px solid var(--line);font-size:14px}
.sum-r:first-of-type{border-top:none}
.sum-r span{color:var(--grey);flex:1 1 55%}
.sum-r b{flex:1 1 45%;text-align:right;font-weight:600}
@media (max-width:560px){.fields,.dg{grid-template-columns:1fr}.sum-r{flex-direction:column;gap:2px}.sum-r b{text-align:left}}

/* дашборд */
.next{display:flex;gap:14px;align-items:center;background:var(--surface);border:2px solid var(--mag);border-radius:14px;
  padding:14px 16px;margin:0 0 22px;width:100%;text-align:left}
.next .ic{flex:0 0 46px;height:46px;border-radius:50%;background:var(--mag);display:grid;place-items:center}
.next .ic svg{width:20px;height:20px;color:#fff}
.next small{display:block;color:var(--mag);font-weight:700;font-size:12px}
.next b{display:block;font-size:15.5px;line-height:1.35}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:640px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:10px;text-align:left;
  background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:16px;min-height:150px}
.tile:hover{border-color:var(--mint-bd);background:var(--soft)}
.tile .ic{width:44px;height:44px;border-radius:12px;background:var(--mint-pale);display:grid;place-items:center;color:var(--e)}
.tile .ic svg{width:24px;height:24px}
.tile b{font-size:16px}
.tile .cnt{font-size:13px;color:var(--grey);margin-top:-6px}
.tile .pb{margin-top:auto;width:100%}
.tile.prg{background:var(--lav);border-color:var(--lav);grid-column:1/-1;flex-direction:row;align-items:center;min-height:0}
.tile.prg .cnt{margin:0 0 0 auto}
.tile.prg .ic{background:var(--mag);color:#fff}
.pb{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.pb i{display:block;height:100%;background:var(--mint-bd);border-radius:3px}
.top .pb{background:rgba(255,255,255,.2);height:8px;margin-top:6px}
.top .pb i{background:var(--lime)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;padding:4px 10px;border-radius:999px;
  background:var(--mint-pale);color:var(--ink);border:1px solid var(--mint-bd)}
.chip.m{background:var(--lav);border-color:var(--lav)}

/* списки */
.list{display:grid;gap:8px;margin:0 0 14px}
.li{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--surface);
  border:2px solid var(--line);border-radius:12px;padding:12px 14px}
.li:hover{border-color:var(--mint-bd)}
.li .st{flex:0 0 26px;height:26px;border-radius:50%;border:2px solid var(--mint-bd);display:grid;place-items:center;color:#fff}
.li.done .st{background:var(--mint-bd)}
.li .st svg{width:14px;height:14px}
.li .tx{flex:1;min-width:0}
.li .tx b{display:block;font-size:15px;line-height:1.35}
.li .tx span{font-size:12.5px;color:var(--grey)}
.li .ch{color:var(--grey);flex:0 0 auto}
.li.done .tx b{color:var(--grey)}
.wk{font-weight:700;font-size:13px;color:var(--mag);margin:18px 2px 8px}

/* карточка материала */
.video{position:relative;aspect-ratio:16/9;border-radius:14px;overflow:hidden;
  background:linear-gradient(135deg,#14372E,#1E4D3E);display:grid;place-items:center;color:#fff;margin:14px 0 16px}
.video .pl{width:64px;height:64px;border-radius:50%;background:var(--lime);display:grid;place-items:center}
.video .pl svg{width:26px;height:26px;margin-left:4px}
.video small{position:absolute;left:14px;bottom:12px;right:14px;font-size:12px;color:#A8E4C0}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
ul.ing{list-style:none;padding:0;margin:0 0 14px}
ul.ing li{display:flex;justify-content:space-between;gap:12px;padding:8px 12px;border-radius:9px}
ul.ing li:nth-child(odd){background:var(--mint-pale)}
ul.ing li span:last-child{color:var(--grey);white-space:nowrap}
ol.stp{padding-left:0;list-style:none;counter-reset:s;margin:0 0 16px}
ol.stp li{counter-increment:s;position:relative;padding:0 0 12px 40px}
ol.stp li:before{content:counter(s);position:absolute;left:0;top:-1px;width:28px;height:28px;border-radius:50%;
  background:var(--mint);font-weight:800;font-size:13px;display:grid;place-items:center;color:var(--e-dk)}
ul.dot{padding-left:20px;margin:0 0 14px}
ul.dot li{margin:0 0 6px}
ul.dot li::marker{color:var(--mint-bd)}
.why{background:var(--lav);border-radius:12px;padding:12px 14px;font-size:14px;margin:0 0 16px}
.why b{color:var(--mag)}

/* меню */
.tabs{display:flex;gap:6px;margin:14px 0 14px;overflow-x:auto}
.tabs button{border:2px solid var(--mint-bd);background:var(--surface);border-radius:999px;padding:8px 16px;font-weight:700;font-size:14px;white-space:nowrap}
.tabs button.on{background:var(--e-dk);border-color:var(--e-dk);color:#fff}
.meal{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--surface);border:2px solid var(--line);
  border-radius:12px;padding:12px 14px;margin-bottom:8px}
.meal:hover{border-color:var(--mint-bd)}
.meal .t{flex:0 0 76px;font-size:12px;font-weight:700;color:var(--mag)}
.meal b{flex:1;font-size:15px}

/* прогресс */
.cmp{display:grid;gap:12px;margin:0 0 14px}
.cmp .r .h{display:flex;justify-content:space-between;font-weight:600;font-size:14px;margin-bottom:5px}
.cmp .r .h em{font-style:normal;font-weight:800}
.cmp .r .h em.good{color:#3F8A2E}
.cmp .r .h em.bad{color:var(--mag)}
.bars{display:grid;gap:3px}
.bars div{height:9px;border-radius:5px;background:var(--line);overflow:hidden}
.bars div i{display:block;height:100%}
.bars .a i{background:#C9B3C2}
.bars .b i{background:var(--mint-bd)}
.legend{display:flex;gap:16px;font-size:12.5px;color:var(--grey);margin:0 0 12px}
.legend span:before{content:"";display:inline-block;width:12px;height:8px;border-radius:4px;margin-right:6px;background:#C9B3C2}
.legend span.b:before{background:var(--mint-bd)}
.stat{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:0 0 14px}
.stat>div{background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:12px 14px}
.stat b{display:block;font-size:22px;font-weight:800}
.stat span{font-size:12.5px;color:var(--grey)}
.catrow{display:grid;grid-template-columns:120px 1fr 52px;align-items:center;gap:10px;font-size:14px;padding:6px 0}
.catrow span:last-child{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}

/* панель поддержки (демо) */
.adm-toggle{position:fixed;left:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:20;border:2px dashed var(--grey);
  background:var(--bg);color:var(--grey);font-size:12px;font-weight:700;padding:8px 12px;border-radius:999px}
.adm{position:fixed;inset:0;z-index:30;background:rgba(10,25,20,.55);display:none;align-items:flex-end;justify-content:center;padding:16px}
.adm.on{display:flex}
.adm .pan{background:var(--bg);border-radius:18px;max-width:520px;width:100%;padding:20px;border:2px dashed var(--grey);
  margin-bottom:env(safe-area-inset-bottom,0px);max-height:90%;overflow:auto}
.adm .pan h3{margin-top:0}
.adm dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px;margin:0 0 16px}
.adm dt{color:var(--grey)}
.adm dd{margin:0;font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(70px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:40;
  background:var(--e-dk);color:#fff;padding:10px 18px;border-radius:999px;font-weight:600;font-size:14px;opacity:0;
  transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
/* календарь и трекер */
.cal{display:flex;justify-content:space-between;gap:10px;font-size:13px;font-weight:700;margin-bottom:4px}
.cal span:last-child{color:#A8E4C0}
.today{display:block;width:100%;text-align:left;background:var(--mint-pale);border:2px solid var(--mint-bd);border-radius:14px;padding:14px 16px;margin:0 0 12px}
.today .h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:8px}
.today small{color:var(--e);font-weight:700;font-size:12px}
.today b{font-size:15.5px}
.today .n{font-weight:800;font-size:18px;font-variant-numeric:tabular-nums}
.li.lock{opacity:.55;cursor:default}
.li.lock .st{border-color:var(--grey);color:var(--grey)}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin:14px 0 16px}
.days button{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.days button b{font-size:13px}
.days button span{font-size:10.5px;color:var(--grey);white-space:nowrap}
.days button i{display:block;width:70%;height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.days button i em{display:block;height:100%;background:var(--mint-bd)}
.days button.on{border-color:var(--e-dk);background:var(--e-dk);color:#fff}
.days button.on span{color:#A8E4C0}
.days button.td{border-color:var(--mag)}
.days button.on.td{border-color:var(--mag)}
.days button[disabled]{opacity:.45;cursor:not-allowed}
.trk{display:grid;gap:6px;margin:0 0 12px}
.trk .opt.anc{background:var(--soft);font-weight:700}
.trk .opt.anc.on{background:var(--mint-pale)}
.trk .opt em{font-style:normal;font-weight:400;color:var(--grey);font-size:13px}
.trk .opt[disabled]{cursor:not-allowed;opacity:.6}
.gridwrap{overflow-x:auto;border:2px solid var(--line);border-radius:14px;margin:0 0 14px;-webkit-overflow-scrolling:touch}
table.wg{border-collapse:separate;border-spacing:0;font-size:12.5px;width:100%;min-width:520px}
table.wg th,table.wg td{padding:6px 4px;text-align:center}
table.wg th{background:var(--e-dk);color:#fff;font-weight:700;font-size:11.5px;white-space:nowrap}
table.wg th:first-child,table.wg td:first-child{text-align:left;position:sticky;left:0;background:var(--surface);padding-left:10px;min-width:170px;max-width:200px;line-height:1.3}
table.wg th:first-child{background:var(--e-dk)}
table.wg tr.anc td:first-child{font-weight:700}
table.wg tr:nth-child(even) td{background:var(--soft)}
table.wg td .c{display:inline-block;width:20px;height:20px;border-radius:6px;border:2px solid var(--line);vertical-align:middle}
table.wg td .c.y{background:var(--mint-bd);border-color:var(--mint-bd)}
table.wg td .c.f{border-style:dashed;opacity:.5}
table.wg td.tdc{background:var(--lav)!important}
/* плеер-симулятор и файлы */
.player{border-radius:14px;overflow:hidden;background:linear-gradient(135deg,#14372E,#1E4D3E);margin:14px 0 8px}
.player .scr{aspect-ratio:16/9;display:grid;place-items:center;position:relative}
.player .pl{width:64px;height:64px;border-radius:50%;background:var(--lime);display:grid;place-items:center;border:none}
.player .pl svg{width:24px;height:24px}

practices:[
 {id:"p1",t:"Дневник питания и симптомов",d:"ежедневно, 2 недели",core:1,
  body:["Записывайте каждый приём пищи, время и самочувствие через 1–2 часа.","Отмечайте изжогу, вздутие, тяжесть по шкале 0–10.","Через 2 недели найдите повторяющиеся связки «продукт → симптом»."],
  why:"Триггеры индивидуальны — без дневника их не найти."},
 {id:"p2",t:"Диафрагмальное дыхание",d:"5 минут в день",sym:["heartburn","fatigue"],types:["sens"],
  body:["Сядьте или лягте, ладонь на живот.","Глубокий вдох «в живот» — ладонь поднимается.","Выдох в два раза медленнее вдоха.","5 минут, лучше в одно и то же время."],
  why:"Ножки диафрагмы — часть антирефлюксного барьера; длинный выдох снижает тревогу."},
 {id:"p3",t:"Ходьба после еды",d:"10–20 минут",sym:["heaviness","heartburn"],types:["slow","mix"],
  body:["Спокойным шагом после обеда или ужина.","Без наклонов и нагрузки на пресс.","Интенсивные тренировки — не раньше чем через час после плотной еды."],
  why:"Ускоряет эвакуацию содержимого желудка."},
 {id:"p4",t:"Активация блуждающего нерва",d:"3–5 минут",types:["slow","sens","mix"],
  body:["Пение или громкое мычание 1–2 минуты.","Полоскание горла водой.","Умывание прохладной водой."],
  why:"Тонус блуждающего нерва запускает моторику желудка."},
 {id:"p5",t:"Мелатониновое окно",d:"каждый вечер",sym:["heartburn","fatigue"],core:0,
  body:["Ужин за 3–4 часа до сна.","Отбой так, чтобы спать в период 22:00–2:00.","При ночной изжоге — изголовье выше на 10–15 см, сон на левом боку."],
  why:"Мелатонин — лучший друг смыкания сфинктера."},
 {id:"p6",t:"Голодное окно между приёмами пищи",d:"3,5–5 часов",sym:["heaviness","bloating"],types:["slow","mix"],
  body:["3–5 полноценных приёмов пищи без постоянных перекусов.","Между ними — вода и травяной чай."],
  why:"Постоянные перекусы тормозят моторику желудка."},
 {id:"p7",t:"Тёплая вода небольшими порциями",d:"в течение дня",types:["sens"],sym:["stool"],
  body:["Вода 40–50 °С небольшими глотками между приёмами пищи.","При ночной изжоге не пить много перед сном."],
  why:"Мягко поддерживает моторику и успокаивает чувствительный кишечник."},
 {id:"p8",t:"Самомассаж живота",d:"5 минут утром",sym:["stool","bloating"],types:["sens"],
  body:["Тёплыми ладонями — круговые движения по часовой стрелке.","Без сильного давления, на выдохе.","Не делать сразу после еды."],
  why:"Помогает при вздутии и нерегулярном стуле."}
],

// until — ручная дата «Доступ до» (включительно), перекрывает расчёт.
var DAY_MS = 864e5;
function dayStart0(t) { var d = new Date(t); d.setHours(0, 0, 0, 0); return d.getTime(); }
function parseDate0(x) {
  if (!x) return 0;
  if (x instanceof Date) return x.getTime();
  var s = String(x).trim(), m = s.match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})/);
  if (m) return new Date(+m[3], +m[2] - 1, +m[1]).getTime();
  var t = new Date(s).getTime();
  return isNaN(t) ? 0 : t;
}
function accessCalc(o) {
  var start = parseDate0(o.start);
  if (!start && !o.until) return { end: '', last: '', closed: false, left: null, ext: 0 };
  var end = start ? dayStart0(start) + (Number(o.accessDays) || 90) * DAY_MS : 0;
  var exts = (o.exts || []).map(parseDate0).sort(function (a, b) { return a - b; });
  exts.forEach(function (p) { end = Math.max(end, p ? dayStart0(p) : 0) + (Number(o.extDays) || 60) * DAY_MS; });
  var u = parseDate0(o.until);
  if (u) end = dayStart0(u) + DAY_MS;
  var now = o.now || Date.now();
  return { end: new Date(end).toISOString(), last: new Date(end - DAY_MS).toISOString(), closed: now >= end,

// Каждый симптом в анкете помечен протоколами (V — Вялое, I — Воспалённое,
// C — Чувствительное). Ответ переводим в долю от максимума шкалы, делим
// поровну между помеченными протоколами и нормируем на «потолок» протокола.
// Если второй по силе протокол набирает ≥ MIX_RATIO от первого — Смешанный тип.
// Веса и порог подобраны по решениям кураторов потока 3.0 (259 анкет).
var PROTO_NAMES = { V: 'Вялое пищеварение', I: 'Воспалённое пищеварение', C: 'Чувствительное пищеварение', M: 'Смешанный тип' };
var PROTO_WEIGHTS = { V: 1, I: 2, C: 1.5 };
var MIX_RATIO = 0.62;
var SCALE_MAX = { s4: 4, r5: 5, ro: 2, na: 2, yes: 1 };

function protoCeilings(Q) {
  var t = { V: 0, I: 0, C: 0 };
  Q.blocks.forEach(function (b) { b.q.forEach(function (q) {
    var pr = q[3]; if (!pr) return;
    for (var i = 0; i < pr.length; i++) t[pr[i]] += 1 / pr.length;
  }); });
  return t;
}

// answers: { qid: номер варианта (1..max) }, diagnoses: [названия]
function autoProtocol(Q, answers, diagnoses, redFlags) {
  var ceil = protoCeilings(Q), raw = { V: 0, I: 0, C: 0 };
  Q.blocks.forEach(function (b) { b.q.forEach(function (q) {
    var v = answers[q[0]], pr = q[3]; if (!v || !pr) return;
    var w = v / SCALE_MAX[q[4]];
    for (var i = 0; i < pr.length; i++) raw[pr[i]] += w / pr.length;
  }); });
  var s = {};
  ['V', 'I', 'C'].forEach(function (k) { s[k] = raw[k] / ceil[k] * PROTO_WEIGHTS[k]; });
  var order = ['V', 'I', 'C'].sort(function (a, b) { return s[b] - s[a]; });
  var top = order[0], second = order[1], code;
  if (s[top] === 0) code = 'M';
  else code = (s[second] / s[top] >= MIX_RATIO) ? 'M' : top;
  var maxS = s[top] || 1, pct = {};
  ['V', 'I', 'C'].forEach(function (k) { pct[k] = Math.round(s[k] / maxS * 100); });
  return { code: code, name: PROTO_NAMES[code], pct: pct, redFlags: redFlags || [] };
}

// ═══ Общая логика подбора (кабинет и админка) ═════════════════════
function activeSym(sc){ sc=sc||{}; return SYM.filter(s=>(sc[s.k]||0)>=4).map(s=>s.k) }
function fits(it,type,sym,flags){
  if(it.core) return true;
  if(it.flag && flags.includes(it.flag)) return true;
  const tOk = it.types ? it.types.includes(type) : false;
  const sOk = it.sym ? it.sym.some(s=>sym.includes(s)) : false;
  return tOk || sOk;
}
// Материалы ученицы: уроки, специи и фитосоставы — строго по протоколу; практики — по протоколу и жалобам
function buildResult(type, quiz, hidden){
  quiz = quiz || {}; hidden = hidden || {};
  const sym = activeSym(quiz.scores), flags = quiz.flags || [];
  const R = { type, sym };
  R.lessons = CAT.lessons.filter(l=>(l.core||(l.types||[]).includes(type)) && !hidden[l.id]).map(l=>l.id);
  R.practices = CAT.practices.filter(p=>fits(p,type,sym,flags)||p.id==='p5'&&(sym.includes('heartburn')||sym.includes('fatigue'))).map(p=>p.id);
  R.spices = CAT.spices.filter(s=>s.types.includes(type)).map(s=>s.id);
  R.phyto = CAT.phyto.filter(f=>f.types.includes(type)).map(f=>f.id);
  return R;
}
// Ручные правки куратора поверх автоподбора: { add:[ID], rm:[ID] }
function applyOv(R, ov){
  if (!ov) return R; const add = ov.add || [], rm = ov.rm || [], out = Object.assign({}, R);
  ['lessons','practices','spices','phyto'].forEach(k => { out[k] = R[k].filter(id => !rm.includes(id)).concat(add.filter(id => catOf(id) === k && !R[k].includes(id))); });
  return out;
}

const aiName = k => PNAME[k] || ({ ind:'Индивидуальный протокол', unclear:'На уточнении' })[k] || '—';
function byId(id){for(const k in CAT){const f=CAT[k].find(x=>x.id===id);if(f) return f}return null}
function catOf(id){for(const k in CAT){if(CAT[k].some(x=>x.id===id)) return k}return null}
const ITEMS = QBLOCKS.flatMap(b=>b.items);
function labelOf(it,v){ if(!it||!v) return ''; if(it.k==='scale') return (it.react?SCALE_REACT:SCALE_STD)[v]||String(v); if(it.k==='opts'){const o=it.o.find(o=>o[0]===v);return o?o[1]:String(v)} return 'Да'; }
function dayNum(start){ return Math.max(1, Math.floor((dayStart(Date.now())-dayStart(start))/DAY)+1) }
function trackRowsT(type,w){const t=TRACK[type]||TRACK.slow;return t[w]||t[1]||TRACK.slow[1]}
function dayStatT(track,type,day){
  const w=Math.floor((day-1)/7)+1, rows=trackRowsT(type,w);
  const req=rows.map((r,i)=>r.o?null:i).filter(i=>i!==null);
  const d=req.filter(i=>track[day+':'+i]).length;
  return {d,n:req.length,p:Math.round(d/req.length*100)};
}
function weekStatT(track,type,today,w){
  const last=Math.min(today,w*7), first=(w-1)*7+1;
  if(last<first) return null;
  let d=0,n=0; for(let day=first;day<=last;day++){const s=dayStatT(track,type,day);d+=s.d;n+=s.n}
  return {d,n,p:n?Math.round(d/n*100):0};
}
// Из черновика анкеты — шкалы жалоб 0–10, особенности, ограничения и красные флаги
function deriveQuiz(q){
  const ans=q.ans||{};
  const sev=ids=>{ let m=0; ids.forEach(id=>{ const a=ans[id]; if(!a) return; const it=ITEMS.find(i=>i.id===id); if(!it) return; const mx=it.k==='scale'?it.max:2; m=Math.max(m,Math.round(a.v/mx*10)) }); return m };
  const ids=n=>(QBLOCKS.find(b=>b.n===n)||{items:[]}).items.map(i=>i.id);
  const scores={heartburn:sev(ids(5)),bloating:sev(ids(7)),heaviness:sev(ids(4).concat(['b10q4'])),stool:sev(ids(8)),fatigue:sev(['b10q2','b10q4'])};
  const diag=q.diag||[], excluded=q.excluded||[];
  const diet=[]; if(excluded.includes('milk')||diag.includes('Непереносимость лактозы / фруктозы')) diet.push('nolactose');
  if(diag.includes('Целиакия / непереносимость глютена')) diet.push('nogluten');
  const flags=[]; if(diag.includes('Удалён желчный пузырь')) flags.push('chole');
  if(/омепр|пантопр|рабепр|эзомепр|нексиум|лансопр/i.test(q.meds||'')) flags.push('ppi');
  const red=DIAGNOSES.filter(([d,r])=>r&&diag.includes(d)).map(([d])=>d); if(ans.b8q_flag) red.push('Чёрный смолистый кал');
  return {scores,flags,diet,red};
}
// Ответы для автоназначения: номер варианта по шкале анкеты (как в разметке потока 3.0)
function scoringAnswers(ans){
  const qs={}; Q.blocks.forEach(b=>b.q.forEach(x=>qs[x[0]]=x));
  const out={}; Object.keys(ans||{}).forEach(id=>{ const it=ITEMS.find(i=>i.id===id), q=qs[id]; if(!it||!q) return;
    out[id]= it.k==='yes' ? SCALE_MAX[q[4]] : ans[id].v; });
  return out;
}

// Анкета → данные для сервера (одна функция и для ученицы, и для демо-данных)
function quizPayload(q){
  const d=deriveQuiz(q), labels={}, raw={};
  Object.keys(q.ans||{}).forEach(id=>{ raw[id]=q.ans[id].v; labels[id]=q.ans[id].label||labelOf(ITEMS.find(i=>i.id===id),q.ans[id].v) });
  const h=+q.height/100, w=+q.weight, bmi=h>0&&w>0?(w/(h*h)).toFixed(1):'';
  return { personal:{fio:q.fio||'',sex:q.pol||'',age:q.age||'',height:q.height||'',weight:q.weight||'',waist:q.waist||'',bmi},
    answers:scoringAnswers(q.ans), raw, labels, gates:q.gates||{}, diagnoses:(q.gates&&q.gates.diag==='yes')?(q.diag||[]):[], chol:q.chol||'',
    products:q.b7prod||'', meds:q.meds||'', goals:q.goals||'',
    excluded:(q.excluded||[]).map(c=>(EXCLUDABLE.find(p=>p.code===c)||{name:c}).name), excludedCodes:q.excluded||[],
    productsOther:q.productsOther||'', free:q.free||'', redFlags:d.red, redAck:!!q.redAck,
    scores:d.scores, flags:d.flags, diet:d.diet, tongueLater:!!q.tongueLater,
    consent:{version:CONSENT_VERSION, at:new Date().toISOString()} };
}

// ═══ API ════════════════════════════════════════════════════════
async function api(action, params = {}) {
  if (MODE === 'demo') return Demo.call(action, params);
  let j;
  try {
    const r = await fetch(CFG.API_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(Object.assign({ action }, params)) });
    j = await r.json();
  } catch (e) { throw new Error('Нет связи с сервером. Проверьте интернет и попробуйте ещё раз.'); }
  if (!j.ok) throw new Error(j.error || 'Ошибка сервера');
  return j;
}

  return '';
}

function vLogin(){

  let head, body, btn;
  if (st === 'email') {
    head = `<h1>Вход в личный кабинет</h1><p style="margin:0">Введите e-mail, на который оформлена покупка курса.</p>`;
    body = `<div class="fld"><label for="l-email">E-mail</label><input class="inp" id="l-email" type="email" autocomplete="username" placeholder="name@mail.ru" value="${esc(em)}"></div>`;
    btn = V.busy ? 'Проверяем…' : 'Продолжить';
  } else if (st === 'create') {
    const n = (V.name || '').split(' ')[0];
    head = `<h1>${n ? esc(n) + ', добро' : 'Добро'} пожаловать!</h1><p style="margin:0">Вы входите впервые. Придумайте пароль — с ним вы будете заходить в кабинет с любого устройства. Запишите его, чтобы не забыть.</p>`;
    body = `<div class="who">E-mail: <b>${esc(em)}</b></div><input type="email" autocomplete="username" value="${esc(em)}" hidden>
      ${pw('l-p1','Пароль — минимум 6 символов','new-password')}${pw('l-p2','Повторите пароль','new-password')}`;
    btn = V.busy ? 'Сохраняем…' : 'Сохранить и войти';
  } else {
    head = `<h1>Вход в личный кабинет</h1><p style="margin:0">Введите пароль, который вы придумали при первом входе.</p>`;
    body = `<div class="who">E-mail: <b>${esc(em)}</b></div><input type="email" autocomplete="username" value="${esc(em)}" hidden>${pw('l-p1','Пароль','current-password')}`;
    btn = V.busy ? 'Входим…' : 'Войти';
  }
  const err = V.err ? `<div class="errbox" role="alert">${esc(V.err)}${V.notPaid ? `<div>${supportLink()}</div>` : ''}</div>` : '';
  const demo = MODE === 'demo' && st === 'email' ? `<div class="testnote" style="margin-top:22px">Демо-режим: данные хранятся только в этом браузере.<br>Тестовый вход: <button type="button" class="linkbtn" data-a="demoEmail" style="padding:0">admin@holistica.test</button> — пароль вы придумаете при первом входе.<br><button type="button" class="linkbtn" data-a="demoReset" style="padding:0">Сбросить демо-данные</button></div>` : '';
  return `<div class="top"><div class="sub">Формула здоровья ЖКТ</div>${head}</div>
  <form id="lf" novalidate><div class="fields one">${body}</div>${err}
  <button class="btn full" type="submit" style="margin-top:18px" ${V.busy ? 'disabled' : ''}>${btn}</button></form>
  ${st !== 'email' ? `<div class="row" style="justify-content:space-between;margin-top:12px"><button class="linkbtn" data-a="otherEmail">Другой e-mail</button>${st === 'password' ? `<button class="linkbtn" data-a="forgot">Забыли пароль?</button>` : ''}</div>` : ''}
  ${V.forgot ? `<div class="card" style="margin-top:12px"><p>Напишите куратору или в службу заботы: пароль сбросят, и при следующем входе вы придумаете новый.</p>${supportLink()}</div>` : ''}
  ${demo}${foot()}`;
}
async function doLogin(){
  if (V.busy) return;
  const st = V.step || 'email';
  const fail = (m, notPaid) => { V.busy = false; V.err = m; V.notPaid = !!notPaid; render(); };
  if (st === 'email') {
    const em = ($('#l-email').value || '').trim().toLowerCase(); V.email = em;
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)) return fail('Похоже, в адресе опечатка. Проверьте e-mail.');
    V.busy = true; V.err = ''; render();
    try { const r = await api('checkEmail', { email: em }); V = { s:'login', step: r.hasPassword ? 'password' : 'create', email: em, name: r.name }; render(); }
    catch (x) { fail(x.message, /не оформлена/.test(x.message)); }
    return;
  }
  const p1 = $('#l-p1').value;
  if (st === 'create') {
    const p2 = $('#l-p2').value;
    if (p1.length < 6) return fail('Пароль должен быть не короче 6 символов.');
    if (p1 !== p2) return fail('Пароли не совпадают.');
  } else if (!p1) return fail('Введите пароль.');
  V.busy = true; V.err = ''; render();
  try { const r = await api(st === 'create' ? 'setPassword' : 'login', { email: V.email, password: p1 }); S.token = r.token; LS.set(TOKEN_KEY, r.token); boot(); }
  catch (x) { fail(x.message, /не оформлена/.test(x.message)); }
}

  function assignList(id, q){
    const k = catOf(id);
    return C.filter(c => c.filled && (!q || c.name.toLowerCase().includes(q.toLowerCase()) || c.email.includes(q.toLowerCase()))).slice(0, 8).map(c => {
      const has = eff(c, k).includes(id);
      return `<div class="mi"><span class="tx"><b>${esc(c.name)}</b><span>${c.type ? TYPES[c.type].short : '—'} · ${esc(c.email)}</span></span>${has ? `<span class="chip g">уже есть</span>` : `<button class="btn sm" data-a="assign" data-cid="${esc(c.email)}" data-id="${id}">Назначить</button>`}</div>`;
    }).join('') || '<p class="small muted">Никого не нашлось.</p>';
  }
  async function saveOv(c, ov, log, msg){ c.ov = ov; return act(() => api('setOverrides', { token:S.token, email:c.email, ov, log }), msg); }
  function lessonActivity(c){
    const ls = eff(c, 'lessons').map(byId).sort((a, b) => a.w - b.w);
    const opened = ls.filter(l => c.state.lx[l.id]).length, done = ls.filter(l => c.state.done[l.id]).length;
    return fold('act', 'Уроки: заходы и отметки', `открыто ${opened} из ${ls.length} · отмечено ${done}`, `
    <div class="tw" style="border:none"><table class="t la"><thead><tr><th>Урок</th><th>Заходов</th><th>Последний заход</th><th>Отмечен просмотренным</th></tr></thead><tbody>
    ${ls.map(l => { const x = c.state.lx[l.id], lock = !wkOpenC(c, l.w);
      return `<tr><td><b>${esc(l.t)}</b><span class="sub">${WEEKSHORT[l.w]} · ${esc(l.d)}</span></td>
      <td>${lock ? `<span class="muted">откроется</span>` : x ? x.open : `<span class="muted">не открывал(а)</span>`}</td>
      <td>${x && x.last ? fmtDT(x.last) : '—'}</td><td>${c.state.done[l.id] ? '✓' : '—'}</td></tr>`; }).join('')}
    </tbody></table></div>`);
  }
  function histBlock(c){
    const all = c.events.slice().reverse().slice(0, 60);
    return `<div class="panel"><h2><span>История</span></h2><div class="hist">${all.map(x => `<div><span>${fmtDT(x['Дата'])}</span><span>${esc(EVN[x['Событие']] || x['Событие'])}${x['Объект'] ? ': ' + esc(x['Объект']) : ''}</span></div>`).join('') || '<p class="small muted">Событий пока нет.</p>'}</div></div>`;
  }

  // ── материалы ──
  function catalog(){
    const k = KF.k;
    const seg = (v, t) => `<button class="${KF.type === v ? 'on' : ''}" data-a="kf" data-k="type" data-v="${v}">${t}</button>`;
    const TABS = [['lessons','Уроки'],['practices','Практики'],['spices','Специи'],['phyto','Фитосоставы'],['trackers','Трекеры']];
    const tabs = `<div class="tabs">${TABS.map(([x, t]) => `<button class="${x === k ? 'on' : ''}" data-a="ktab" data-k="${x}">${t}<span>${x === 'trackers' ? Object.keys(TYPES).length : CAT[x].length}</span></button>`).join('')}</div>`;
    let body;
    if (k === 'trackers') {
      body = `<div class="cat">${Object.keys(TYPES).map(t => { const has = TRACK[t]; return `<button class="ci" data-a="trk" data-t="${t}"><span><b>Трекер · ${TYPES[t].name}</b><span class="tg">${has ? `<span class="chip">неделя 1 · ${TRACK[t][1].length} действий</span>` : `<span class="chip g">ещё не загружен — показывается трекер вялого типа</span>`}</span></span><span class="cnt"><b>${C.filter(c => c.assigned && c.type === t).length}</b>учениц</span></button>`; }).join('')}</div>`;
    } else {
      const q = KF.q.toLowerCase();
      let items = CAT[k].filter(it => !q || it.t.toLowerCase().includes(q));
      if (KF.type !== 'all') items = items.filter(it => it.core || (it.types && it.types.includes(KF.type)));
      if (k === 'lessons') items = items.slice().sort((a, b) => a.w - b.w);
      body = `<div class="cat">${items.map(it => { const n = C.filter(c => c.assigned && eff(c, k).includes(it.id)).length;
        return `<button class="ci" data-a="prev" data-id="${it.id}"><span><b>${esc(it.t)}</b><span class="small muted" style="display:block">${esc(meta(it))}${k === 'lessons' ? (linkOf(it.id).video ? ' · видео добавлено' : ' · видео ещё нет') : ''}</span><span class="tg">${tags(it) || `<span class="chip g">по жалобам</span>`}</span></span><span class="cnt"><b>${n}</b>${plural(n, ['ученица','ученицы','учениц'])}</span></button>`; }).join('') || `<p class="muted">Ничего не нашлось.</p>`}</div>`;
    }
    return `<div class="head"><div><h1>Материалы программы</h1><p class="muted" style="margin:0">Полный каталог. Откройте материал, чтобы посмотреть его глазами ученицы.</p></div></div>
    ${tabs}
    ${k !== 'trackers' ? `<div class="tools"><input class="inp" id="kq" placeholder="Поиск по названию" value="${esc(KF.q)}" style="flex:1 1 220px"><span class="seg">${seg('all','Все типы')}${Object.keys(TYPES).map(t => seg(t, TYPES[t].short)).join('')}</span></div>` : ''}
    ${body}
    <p class="small muted" style="margin-top:14px">Метки показывают, кому материал подбирается автоматически: по типу пищеварения или по жалобам (4+ из 10). Ссылки на видео и конспекты уроков — в листе «Уроки» Google-таблицы, колонки «Видео» и «Конспект».</p>`;
  }
  function preview(id){
    const it = byId(id), k = catOf(id);
    let v = '';
    if (k === 'lessons') { const L = linkOf(id); v = `<div class="video"><small>${L.video ? 'Видео: ' + esc(L.video) : 'Видео ещё не добавлено'}</small></div><div class="why"><b>Почему этот урок:</b> ${it.core ? 'общий раздел программы — для всех участников.' : 'урок протокола, выдаётся строго по протоколу.'}</div>${L.file ? `<p class="small"><b>Конспект:</b> <a href="${esc(L.file)}" target="_blank" rel="noopener">${esc(L.file)}</a></p>` : ''}`; }
    if (k === 'practices') v = `<div class="why"><b>Зачем:</b> ${it.why}</div><ol class="stp">${it.body.map(s => `<li>${s}</li>`).join('')}</ol>`;
    if (k === 'spices' || k === 'phyto') v = `<div class="why"><b>${k === 'spices' ? 'Чем помогает' : 'Зачем'}:</b> ${it.why}</div><p><b>${k === 'spices' ? 'Как использовать' : 'Как принимают'}.</b> ${it.use}</p>${k === 'phyto' ? `<p class="small muted">Ученица видит предупреждение: приём — только после согласования с врачом.</p>` : ''}`;
    const st = k === 'lessons' ? lstat(id) : null;
    const holders = C.filter(c => c.assigned && eff(c, k).includes(id)).length;
    return `<div class="top"><span class="chip">${CAT_ONE[k]}</span><button class="x" data-a="close" aria-label="Закрыть">×</button></div>
    <h2 style="font-size:20px">${esc(it.t)}</h2><p class="muted small">${esc(meta(it))}${k === 'lessons' ? ' · ID в листе «Уроки»: ' + id : ''}</p>
    <div class="tg" style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:14px">${tags(it)}</div>
    ${st ? `<div class="pv" style="margin-bottom:14px"><div class="lbl">Статистика урока</div><div class="kv3"><div><b>${st.open}/${st.hold}</b><span>открыли из назначенных</span></div><div><b>${st.done}</b><span>отметили просмотренным</span></div><div><b>${pctOf(st.done, st.hold)}%</b><span>доля прошедших</span></div></div></div>` : ''}
    <div class="pv"><div class="lbl">Так видит ученица</div>${v}</div>
    ${AV.s !== 'client' ? `<h2 style="margin-top:20px"><span>Назначить ученице</span></h2><input class="inp" id="asq" placeholder="Начните вводить имя" style="width:100%"><div class="pick" id="asl">${assignList(id, '')}</div>` : ''}
    <p class="small muted" style="margin-top:16px">Сейчас в программе у ${holders} ${plural(holders, ['ученицы','учениц','учениц'])}.</p>`;
  }
  function trackerView(t){
    const rows = (TRACK[t] || TRACK.slow)[1];
    return `<div class="top"><span class="chip">Трекер</span><button class="x" data-a="close" aria-label="Закрыть">×</button></div>
    <h2 style="font-size:20px">${TYPES[t].name} · неделя 1</h2>
    ${TRACK[t] ? '' : `<p class="ro">Трекер для этого типа ещё не загружен — ученицы видят трекер вялого типа.</p>`}
    <div class="twk"><table class="tk"><tbody>${rows.map(r => `<tr class="${r.a ? 'a' : ''}"><td>${r.t}${r.o ? ' <span class="muted">(по желанию)</span>' : ''}</td></tr>`).join('')}</tbody></table></div>
    <p class="small muted" style="margin-top:10px">*ГКВ — горячая / тёплая кипячёная вода.</p>`;
  }
  function addForm(){
    return `<div class="top"><h2 style="margin:0"><span>Добавить учениц</span></h2><button class="x" data-a="close" aria-label="Закрыть">×</button></div>
    <p class="small">Обычно это не нужно: ученицы из листа «Оплатили (GetCourse)» появляются сами при первом входе. Добавляйте вручную тех, кого нет в выгрузке, — например, тестовые адреса или кураторов.</p>
    <p class="small muted">По одной на строку: <b>email; Имя</b>. Для куратора добавьте третью часть: <b>email; Имя; куратор</b>.</p>
    <textarea class="inp area" id="addRows" placeholder="test@holistica.test; Тестовая ученица"></textarea>
    <div style="margin-top:10px"><button class="btn" data-a="addSave">Добавить</button></div>`;
  }
  const openDr = html => { $('#drp').innerHTML = html; $('#dr').classList.add('on'); $('#drp').scrollTop = 0; };
  const closeDr = () => $('#dr').classList.remove('on');

  // ── события ──
  function click(e, b, a){
    const c = AV.s === 'client' ? C.find(x => x.email === AV.id) : null;
    if (a === 'nav') { closeDr(); AV = { s:b.dataset.s }; if (AV.s === 'clients') CF.st = 'all'; render(); return window.scrollTo(0,0); }
    if (a === 'curf') { CF.cur = b.dataset.v; LS.set('hz_curf', CF.cur); return render(true); }
    if (a === 'navcur') { CF.cur = b.dataset.v; LS.set('hz_curf', CF.cur); CF.st = 'all'; AV = { s:'clients' }; render(); return window.scrollTo(0,0); }
    if (a === 'navq') { CF.st = b.dataset.st; AV = { s:'clients' }; render(); return window.scrollTo(0,0); }
    if (a === 'lp') { AV.lp = b.dataset.v; return render(true); }
    if (a === 'open') { closeDr(); AV = { s:'client', id:b.dataset.id, tab:'lessons' }; render(); return window.scrollTo(0,0); }
    if (a === 'cf') { CF[b.dataset.k] = b.dataset.v; return render(true); }
    if (a === 'kf') { KF[b.dataset.k] = b.dataset.v; return render(true); }
    if (a === 'ktab') { KF.k = b.dataset.k; return render(true); }
    if (a === 'ctab') { AV.tab = b.dataset.k; return render(true); }
    if (a === 'prev') { AV.lastPrev = b.dataset.id; return openDr(preview(b.dataset.id)); }
    if (a === 'cmf') { AV.cf = b.dataset.v; return render(true); }
    if (a === 'openChat') { closeDr(); AV = { s:'client', id:b.dataset.id, tab:'lessons' }; render(); const el = document.getElementById('chat'); if (el) el.scrollIntoView(); return; }
    if (a === 'cmReply') { const text = (b.previousElementSibling.value || '').trim(); if (!text) return toast('Напишите ответ');
      const lid = b.dataset.lid; return act(() => api('reply', { token:S.token, email:b.dataset.email, lessonId:lid, lessonTitle:(byId(lid) || {t:''}).t, text }), 'Ответ отправлен — ученица увидит его под уроком'); }
    if (a === 'pk') { AV.pk = b.dataset.k; return openDr(picker()); }
    if (a === 'assign') { const cc = C.find(x => x.email === b.dataset.cid), id = b.dataset.id; if (!cc) return;
      const ov = { add:(cc.ov.add || []).slice(), rm:(cc.ov.rm || []).filter(x => x !== id) }; if (!autoL(cc, catOf(id)).includes(id) && !ov.add.includes(id)) ov.add.push(id);
      return saveOv(cc, ov, 'Добавлено из каталога: ' + byId(id).t, 'Назначено: ' + cc.name).then(() => { if ($('#asl')) $('#asl').innerHTML = assignList(id, ($('#asq') || {}).value || ''); }); }
    if (a === 'trk') return openDr(trackerView(b.dataset.t));
    if (a === 'close') return closeDr();
    if (a === 'addOpen') return openDr(addForm());
    if (a === 'addSave') {
      const rows = ($('#addRows').value || '').split('\n').map(l => l.split(/[;,\t]/).map(x => x.trim())).filter(x => x[0] && x[0].includes('@'))
        .map(([email, name, role]) => ({ email, name:name || '', role:/кур|адм|admin|cur/i.test(role || '') ? (/адм|admin/i.test(role) ? 'админ' : 'куратор') : 'ученик' }));
      if (!rows.length) return toast('Не нашла ни одного e-mail');
      return act(async () => { const r = await api('addStudents', { token:S.token, rows }); closeDr(); toast('Добавлено: ' + r.added); });
    }
    if (a === 'refresh') return open();
    if (a === 'logout') return logout();
    if (a === 'demoResetA') { Demo.reset(); toast('Демо-данные сброшены'); return logout(); }
    if (a === 'preview') { U.pov = null; U.msgs = []; U.preview = true; U.pstart = ''; U.ptype = 'slow'; U.quiz = null; U.st = freshState(); U.links = (D && D.lessons) || {}; _RK = ''; return route(); }
    if (a === 'asStudent' && c) { U.pov = c.ov; U.msgs = c.msgs; U.preview = true; U.pstart = c.start; U.ptype = c.type; U.quiz = c.quiz; U.st = JSON.parse(JSON.stringify(c.state)); U.links = (D && D.lessons) || {}; _RK = ''; return route(); }
    if (!c) return;
    if (a === 'assignMe') return act(() => api('assignCurator', { token:S.token, email:c.email, curator:meEmail() }), 'Ученица закреплена за вами');
    if (a === 'demoExtend') return act(() => api('demoExtend', { token:S.token, email:c.email }), 'Продление добавлено (демо)');
    if (a === 'chatSend') { const text = ($('#chatIn').value || '').trim(); if (!text) return toast('Напишите сообщение');
      return act(() => api('reply', { token:S.token, email:c.email, lessonId:'', text }), 'Сообщение отправлено'); }
    if (a === 'addMat') { AV.pk = AV.tab || 'lessons'; AV.pq = ''; return openDr(picker()); }
    if (a === 'add') { const id = b.dataset.id, ov = { add:(c.ov.add || []).slice(), rm:(c.ov.rm || []).filter(x => x !== id) };
      if (!autoL(c, catOf(id)).includes(id) && !ov.add.includes(id)) ov.add.push(id);
      return saveOv(c, ov, 'Добавлено: ' + byId(id).t, 'Материал добавлен').then(() => openDr(picker())); }
    if (a === 'remove') { const id = b.dataset.id, ov = { add:(c.ov.add || []).slice(), rm:(c.ov.rm || []).slice() };
      if (ov.add.includes(id)) ov.add = ov.add.filter(x => x !== id); else ov.rm.push(id);
      return saveOv(c, ov, 'Убрано: ' + byId(id).t, 'Материал убран'); }
    if (a === 'restore') { const id = b.dataset.id, ov = { add:(c.ov.add || []).slice(), rm:(c.ov.rm || []).filter(x => x !== id) };
      return saveOv(c, ov, 'Возвращено: ' + byId(id).t, 'Материал возвращён'); }
    if (a === 'aiKeep') return act(() => api('aiResolve', { token:S.token, email:c.email, res:'keep' }), 'Оставлен протокол анкеты');
    if (a === 'aiSwitch') return act(() => api('aiResolve', { token:S.token, email:c.email, res:'switch' }), 'Выбран протокол, предложенный ИИ — проверьте и назначьте');
    if (a === 'aiRun') { b.disabled = true; b.textContent = 'Проверяем…';
      return act(async () => { const r = await api('aiRun', { token:S.token, email:c.email }); if (r.manual) toast('Ключ Claude API не задан — анкета добавлена в таблицу ИИ-проверки для ручной проверки'); }, 'Готово'); }
    if (a === 'confirm') { if (!c.photo || aiOpen(c)) return; const k = $('#proto').value, recs = $('#recs').value;
      return act(() => api('confirm', { token:S.token, email:c.email, protocol:PNAME[k], recs }), 'Протокол назначен — у ученицы открылась программа'); }
    if (a === 'saveRecs') return act(() => api('saveRecs', { token:S.token, email:c.email, recs:$('#recs').value }), 'Рекомендации сохранены — ученица видит их на главной');
    if (a === 'saveNote') return act(() => api('saveNote', { token:S.token, email:c.email, note:$('#note').value }), 'Заметка сохранена');
    if (a === 'resetAll') { if (!confirm(`Открыть анкету заново для ${c.name}? Ответы, протокол, рекомендации и прогресс будут сброшены.`)) return;
      return act(() => api('resetQuiz', { token:S.token, email:c.email }), 'Анкета открыта заново'); }
    if (a === 'resetProg') { if (!confirm(`Сбросить прогресс ${c.name}? Анкета и протокол сохранятся.`)) return;
      return act(() => api('resetProgress', { token:S.token, email:c.email }), 'Прогресс сброшен'); }
    if (a === 'resetPw') { if (!confirm(`Сбросить пароль для ${c.name}? При следующем входе она придумает новый.`)) return;
      return act(() => api('resetPassword', { token:S.token, email:c.email }), 'Пароль сброшен'); }
  }
  function change(e){
    if (e.target.id === 'curF') { CF.cur = e.target.value || 'all'; LS.set('hz_curf', CF.cur); return render(true); }
    if (e.target.id === 'curSel' && AV.s === 'client') { const c = C.find(x => x.email === AV.id); const v = e.target.value;
      return act(() => api('assignCurator', { token:S.token, email:c.email, curator:v }), v ? 'Куратор назначен: ' + curName(v) : 'Ученица откреплена'); }
    if (e.target.id === 'tariff' && AV.s === 'client') { const c = C.find(x => x.email === AV.id); return act(() => api('setTariff', { token:S.token, email:c.email, tariff:e.target.value }), 'Тариф сохранён'); }
    if (e.target.id !== 'proto' || AV.s !== 'client') return;
    const c = C.find(x => x.email === AV.id); if (!c || !c.assigned) return;
    const k = e.target.value;
    if (!confirm(`Сменить протокол на «${PNAME[k]}»?\n\nУроки, специи и фитосоставы у ученицы сменятся на материалы нового протокола.`)) { e.target.value = c.type; return; }
    act(() => api('confirm', { token:S.token, email:c.email, protocol:PNAME[k] }), 'Протокол изменён');
  }
  function input(e){
    const t = e.target;
    if (t.id === 'cq') { CF.q = t.value; const p = t.selectionStart; render(true); const n = $('#cq'); n.focus(); n.setSelectionRange(p, p); }
    if (t.id === 'pq') { AV.pq = t.value; const p = t.selectionStart; openDr(picker()); const n = $('#pq'); n.focus(); n.setSelectionRange(p, p); }
    if (t.id === 'asq') { $('#asl').innerHTML = assignList(AV.lastPrev, t.value); }
    if (t.id === 'kq') { KF.q = t.value; const p = t.selectionStart; render(true); const n = $('#kq'); n.focus(); n.setSelectionRange(p, p); }
  }
  return { fold(k, v){ AV.open = AV.open || {}; AV.open[k] = v; }, open, click, change, input, closeDr, reset(){ D = null; C = []; AV = { s:'over' }; }, get data(){ return D; }, set data(v){ if (!v) this.reset(); } };
})();

// ═══ Общие обработчики ═════════════════════════════════════════
document.addEventListener('click', e => {
  const b = e.target.closest('[data-a]'); if (!b) return;
  const a = b.dataset.a;
  if (b.closest('#A')) return Adm.click(e, b, a);
  if (b.closest('#U')) return studentClick(e, b, a);
});
document.addEventListener('change', e => { if (e.target.closest && e.target.closest('#A')) Adm.change(e); });
document.addEventListener('input', e => { if (e.target.closest && e.target.closest('#A')) Adm.input(e); });
document.addEventListener('toggle', e => { if (e.target.matches && e.target.matches('details.fold[data-k]')) Adm.fold(e.target.dataset.k, e.target.open); }, true);
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') Adm.closeDr();
  if (e.key === 'Enter' && e.target.matches && e.target.matches('tr[data-a=open]')) e.target.click();
});
$('#dr').addEventListener('click', e => { if (e.target.id === 'dr') Adm.closeDr(); });
boot();

</script>

</body>
</html>
