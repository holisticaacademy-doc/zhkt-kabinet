 "sens2_5": "<h4>Главное за 1 минуту<\/h4>\n<div class=\"lt-note\"><strong>6 универсальных привычек режима дня<\/strong> нужны при любом\nтипе пищеварения — вялом, чувствительном, воспалённом. Они налаживают\nвыработку соков, снижают хронический стресс, улучшают усвоение и\nэнергию. Это фронт работ на ближайшую неделю.<\/div>\n<h4>1. Сон вовремя: 22:00–02:00<\/h4>\n<figure class=\"lt-clock\"><img src=\"materials/infl/img/son_gormony.webp\" alt=\"Мелатонин 22:00–02:00, соматотропный гормон 23:00–02:00\" loading=\"lazy\"><\/figure>\n<div class=\"lt-tbl\"><table>\n<thead>\n<tr>\n<th><strong>Гормон<\/strong><\/th>\n<th><strong>Что делает для ЖКТ<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Мелатонин<\/strong> (шишковидная железа, 22:00–02:00)<\/td>\n<td>Защитный слой слизистых, заживление язв и эрозий, меньше избытка\nкислоты, профилактика ГЭРБ, меньше воспаления, рост полезных бактерий,\nместный иммунитет, барьерная функция кишечника, меньше боли при СРК,\nзащита от оксидативного стресса<\/td>\n<\/tr>\n<tr>\n<td><strong>Соматотропный гормон<\/strong> (гипофиз, 23:00–02:00)<\/td>\n<td>Восстановление и регенерация слизистой, больше ферментов\nподжелудочной, нормальная перистальтика, всасывание аминокислот, глюкозы\nи жиров, меньше воспаления при ВЗК, влияние на микробиоту, защита при\nстрессе<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Бонус:<\/strong> к 23:00 активизируется грелин (гормон голода)\n— если вы уже спите, вечернего «жора» не будет.<\/p>\n<p><strong>Как уложить себя вовремя:<\/strong> приглушённый тёплый свет;\nяркость экранов ниже за 1–2 часа до сна или фильтр синего; тёплый душ\nили ванночка для ног; дыхание животом; тёплый травяной чай (мелисса,\nромашка) или кипячёное молоко; подъём в 06:00–07:00; днём с 10:00 до\n14:00 — 20–30 минут на ярком свету.<\/p>\n<div class=\"lt-note\"><strong>Без налаженного сна<\/strong> справиться с чувствительным и\nвоспалённым типом пищеварения очень сложно: ЖКТ восстанавливается\nглавным образом во сне.<\/div>\n<h4>2. Достаточно сна: не менее 7–8 часов<\/h4>\n<p>Во сне работает парасимпатика — ЖКТ восстанавливается. Недосып\nвключает симпатику и тревожность. Для сна — <strong>тишина, темнота,\nпрохлада<\/strong>, при храпе партнёра — спать отдельно.\n<strong>Недоспали — ешьте чуть меньше обычного.<\/strong><\/p>\n<h4>3. Движение: 30–60 минут в день<\/h4>\n<p>Непрерывная активность низкой или средней интенсивности: прогулка,\nбег трусцой, велосипед, лыжи, танцы, йога, пилатес. Улучшает иннервацию\nи кровоток в ЖКТ, перистальтику, отток желчи. Без спешки и\nнапряжения.<\/p>\n<h4>4. Ритмичность приёмов пищи<\/h4>\n<p>Хаос и кусочничество сбивают гормоны голода и насыщения — соки\nвыделяются не вовремя. Нужны <strong>чёткие завтрак, обед, ужин (и\nперекусы) в одно и то же время<\/strong>.<\/p>\n<div class=\"lt-ins\"><strong>Задание:<\/strong> выпишите свой идеальный ритм питания —\nсколько раз и когда едите, объём, когда приходит голод, сколько держится\nсытость, комфортно ли после еды.<\/div>\n<h4>5. Тепло перед едой и во время еды<\/h4>\n<p>Крупные приёмы пищи — тёплые или горячие, напитки до и во время еды —\nтемпературы тела или выше. Тепло включает парасимпатику.<\/p>\n<h4>6. Во время еды — фокус на еде<\/h4>\n<p>Без телефона, новостей, ТВ и спешки. Замедлиться перед едой,\nпочувствовать запах и вкус, полюбоваться тарелкой, красиво сервировать\nстол. Лучше вкус — лучше соки и быстрее насыщение.<\/p>\n<h4>Чек-лист на неделю<\/h4>\n<ul class=\"lt-check\"><li>Ложусь так, чтобы спать с 22:00 до 02:00<\/li><li>Сплю не менее 7–8 часов<\/li><li>Двигаюсь 30–60 минут в день<\/li><li>Ем в одно и то же время, без кусочничества<\/li><li>Ем тёплую еду, пью тёплые напитки<\/li><li>Во время еды — фокус на еде<\/li><\/ul>",
 "sens2_6": "<h4>Главное за 1 минуту<\/h4>\n<div class=\"lt-note\">ЖКТ не работает сам по себе. <strong>Ключевой регулятор его работы —\nнервная система.<\/strong> Поэтому проблемы с пищеварением могут\nвозникать не от еды, а от стресса, недосыпа, спешки и эмоций.<\/div>\n<h4>Три «этажа» управления ЖКТ<\/h4>\n<div class=\"lt-tbl\"><table>\n<thead>\n<tr>\n<th><strong>Этаж<\/strong><\/th>\n<th><strong>Чем управляет<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Головной мозг<\/strong><\/td>\n<td>Аппетит, голод, насыщение, пищевое поведение и привычки (питание «по\nчасам» или хаотично, заедание эмоций, еда или отказ от еды на\nстрессе)<\/td>\n<\/tr>\n<tr>\n<td><strong>Вегетативная нервная система<\/strong><\/td>\n<td>Работает автономно. Симпатика и парасимпатика включаются по очереди,\nкак газ и тормоз<\/td>\n<\/tr>\n<tr>\n<td><strong>Энтеральная (метасимпатическая) нервная\nсистема<\/strong><\/td>\n<td>«Местный мозг кишечника» в стенках ЖКТ: перистальтика, слизь и\nферменты, реакция на объём и состав пищи, местный иммунитет. Может\nработать автономно<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h4>Симпатика и парасимпатика<\/h4>\n<div class=\"lt-tbl\"><table>\n<tbody>\n<tr>\n<td><h4>Парасимпатика: «спи, переваривай, отдыхай»<\/h4>\n<p>✔ усиливает перистальтику<\/p>\n<p>✔ активирует слюну, кислоту, желчь, ферменты<\/p>\n<p>✔ расширяет сосуды ЖКТ<\/p>\n<h4>→ пищеварение улучшается<\/h4><\/td>\n<td><h4>Симпатика: «бей, беги, работай»<\/h4>\n<p>✔ уменьшает секрецию<\/p>\n<p>✔ замедляет перистальтику<\/p>\n<p>✔ сужает сосуды ЖКТ<\/p>\n<h4>→ пищеварение «встаёт»<\/h4><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<div class=\"lt-tbl\"><table>\n<thead>\n<tr>\n<th><strong>Включает симпатику<\/strong><\/th>\n<th><strong>Включает парасимпатику<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Острый и хронический стресс, тревога<\/td>\n<td>Спокойствие и чувство безопасности<\/td>\n<\/tr>\n<tr>\n<td>Холод, голод, скачки сахара<\/td>\n<td>Сон в достаточном количестве (7–9 ч)<\/td>\n<\/tr>\n<tr>\n<td>Кофеин, крепкий чай, энергетики<\/td>\n<td>Тепло: ванна, душ, тёплая еда и напитки<\/td>\n<\/tr>\n<tr>\n<td>Еда на бегу, спешка, многозадачность<\/td>\n<td>Глубокое медленное дыхание<\/td>\n<\/tr>\n<tr>\n<td>Недосыпание, поздний отход ко сну<\/td>\n<td>Прогулки, спокойная ритмичная активность, йога<\/td>\n<\/tr>\n<tr>\n<td>Шум, яркий свет, громкие звуки<\/td>\n<td>Тишина, мягкий свет, природа<\/td>\n<\/tr>\n<tr>\n<td>Интенсивные тренировки<\/td>\n<td>Медитация, молитва, чтение, творчество, музыка<\/td>\n<\/tr>\n<tr>\n<td>Новости, соцсети, экраны перед сном<\/td>\n<td>Тёплая мягкая еда, осознанная спокойная трапеза<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<div class=\"lt-note\"><strong>Нужны обе системы.<\/strong> Проблема в том, что современный\nобраз жизни чаще включает симпатику. Напрямую управлять ею нельзя, но\nкосвенно — через образ жизни — можно.<\/div>\n<h4>Что помогает «местному мозгу» кишечника<\/h4>\n<p>Подходящий состав пищи (жиры, белки, клетчатка), низкий уровень\nвоспаления, здоровая микробиота, меньше хронического стресса, движение,\nосанка и диафрагмальное дыхание.<\/p>\n<h4>Стресс и ЖКТ<\/h4>\n<p><strong>Прямая связь со стрессом:<\/strong> синдром раздражённого\nкишечника, язвенная болезнь желудка и 12-перстной кишки («стресс-язва»),\nгастрит, функциональная диспепсия, ГЭРБ, дискинезия желчевыводящих\nпутей.<\/p>\n<p><strong>Как проявляется:<\/strong> «узел» в животе, ком в горле,\nдиарея («медвежья болезнь») или запоры («запор путешественника»),\nвздутие, тяга к сладкому и жирному, переедание или отказ от еды.<\/p>\n<div class=\"lt-note\"><strong>Контроль стресса — важная часть профилактики нарушений ЖКТ\nпри любом типе пищеварения, особенно при чувствительном и\nвоспалённом.<\/strong><\/div>",
 "sens2_7": "<h4>Главное за 1 минуту<\/h4>\n<div class=\"lt-note\">Перед активной работой с ЖКТ — мягкая очистка и снижение\nвоспалительного фона <strong>сорбентами<\/strong>. Они, как губка,\nсвязывают в кишечнике бактериальные токсины, избыток жёлчных кислот,\nнепереваренные остатки, аллергены, соли тяжёлых металлов, пищевой\nхолестерин, продукты воспаления, метаболиты гормонов. При чувствительном\nтипе — только <strong>мягкие, не раздражающие, не\nабразивные<\/strong>.<\/div>\n<h4>Правила<\/h4>\n<ul class=\"lt-check\"><li><strong>Интервал 1,5–2 часа<\/strong> с лекарствами и БАДами<\/li><li><strong>Не более 4–5 дней<\/strong><\/li><li><strong>+2 стакана жидкости в день<\/strong><\/li><li><strong>Склонность к запорам<\/strong> — при необходимости свечка с\nглицерином или микроклизма<\/li><\/ul>\n<h4>Не подходит<\/h4>\n<p>Активированный уголь, «Полисорб», белый уголь, каолин (глина). При\nлактазной недостаточности — формы «Смекты», «Фильтрума», «Энтеросгеля»\nсо вкусовыми добавками (могут содержать лактозу). Пектин (яблочный) —\nтолько если кишечник нормально переносит кислое.<\/p>\n<h4>Подходит: выберите один вариант<\/h4>\n<div class=\"lt-tbl\"><table>\n<thead>\n<tr>\n<th><strong>Вариант<\/strong><\/th>\n<th><strong>Как принимать / что это<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Псиллиум<\/strong><\/td>\n<td>1 ч. л. на стакан тёплой воды, 10 мин; через 1,5–2 ч после еды или\nвечером<\/td>\n<\/tr>\n<tr>\n<td><strong>Лён / льняная мука<\/strong><\/td>\n<td>1 ст. л. без горки развести водой, довести до кипения, 1–2 мин на\nогне, остудить; через 1,5–2 ч после еды<\/td>\n<\/tr>\n<tr>\n<td><strong>Семена чиа<\/strong><\/td>\n<td>1–2 ч. л. на 100–150 мл тёплой воды или компота (если переносите\nкислое), 10 мин, выпить с осадком<\/td>\n<\/tr>\n<tr>\n<td><strong>«Зостерин»<\/strong><\/td>\n<td>Некислый пектин из взморника — один из лучших для чувствительного\nтипа<\/td>\n<\/tr>\n<tr>\n<td><strong>«Лактофильтрум»<\/strong><\/td>\n<td>Лигнин + лактулоза, мягкий слабительный эффект<\/td>\n<\/tr>\n<tr>\n<td><strong>«Фитомуцил»<\/strong><\/td>\n<td>Псиллиум + слива, кисловатый<\/td>\n<\/tr>\n<tr>\n<td><strong>«Оптифайбер»<\/strong><\/td>\n<td>Мягкая клетчатка из циамопсиса, можно длительно<\/td>\n<\/tr>\n<tr>\n<td><strong>Рисовый суп-детокс<\/strong><\/td>\n<td>30 г басмати/жасмина замочить на час, промыть, 400 мл воды, куркума,\nзира, лавровый лист, 20 мин на минимальном огне. На ужин 2–3 дня, до\n1-го дня программы. Не при инсулинорезистентности и сильном вздутии на\nуглеводы<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<div class=\"lt-note\"><strong>Сорбенты не более 4–5 дней суммарно + больше воды = мягкая\nподготовка ЖКТ.<\/strong><\/div>",
 "sens2_8": "<h4>Схема питья на день<\/h4>\n<div class=\"lt-tbl\"><table>\n<thead>\n<tr>\n<th><strong>Когда<\/strong><\/th>\n<th><strong>Что и сколько<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Утром до завтрака<\/strong><\/td>\n<td>1–2 кружки горячей кипячёной воды (ГКВ)<\/td>\n<\/tr>\n<tr>\n<td><strong>До или во время обеда и ужина<\/strong><\/td>\n<td>По 1 кружке ГКВ (за 10–15 мин)<\/td>\n<\/tr>\n<tr>\n<td><strong>Между приёмами пищи<\/strong><\/td>\n<td>Чай против вздутия — по 100–200 мл, 0,5 л за день<\/td>\n<\/tr>\n<tr>\n<td><strong>В любое время, можно на перекус<\/strong><\/td>\n<td>Спазмолитический травяной чай — 1–2 кружки в день<\/td>\n<\/tr>\n<tr>\n<td><strong>В течение дня<\/strong><\/td>\n<td>Другие напитки по желанию<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h4>Горячая кипячёная вода<\/h4>\n<p><strong>40–55 °C<\/strong>, не обжигающая; летом прохладнее, зимой\nгорячее. <strong>3–4 стакана<\/strong> и больше по жажде; мало пьёте —\nначните с полстакана. Тепло снимает спазм органов и сфинктеров ЖКТ,\nусиливает кровоток, создаёт условия для ферментов (~40 °C). Термос с\nвечера; для вкуса — лимон, огурец, ягоды, мята.<\/p>\n<h4>Чай против вздутия<\/h4>\n<div class=\"lt-note\"><p><strong>Состав:<\/strong> цельные зира (кумин), фенхель (или\nукроп), кориандр — по 10 г, в равных долях, <strong>не\nмолоть<\/strong>.<\/p>\n<p><strong>Приготовление:<\/strong> 1 ч. л. смеси без горки на термос 500\nмл (½ ч. л. на 300 мл), залить ГКВ, 10 минут.<\/p>\n<p><strong>Как пить:<\/strong> тёплым по 100–200 мл между едой, с обеда —\n0,5 л за день. Вздутие стихает за 20–30 минут.<\/p>\n<p><strong>Действие:<\/strong> спазмолитик, противовоспалительное, мягко\nусиливает пищеварение, снимает «живот беременной» во второй половине\nдня, помогает усвоению, уменьшает спазмы при ПМС.<\/p><\/div>\n<div class=\"lt-note\"><strong>Нельзя:<\/strong> при острых воспалениях ЖКТ и\nнепереносимости. Дозировку ×½ — при беременности, ЖКБ, хронических\nвоспалениях. Не подходит зира или фенхель — просто уберите её.<\/div>\n<h4>Спазмолитические чаи<\/h4>\n<p>Ромашка + бадьян + мята; мелисса + бадьян + липа; тимьян + мелисса +\nшиповник (рецепты в 1-й неделе). 1–2 кружки тёплыми вместо чая: снимают\nспазм кишечника и ЖВП, мягко поддерживают желчеотток.<\/p>\n<h4>Ограничить / можно<\/h4>\n<div class=\"lt-tbl\"><table>\n<thead>\n<tr>\n<th><strong>Ограничить (усиливают рефлюкс)<\/strong><\/th>\n<th><strong>Можно вместо<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Кофе, крепкий чёрный чай, пуэр<\/td>\n<td>Некрепкий чёрный чай, ферментированный иван-чай<\/td>\n<\/tr>\n<tr>\n<td>Зелёный чай, матча<\/td>\n<td>Какао с молоком<\/td>\n<\/tr>\n<tr>\n<td>Газированные напитки, шампанское<\/td>\n<td>Компоты из сухофруктов<\/td>\n<\/tr>\n<tr>\n<td>Кислые соки и напитки, алкоголь<\/td>\n<td>Кисели (рецепты в меню)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>",
 "mix1_1": "<h4>Главное за 1 минуту<\/h4>\n<div class=\"lt-note\"><strong>Смешанный тип<\/strong> — не диагноз, а сочетание двух\nразнонаправленных проблем: <strong>ЖКТ работает вяло<\/strong> (снижены\nмоторика и секреция) и при этом есть <strong>хроническое\nвоспаление<\/strong> — в ЖКТ, в печени и желчевыводящих путях или\nсистемное. Задача программы — <strong>мягко усилить активность ЖКТ, не\nподняв воспаление<\/strong>.<\/div>\n<h4>Признаки<\/h4>\n<p><strong>Вялость:<\/strong> тяжесть после еды; слабые тупые боли\nсправа; вздутие через 30–60 мин после еды; газы даже от прохладной воды;\nеда «стоит»; переполненность; нет аппетита до 11–12 ч; изжога на мучное,\nсладкое, крахмалистое; отрыжка; тошнота на жирное и белковое; запоры или\nдиарея; тонкий белый налёт на языке.<\/p>\n<p><strong>Воспаление:<\/strong> гастрит, ГЭРБ, дуоденит, холецистит,\nпанкреатит, ВЗК, дисбиоз, СИБР, H. pylori; хронический гепатит,\nстеатогепатит, синдром Жильбера; воспаление тонкой кишки после удаления\nжёлчного; системное воспаление (аллергии, гипертензия,\nаутоиммунные).<\/p>\n<h4>Риски<\/h4>\n<p>Дефициты белка, железа, B12, B9 → хуже обмен веществ, энергия,\nсопротивляемость; дисбиоз; сладж → ЖКБ → удаление пузыря; жировая\nболезнь печени; прогрессирование воспаления. Каскад Корреа: гастрит →\nатрофия → метаплазия → дисплазия → онкология (часто без острых\nболей).<\/p>\n<h4>Обследования (необязательно для программы)<\/h4>\n<div class=\"lt-tbl\"><table>\n<thead>\n<tr>\n<th><strong>Обследование<\/strong><\/th>\n<th><strong>Что показывает<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>УЗИ брюшной полости<\/strong><\/td>\n<td>Жёлчный (стенки, сладж, камни, полипы), печень (гепатоз),\nподжелудочная (липоматоз)<\/td>\n<\/tr>\n<tr>\n<td><strong>«Гастропанель» / ФГДС / pH-метрия<\/strong><\/td>\n<td>Атрофия, воспаление, кислотность, H. pylori, рефлюксы; ФГДС после 45\nлет — раз в 2–3 года<\/td>\n<\/tr>\n<tr>\n<td><strong>АСТ, АЛТ, ГГТ, ЩФ, билирубин<\/strong><\/td>\n<td>Печень и желчь<\/td>\n<\/tr>\n<tr>\n<td><strong>Белок, альбумин; ОАК, ферритин, B12, B9<\/strong><\/td>\n<td>Усвоение белка, дефицит железа<\/td>\n<\/tr>\n<tr>\n<td><strong>СРБ, СОЭ<\/strong><\/td>\n<td>Уровень воспаления<\/td>\n<\/tr>\n<tr>\n<td><strong>Кальпротектин, скрытая кровь<\/strong><\/td>\n<td>Воспаление в кишечнике → по показаниям колоноскопия<\/td>\n<\/tr>\n<tr>\n<td><strong>Панкреатическая эластаза; копрограмма<\/strong><\/td>\n<td>Ферменты поджелудочной; общая картина ЖКТ и динамика<\/td>\n<\/tr>\n<tr>\n<td><strong>Водородно-дыхательный тест<\/strong><\/td>\n<td>СИБР, непереносимость лактозы, фруктозы<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<div class=\"lt-warn\"><div><strong>Важно:<\/strong> список и интерпретация — у\nгастроэнтеролога.<\/div><\/div>\n<h4>Как будем работать<\/h4>\n<p>Режим дня → регуляция нервной системы → коррекция питания (убрать\nмешающее и воспалительное, добавить мягкие стимуляторы) → меню из\nлегкоусвояемых блюд → специи и травы → домашние процедуры.<\/p>\n<div class=\"lt-note\"><strong>Цель: моторика и желчеотток, усвоение, нервная регуляция,\nпрофилактика воспаления, энергия.<\/strong><\/div>",
 "mix2_2": "<h4>Главное за 1 минуту<\/h4>\n<div class=\"lt-note\"><strong>Смешанный тип<\/strong> = низкоуровневое «спящее» хроническое\nвоспаление (в ЖКТ, печени и жёлчных путях, после удаления жёлчного или\nсистемное) + сниженная активность ЖКТ. Главная причина воспаления —\n<strong>ослабление защитных факторов слизистой<\/strong> (муциновый и\nбикарбонатный слой); остальное — триггеры. Задача: убрать воспаление и\nслегка взбодрить ЖКТ.<\/div>\n<h4>Почему снижена активность ЖКТ<\/h4>\n<p>Длительное хроническое воспаление (клетки разрушаются — меньше соков\nи ферментов); хронический стресс, недосып; гиподинамия, плохая осанка;\nхолодная еда и напитки, сладкое, тяжёлое, мучное, обволакивающее;\nстрогие диеты (дефицит B1, магния, железа, цинка); переедание, еда на\nночь, лежать после еды, холодная вода; бариатрия; гипотиреоз, депрессия,\nВСД, неврозы, СД 2; антациды, ИПП, антидепрессанты, бета-блокаторы;\nвозраст; конституция Капха.<\/p>\n<h4>Почему возникло воспаление<\/h4>\n<p>Ослабление защиты слизистой + острый стресс; инфекции (H. pylori,\nсальмонелла, вирусы); долгий приём НПВС, гормонов, железа, калия,\nантибиотиков, цитостатиков; дисбиоз; удаление жёлчного; другие\nзаболевания; курение; триггеры в питании (жареное, жирное, кислое,\nалкоголь, кофе, газировка) — <strong>спусковой крючок, а не\nпричина<\/strong>.<\/p>\n<h4>Жалоба → что за ней стоит<\/h4>\n<div class=\"lt-tbl\"><table>\n<thead>\n<tr>\n<th><strong>Где<\/strong><\/th>\n<th><strong>Жалоба<\/strong><\/th>\n<th><strong>Что означает<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Язык<\/td>\n<td>Тонкий белый налёт / отпечатки зубов<\/td>\n<td>Медленное переваривание, дисбиоз / отёк: слабая поджелудочная (и\nщитовидная)<\/td>\n<\/tr>\n<tr>\n<td>Желудок<\/td>\n<td>Тяжесть, переполненность<\/td>\n<td>Медленная эвакуация; диспепсия, гастрит, атрофия, гастропарез<\/td>\n<\/tr>\n<tr>\n<td>Желудок<\/td>\n<td>Отрыжка<\/td>\n<td>Заглатывание воздуха; несмыкание сфинктера, ГЭРБ<\/td>\n<\/tr>\n<tr>\n<td>Пищевод<\/td>\n<td>Изжога на сладкое, мучное, крахмалистое<\/td>\n<td>Пища задерживается в желудке → рефлюкс<\/td>\n<\/tr>\n<tr>\n<td>Пищевод<\/td>\n<td>Изжога на кислое, жгучее, горькое<\/td>\n<td>Воспаление в пищеводе/желудке; ГЭРБ, ГПОД<\/td>\n<\/tr>\n<tr>\n<td>Желудок<\/td>\n<td>Боли натощак, через 1–1,5 ч, на кислое<\/td>\n<td>Гастрит (поверхностный, эрозивный), язва<\/td>\n<\/tr>\n<tr>\n<td>Правое подреберье<\/td>\n<td>Слабые тупые боли<\/td>\n<td>Застой желчи: гипокинетическая дискинезия, сладж; риск камней<\/td>\n<\/tr>\n<tr>\n<td>Правое подреберье<\/td>\n<td>Колющие боли после жирного<\/td>\n<td>Холецистит, гипермоторная дискинезия, камни<\/td>\n<\/tr>\n<tr>\n<td>Центр живота<\/td>\n<td>Вздутие через 30–60 мин после еды<\/td>\n<td>Нехватка ферментов поджелудочной и кишечника, желчи;\nнепереносимости<\/td>\n<\/tr>\n<tr>\n<td>Центр, левое подреберье<\/td>\n<td>Опоясывающие боли в спину<\/td>\n<td>Приступ хронического панкреатита (редко)<\/td>\n<\/tr>\n<tr>\n<td>Тонкая кишка<\/td>\n<td>Боли через 1–2 ч после еды<\/td>\n<td>Дуоденит, язва ДПК, энтерит, колит, Крон<\/td>\n<\/tr>\n<tr>\n<td>Кишечник<\/td>\n<td>Вздутие во второй половине дня; газы от клетчатки<\/td>\n<td>СРК, дисбиоз<\/td>\n<\/tr>\n<tr>\n<td>Кишечник<\/td>\n<td>Вздутие на ферментированное и пробиотики<\/td>\n<td>СИБР<\/td>\n<\/tr>\n<tr>\n<td>Кишечник<\/td>\n<td>Диарея, слизь / запоры<\/td>\n<td>ВЗК, ферменты, гипермоторный жёлчный, СИБР, СРК / моторика,\nмикробиом, образ жизни<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>",
 "mix2_3": "<h4>Главное за 1 минуту<\/h4>\n<div class=\"lt-note\"><p>Каждый организм уникален, и отклик тела на еду, специи,\nфитосоставы тоже. Чтобы собрать свою формулу ЖКТ, на программе\nиспользуем <strong>два инструмента<\/strong>:<\/p>\n<ul>\n<li><strong>Дневник симптомов и ощущений<\/strong> — связь еды и\nрежима питания с ощущениями;<\/li>\n<li><strong>Трекер самочувствия<\/strong> — как меняется самочувствие\nв целом по дням недели.<\/li>\n<\/ul><\/div>\n<h4>Тест «Где вы сейчас?»<\/h4>\n<div class=\"lt-tbl\"><table>\n<thead>\n<tr>\n<th><strong>Вопрос<\/strong><\/th>\n<th><strong>5 баллов<\/strong><\/th>\n<th><strong>3 балла<\/strong><\/th>\n<th><strong>1 балл<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Часто замечаете связь между едой и самочувствием?<\/td>\n<td>Всегда<\/td>\n<td>Иногда<\/td>\n<td>Никогда<\/td>\n<\/tr>\n<tr>\n<td>Что делаете при тяжести после еды?<\/td>\n<td>Анализирую, что съел(а)<\/td>\n<td>Пью таблетку<\/td>\n<td>Игнорирую<\/td>\n<\/tr>\n<tr>\n<td>Как часто отслеживаете стул?<\/td>\n<td>Ежедневно<\/td>\n<td>Редко<\/td>\n<td>Никогда<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>12–15<\/strong> — вы детектив своего здоровья.\n<strong>6–11<\/strong> — вы на пути: заполняйте Дневник и Трекер.\n<strong>3–5<\/strong> — время начать диалог с телом, сегодня.<\/p>\n<h4>Дневник: что и как записывать<\/h4>\n<p><strong>Отслеживаем:<\/strong> регулярность приёмов пищи; аппетит и\nтягу к еде; стул (регулярность, частота, тип); качество и\nпродолжительность сна (засыпание, просыпания); энергию в течение дня;\nнастроение и стресс; ваши симптомы (кожа, давление, головные боли).<\/p>\n<ul>\n<li><strong>1–2 раза в день<\/strong> (утро и/или вечер), но каждый\nдень.<\/li>\n<li><strong>Честность важнее «как правильно»<\/strong> — записывайте и\nкусочничество, и тягу к сладкому.<\/li>\n<li><strong>Фокус на паттерны<\/strong>, а не на единичные случаи\n(стресс утром → тяга к сладкому днём).<\/li>\n<li><strong>Колонки:<\/strong> приём пищи и время → блюда/напитки\n(можно фотографировать еду днём) → ощущения. Отдельно — стул и\nсон.<\/li>\n<\/ul>\n<h4>Трекер: формат и шкала<\/h4>\n<div class=\"lt-tbl\"><table>\n<thead>\n<tr>\n<th><strong>Формат<\/strong><\/th>\n<th><strong>Шкала (выберите одну)<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Бумажный<\/strong> — распечатка или от руки, со своими\nзначками (лампочка — энергия, «zzz» — сон)<\/td>\n<td><strong>Баллы 1–10<\/strong>: 1 — очень плохо, 10 — отлично<\/td>\n<\/tr>\n<tr>\n<td><strong>Цифровой<\/strong> — Google/Excel с автоподсчётом, удобно\nвносить с телефона сразу<\/td>\n<td><strong>Смайлики<\/strong>: хорошо / нормально / трудный день<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><strong>Цвет<\/strong>: зелёный — отлично, жёлтый — умеренный\nдискомфорт, красный — симптом<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Строки — дни недели, столбцы — ваши параметры (аппетит, тяга к\nсладкому, еда после 20:00, стул, сон, энергия, ваш симптом). В конце —\n<strong>итог дня<\/strong> и <strong>итог недели<\/strong>. Женщинам —\nотмечать день цикла.<\/p>\n<h4>Анализ в конце недели: 3 шага<\/h4>\n<ol>\n<li><strong>Ищите связи.<\/strong> Триггеры ухудшений (бананы →\nвздутие; недосып → тяга к сладкому) и факторы улучшений (бульон на ужин\n→ лёгкий стул утром).<\/li>\n<li><strong>Сравните лучший и худший день.<\/strong> Что ели, как\nспали, какие эмоции? Какие симптомы были и что «ДО» могло их вызвать?\nКакие триггеры повторяются в «красные» дни?<\/li>\n<li><strong>Создавайте заметки.<\/strong> «Когда я ем ___, в животе\n___ и энергия ___»; «Когда я ем/пью ___, хожу в туалет лучше/хуже»;\nзамены: кофе натощак → изжога → цикорий или чай из программы.<\/li>\n<\/ol>\n<div class=\"lt-note\"><strong>Вопрос себе: «Что ЛУЧШЕЕ из этого дня я могу повторить\nзавтра?»<\/strong><\/div>\n<h4>Запомнить: Дневник и Трекер — это эксперимент<\/h4>\n<div class=\"lt-tbl\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th><strong>Правило<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>7<\/strong><\/td>\n<td>дней трекинга — минимум для выявления паттернов<\/td>\n<\/tr>\n<tr>\n<td><strong>3+<\/strong><\/td>\n<td>параметра — минимум для комплексной оценки<\/td>\n<\/tr>\n<tr>\n<td><strong>Анализ<\/strong><\/td>\n<td>лучшего и худшего дня → план на следующую неделю<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>",
 "mix2_4": "<h4>Главное за 1 минуту<\/h4>\n<div class=\"lt-note\"><p><strong>Здоровье ЖКТ = здоровье всего тела.<\/strong> Пищеварение\nвлияет на поступление питательных веществ, энергию и митохондрии, мозг и\nнервную систему, печень, уровень воспаления, сон и настроение, кожу и\nсуставы, репродуктивное здоровье, иммунитет.<\/p>\n<p><strong>ЖКТ — последовательный конвейер.<\/strong> Пища механически и\nхимически обрабатывается, мелкие молекулы всасываются в кровь и лимфу.\nВсе отделы работают в связке, как оркестр: сбой в одном звене влияет на\nвсё пищеварение.<\/p><\/div>\n<h4>Этапы пищеварения<\/h4>\n<div class=\"lt-tbl\"><table>\n<thead>\n<tr>\n<th><strong>Этап<\/strong><\/th>\n<th><strong>Что происходит<\/strong><\/th>\n<th><strong>Хорошая работа — это<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Мозг<\/strong><\/td>\n<td>Пищевой центр гипоталамуса. Голод: состав крови, сигналы нервов ЖКТ,\nвид/запах/мысли о еде → запуск соков. Насыщение: наполнение желудка,\nсостав пищи, гормоны ЖКТ и лептин, осознанная еда<\/td>\n<td>Голод и насыщение приходят естественно и вовремя<\/td>\n<\/tr>\n<tr>\n<td><strong>Рот<\/strong><\/td>\n<td>Анализ вкуса; слюна: размягчение, лизоцим, начало переваривания\nуглеводов; жевание, глотание<\/td>\n<td>Сигнал желудку и поджелудочной готовить соки<\/td>\n<\/tr>\n<tr>\n<td><strong>Желудок<\/strong><\/td>\n<td>3 слоя мышц перемешивают пищу; соляная кислота (pH ≈ 1), пепсин и\nдр.; первичное расщепление белков; транспортные белки для железа и B12;\nбактерицидная обработка; защитный муцин<\/td>\n<td>Расщепление белков; усвоение железа, B12, кальция, цинка, магния,\nмеди; барьер от инфекций; нет тяжести, болей, изжоги, отрыжки<\/td>\n<\/tr>\n<tr>\n<td><strong>Тонкая кишка (7–8 м)<\/strong><\/td>\n<td>12-перстная — переваривание; тощая — всасывание; подвздошная — B12 и\nтранзит. Работают желчь, ферменты поджелудочной и кишечника<\/td>\n<td>Мелкие молекулы всасываются через избирательно проницаемую\nстенку<\/td>\n<\/tr>\n<tr>\n<td><strong>Поджелудочная<\/strong><\/td>\n<td>Проферменты (липаза, протеаза, амилаза, трипсин, химотрипсин) под\nсостав пищи, активируются в 12-перстной кишке; инсулин и глюкагон<\/td>\n<td>Полное переваривание БЖУ, усвоение ПНЖК и витаминов A, E, K, D; нет\nгазов, вздутия, диареи<\/td>\n<\/tr>\n<tr>\n<td><strong>Желчь<\/strong><\/td>\n<td>Молодая (печёночная) → зрелая (пузырная). Щелочная среда, активация\nферментов, эмульгация жиров, перистальтика, бактерицидность<\/td>\n<td>Усвоение жиров, витаминов, аминокислот и сахаров; здоровая\nмикрофлора; регулярный стул<\/td>\n<\/tr>\n<tr>\n<td><strong>Ферменты тонкой кишки<\/strong><\/td>\n<td>Пристеночное пищеварение на щёточной кайме (до 200 м²): сахароза,\nлактоза, изомальтоза, пептиды и др.<\/td>\n<td>Нет брожения и дефицитов, ритмичный стул<\/td>\n<\/tr>\n<tr>\n<td><strong>Толстая кишка<\/strong><\/td>\n<td>Вода, электролиты, витамины K и B; каловые массы; иммунный надзор;\n~100 трлн бактерий: клетчатка, витамины, КЖК, связь с мозгом и\nкожей<\/td>\n<td>Сформированный стул, низкое воспаление, нет патогенов, здоровье\nвсего организма<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<div class=\"lt-note\"><strong>Когда есть?<\/strong> По голоду. Голод — природный регулятор\nпищевого поведения; полное отсутствие голода опасно. Голодом и\nнасыщением можно управлять: питанием, композицией приёмов пищи, режимом,\nработой со стрессом и микробиотой.<\/div>\n<h4>Чек-лист здорового пищеварения<\/h4>\n<p><strong>Это не идеал, а ориентир:<\/strong> если есть 80–90 % пунктов\n— ЖКТ работает хорошо.<\/p>\n<ul class=\"lt-check\"><li>Голод и насыщение приходят естественно и вовремя<\/li><li>Нет постоянной тяги к сладкому, мучному<\/li><li>Здоровый вес<\/li><li>Пища переваривается без тяжести<\/li><li>Нет хронического вздутия, урчания, отрыжки, изжоги<\/li><li>Стул ежедневный, оформленный, без боли (1–3 раза в день)<\/li><li>Кожа чистая, энергия стабильна, настроение ровное<\/li><\/ul>",
 "mix2_6": "<h4>Главное за 1 минуту<\/h4>\n<div class=\"lt-note\">ЖКТ не работает сам по себе. <strong>Ключевой регулятор его работы —\nнервная система.<\/strong> Поэтому проблемы с пищеварением могут\nвозникать не от еды, а от стресса, недосыпа, спешки и эмоций.<\/div>\n<h4>Три «этажа» управления ЖКТ<\/h4>\n<div class=\"lt-tbl\"><table>\n<thead>\n<tr>\n<th><strong>Этаж<\/strong><\/th>\n<th><strong>Чем управляет<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Головной мозг<\/strong><\/td>\n<td>Аппетит, голод, насыщение, пищевое поведение и привычки (питание «по\nчасам» или хаотично, заедание эмоций, еда или отказ от еды на\nстрессе)<\/td>\n<\/tr>\n<tr>\n<td><strong>Вегетативная нервная система<\/strong><\/td>\n<td>Работает автономно. Симпатика и парасимпатика включаются по очереди,\nкак газ и тормоз<\/td>\n<\/tr>\n<tr>\n<td><strong>Энтеральная (метасимпатическая) нервная\nсистема<\/strong><\/td>\n<td>«Местный мозг кишечника» в стенках ЖКТ: перистальтика, слизь и\nферменты, реакция на объём и состав пищи, местный иммунитет. Может\nработать автономно<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h4>Симпатика и парасимпатика<\/h4>\n<div class=\"lt-tbl\"><table>\n<tbody>\n<tr>\n<td><h4>Парасимпатика: «спи, переваривай, отдыхай»<\/h4>\n<p>✔ усиливает перистальтику<\/p>\n<p>✔ активирует слюну, кислоту, желчь, ферменты<\/p>\n<p>✔ расширяет сосуды ЖКТ<\/p>\n<h4>→ пищеварение улучшается<\/h4><\/td>\n<td><h4>Симпатика: «бей, беги, работай»<\/h4>\n<p>✔ уменьшает секрецию<\/p>\n<p>✔ замедляет перистальтику<\/p>\n<p>✔ сужает сосуды ЖКТ<\/p>\n<h4>→ пищеварение «встаёт»<\/h4><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<div class=\"lt-tbl\"><table>\n<thead>\n<tr>\n<th><strong>Включает симпатику<\/strong><\/th>\n<th><strong>Включает парасимпатику<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Острый и хронический стресс, тревога<\/td>\n<td>Спокойствие и чувство безопасности<\/td>\n<\/tr>\n<tr>\n<td>Холод, голод, скачки сахара<\/td>\n<td>Сон в достаточном количестве (7–9 ч)<\/td>\n<\/tr>\n<tr>\n<td>Кофеин, крепкий чай, энергетики<\/td>\n<td>Тепло: ванна, душ, тёплая еда и напитки<\/td>\n<\/tr>\n<tr>\n<td>Еда на бегу, спешка, многозадачность<\/td>\n<td>Глубокое медленное дыхание<\/td>\n<\/tr>\n<tr>\n<td>Недосыпание, поздний отход ко сну<\/td>\n<td>Прогулки, спокойная ритмичная активность, йога<\/td>\n<\/tr>\n<tr>\n<td>Шум, яркий свет, громкие звуки<\/td>\n<td>Тишина, мягкий свет, природа<\/td>\n<\/tr>\n<tr>\n<td>Интенсивные тренировки<\/td>\n<td>Медитация, молитва, чтение, творчество, музыка<\/td>\n<\/tr>\n<tr>\n<td>Новости, соцсети, экраны перед сном<\/td>\n<td>Тёплая мягкая еда, осознанная спокойная трапеза<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<div class=\"lt-note\"><strong>Нужны обе системы.<\/strong> Проблема в том, что современный\nобраз жизни чаще включает симпатику. Напрямую управлять ею нельзя, но\nкосвенно — через образ жизни — можно.<\/div>\n<h4>Что помогает «местному мозгу» кишечника<\/h4>\n<p>Подходящий состав пищи (жиры, белки, клетчатка), низкий уровень\nвоспаления, здоровая микробиота, меньше хронического стресса, движение,\nосанка и диафрагмальное дыхание.<\/p>\n<h4>Стресс и ЖКТ<\/h4>\n<p><strong>Прямая связь со стрессом:<\/strong> синдром раздражённого\nкишечника, язвенная болезнь желудка и 12-перстной кишки («стресс-язва»),\nгастрит, функциональная диспепсия, ГЭРБ, дискинезия желчевыводящих\nпутей.<\/p>\n<p><strong>Как проявляется:<\/strong> «узел» в животе, ком в горле,\nдиарея («медвежья болезнь») или запоры («запор путешественника»),\nвздутие, тяга к сладкому и жирному, переедание или отказ от еды.<\/p>\n<div class=\"lt-note\"><strong>Контроль стресса — важная часть профилактики нарушений ЖКТ\nпри любом типе пищеварения, особенно при чувствительном и\nвоспалённом.<\/strong><\/div>",
 "mix2_5": "<h4>Главное за 1 минуту<\/h4>\n<div class=\"lt-note\"><strong>6 универсальных привычек режима дня<\/strong> нужны при любом\nтипе пищеварения — вялом, чувствительном, воспалённом. Они налаживают\nвыработку соков, снижают хронический стресс, улучшают усвоение и\nэнергию. Это фронт работ на ближайшую неделю.<\/div>\n<h4>1. Сон вовремя: 22:00–02:00<\/h4>\n<figure class=\"lt-clock\"><img src=\"materials/infl/img/son_gormony.webp\" alt=\"Мелатонин 22:00–02:00, соматотропный гормон 23:00–02:00\" loading=\"lazy\"><\/figure>\n<div class=\"lt-tbl\"><table>\n<thead>\n<tr>\n<th><strong>Гормон<\/strong><\/th>\n<th><strong>Что делает для ЖКТ<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Мелатонин<\/strong> (шишковидная железа, 22:00–02:00)<\/td>\n<td>Защитный слой слизистых, заживление язв и эрозий, меньше избытка\nкислоты, профилактика ГЭРБ, меньше воспаления, рост полезных бактерий,\nместный иммунитет, барьерная функция кишечника, меньше боли при СРК,\nзащита от оксидативного стресса<\/td>\n<\/tr>\n<tr>\n<td><strong>Соматотропный гормон<\/strong> (гипофиз, 23:00–02:00)<\/td>\n<td>Восстановление и регенерация слизистой, больше ферментов\nподжелудочной, нормальная перистальтика, всасывание аминокислот, глюкозы\nи жиров, меньше воспаления при ВЗК, влияние на микробиоту, защита при\nстрессе<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Бонус:<\/strong> к 23:00 активизируется грелин (гормон голода)\n— если вы уже спите, вечернего «жора» не будет.<\/p>\n<p><strong>Как уложить себя вовремя:<\/strong> приглушённый тёплый свет;\nяркость экранов ниже за 1–2 часа до сна или фильтр синего; тёплый душ\nили ванночка для ног; дыхание животом; тёплый травяной чай (мелисса,\nромашка) или кипячёное молоко; подъём в 06:00–07:00; днём с 10:00 до\n14:00 — 20–30 минут на ярком свету.<\/p>\n<div class=\"lt-note\"><strong>Без налаженного сна<\/strong> справиться с чувствительным и\nвоспалённым типом пищеварения очень сложно: ЖКТ восстанавливается\nглавным образом во сне.<\/div>\n<h4>2. Достаточно сна: не менее 7–8 часов<\/h4>\n<p>Во сне работает парасимпатика — ЖКТ восстанавливается. Недосып\nвключает симпатику и тревожность. Для сна — <strong>тишина, темнота,\nпрохлада<\/strong>, при храпе партнёра — спать отдельно.\n<strong>Недоспали — ешьте чуть меньше обычного.<\/strong><\/p>\n<h4>3. Движение: 30–60 минут в день<\/h4>\n<p>Непрерывная активность низкой или средней интенсивности: прогулка,\nбег трусцой, велосипед, лыжи, танцы, йога, пилатес. Улучшает иннервацию\nи кровоток в ЖКТ, перистальтику, отток желчи. Без спешки и\nнапряжения.<\/p>\n<h4>4. Ритмичность приёмов пищи<\/h4>\n<p>Хаос и кусочничество сбивают гормоны голода и насыщения — соки\nвыделяются не вовремя. Нужны <strong>чёткие завтрак, обед, ужин (и\nперекусы) в одно и то же время<\/strong>.<\/p>\n<div class=\"lt-ins\"><strong>Задание:<\/strong> выпишите свой идеальный ритм питания —\nсколько раз и когда едите, объём, когда приходит голод, сколько держится\nсытость, комфортно ли после еды.<\/div>\n<h4>5. Тепло перед едой и во время еды<\/h4>\n<p>Крупные приёмы пищи — тёплые или горячие, напитки до и во время еды —\nтемпературы тела или выше. Тепло включает парасимпатику.<\/p>\n<h4>6. Во время еды — фокус на еде<\/h4>\n<p>Без телефона, новостей, ТВ и спешки. Замедлиться перед едой,\nпочувствовать запах и вкус, полюбоваться тарелкой, красиво сервировать\nстол. Лучше вкус — лучше соки и быстрее насыщение.<\/p>\n<h4>Чек-лист на неделю<\/h4>\n<ul class=\"lt-check\"><li>Ложусь так, чтобы спать с 22:00 до 02:00<\/li><li>Сплю не менее 7–8 часов<\/li><li>Двигаюсь 30–60 минут в день<\/li><li>Ем в одно и то же время, без кусочничества<\/li><li>Ем тёплую еду, пью тёплые напитки<\/li><li>Во время еды — фокус на еде<\/li><\/ul>",
 "mix2_7": "<h4>Главное за 1 минуту<\/h4>\n<div class=\"lt-note\">Перед активной работой с ЖКТ (фитосоставы, специи, рацион,\nмикробиота) его нужно подготовить: мягко почистить и снизить\nвоспалительный фон. Инструмент — <strong>сорбенты<\/strong>: как губка,\nони связывают в кишечнике и выводят бактериальные токсины, избыток\nжёлчных кислот, непереваренные остатки, аллергены, соли тяжёлых\nметаллов, пищевой холестерин, продукты воспаления, метаболиты\nгормонов.<\/div>\n<h4>Правила приёма<\/h4>\n<ul class=\"lt-check\"><li><strong>Интервал 1,5–2 часа<\/strong> с лекарствами и\nнутрицевтиками<\/li><li><strong>4–5 дней<\/strong> — не для длительного применения<\/li><li><strong>+2 стакана жидкости в день<\/strong>: один — запить сорбент,\nвторой — через 30–60 минут<\/li><li><strong>Склонность к запорам<\/strong> — подготовьте свечку с\nглицерином или микроклизму<\/li><\/ul>\n<h4>Что не подходит при смешанном типе пищеварения<\/h4>\n<p>Активированный уголь, «Полисорб», белый уголь, отруби, глина, кислый\n(яблочный) пектин. При лактазной недостаточности — осторожно с формами\n«Смекты», «Фильтрума», «Энтеросгеля» со вкусовыми добавками: читайте\nсостав на лактозу.<\/p>\n<h4>Мягкие сорбенты: выберите один<\/h4>\n<div class=\"lt-tbl\"><table>\n<thead>\n<tr>\n<th><strong>Вариант<\/strong><\/th>\n<th><strong>Как принимать<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Кисели<\/strong><\/td>\n<td>Льняной (из семян или муки) или овсяный — рецепты в уроках 1-й\nнедели<\/td>\n<\/tr>\n<tr>\n<td><strong>Псиллиум<\/strong><\/td>\n<td>1 ч. л. на стакан тёплой воды, настоять 10 минут, выпить вместе с\nгелем через 1,5–2 часа после еды или вечером<\/td>\n<\/tr>\n<tr>\n<td><strong>Семена чиа<\/strong><\/td>\n<td>1–2 ч. л. на 100–150 мл тёплой воды или компота из чернослива (можно\nпюре из сливы), настоять 10 минут, пить через 1,5–2 часа после еды или\nвечером<\/td>\n<\/tr>\n<tr>\n<td><strong>«Зостерин»<\/strong><\/td>\n<td>Некислый пектин из взморника, мягкий, селективная сорбция, не влияет\nна микрофлору<\/td>\n<\/tr>\n<tr>\n<td><strong>«Оптифайбер»<\/strong><\/td>\n<td>Мягкая клетчатка из циамопсиса, можно применять длительно как\nисточник клетчатки<\/td>\n<\/tr>\n<tr>\n<td><strong>Рисовый суп-детокс<\/strong><\/td>\n<td>На ужин. Не подходит при выраженной инсулинорезистентности и сильном\nвздутии на крупы<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h4>Рисовый суп-детокс<\/h4>\n<p><strong>30 г<\/strong> риса басмати или жасмин промыть, замочить на\nчас, снова промыть. Залить <strong>400 мл<\/strong> воды, довести до\nкипения, добавить куркуму на кончике ножа, щепотку зиры, 2 лавровых\nлиста, соль. Варить <strong>20 минут<\/strong> на очень слабом огне — суп\nостанется полужидким. Есть на ужин; можно с приготовленными овощами или\nсалатом с нерафинированным маслом.<\/p>\n<div class=\"lt-note\"><strong>Мягкие сорбенты 4–5 дней + больше жидкости = ЖКТ готов к\nработе.<\/strong><\/div>"
};

function plural(n,f){const a=n%10,b=n%100;return f[(a==1&&b!=11)?0:(a>=2&&a<=4&&(b<10||b>=20))?1:2]}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),2000)}
function dayStart(t){const d=new Date(t);d.setHours(0,0,0,0);return d.getTime()}
function fmtM(d){return new Date(d).toLocaleDateString('ru-RU',{day:'numeric',month:'long',timeZone:'Europe/Moscow'})}
function fmt(d,o){return new Date(d).toLocaleDateString('ru-RU',o||{day:'numeric',month:'long'})}
function fmtDT(d){ if(!d) return '—'; const x=new Date(d); return isNaN(x)?String(d):x.toLocaleDateString('ru-RU',{day:'numeric',month:'short'})+', '+x.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}); }
function daysAgo(d){ if(!d) return null; return Math.max(0, Math.floor((dayStart(Date.now())-dayStart(d))/DAY)); }
function keepY(fn){ const y=window.scrollY; fn(); window.scrollTo(0,y); }

// ═══ Общая логика подбора (кабинет и админка) ═════════════════════
function activeSym(sc){ sc=sc||{}; return SYM.filter(s=>(sc[s.k]||0)>=4).map(s=>s.k) }
function fits(it,type,sym,flags){
  if(it.core) return true;
  if(it.flag && flags.includes(it.flag)) return true;
  const tOk = it.types ? it.types.includes(type) : false;
  const sOk = it.sym ? it.sym.some(s=>sym.includes(s)) : false;
  return tOk || sOk;
}
// Материалы ученицы: уроки, специи и фитосоставы — строго по протоколу; практики — по протоколу и жалобам
function buildResult(type, quiz, hidden){
  quiz = quiz || {}; hidden = hidden || {};
  const sym = activeSym(quiz.scores), flags = quiz.flags || [];
  const R = { type, sym };
  R.lessons = CAT.lessons.filter(l=>(l.core||(l.types||[]).includes(type)) && !hidden[l.id]).map(l=>l.id);
  R.practices = CAT.practices.filter(p=>fits(p,type,sym,flags)||p.id==='p5'&&(sym.includes('heartburn')||sym.includes('fatigue'))).map(p=>p.id);
  R.spices = CAT.spices.filter(s=>s.types.includes(type)).map(s=>s.id);
  R.phyto = CAT.phyto.filter(f=>f.types.includes(type)).map(f=>f.id);
  return R;
}
// Ручные правки куратора поверх автоподбора: { add:[ID], rm:[ID] }
function applyOv(R, ov){
  if (!ov) return R; const add = ov.add || [], rm = ov.rm || [], out = Object.assign({}, R);
  ['lessons','practices','spices','phyto'].forEach(k => { out[k] = R[k].filter(id => !rm.includes(id)).concat(add.filter(id => catOf(id) === k && !R[k].includes(id))); });
  return out;
}
const TARIFF_IND = 'Индивидуальный';
const AI_KEY = { 'Индивидуальный протокол':'ind', 'На уточнении':'unclear' };
const aiKeyOf = n => PKEY[String(n || '').trim()] || AI_KEY[String(n || '').trim()] || null;
const aiName = k => PNAME[k] || ({ ind:'Индивидуальный протокол', unclear:'На уточнении' })[k] || '—';
function byId(id){for(const k in CAT){const f=CAT[k].find(x=>x.id===id);if(f) return f}return null}
function catOf(id){for(const k in CAT){if(CAT[k].some(x=>x.id===id)) return k}return null}
const ITEMS = QBLOCKS.flatMap(b=>b.items);
function labelOf(it,v){ if(!it||!v) return ''; if(it.k==='scale') return (it.react?SCALE_REACT:SCALE_STD)[v]||String(v); if(it.k==='opts'){const o=it.o.find(o=>o[0]===v);return o?o[1]:String(v)} return 'Да'; }
function dayNum(start){ return Math.max(1, Math.floor((dayStart(Date.now())-dayStart(start))/DAY)+1) }
// ── Трекер: недели 2–5 программы, дни считаются от старта (день 1 = старт потока). Неделя 5 длится до раздела «Завершение». ──
const TRK_WEEKS = [2,3,4,5];
function trkStart(){ try { return startT(); } catch (e) { return Date.parse('2026-11-01T00:00:00+03:00'); } }
function trkSpan(w, set){
  if (!START()) { const o = CAL.weekOpens, a0 = o[w]; return { a: a0, b: Math.min(CAL.programDays, (w === 5 ? o[6] : o[w + 1]) - 1) }; }   // без даты старта потока — по неделям от назначения протокола
  const s = dayStart(trkStart()), d = ms => Math.floor((dayStart(ms) - s)/DAY) + 1;
  const a = d(openAt(w, set)), nx = openAt(w === 5 ? 6 : w + 1, set), b = nx ? d(nx) - 1 : a + 6;
  return { a, b: Math.max(a, Math.min(b, CAL.programDays)) };
}
function trkWeekOf(day, set){ for (const w of TRK_WEEKS) { const s = trkSpan(w, set); if (day >= s.a && day <= s.b) return w; } return 0; }
function trackRowsT(type,w){ const t=TRACK[type]||TRACK.slow; return t[w]||[]; }
function trackDayRows(type, day){
  const w = trkWeekOf(day); if (!w) return [];
  const k = Math.min(6, day - trkSpan(w).a);
  return trackRowsT(type, w).map((r, i) => Object.assign({}, r, { i, dose: r.d ? r.d[k] : '' })).filter(r => r.dose !== '-');
}
function dayStatT(track,type,day){
  const req = trackDayRows(type, day).filter(r => !r.o);
  const d = req.filter(r => track[day+':'+r.i]).length;
  return {d, n:req.length, p:req.length ? Math.round(d/req.length*100) : 0};
}
function weekStatT(track,type,today,w){
  const sp = trkSpan(w), last = Math.min(today, sp.b);
  if (last < sp.a) return null;
  let d=0,n=0; for(let day=sp.a;day<=last;day++){const s=dayStatT(track,type,day);d+=s.d;n+=s.n}
  return {d,n,p:n?Math.round(d/n*100):0};
}
// Из черновика анкеты — шкалы жалоб 0–10, особенности, ограничения и красные флаги
function deriveQuiz(q){
  const ans=q.ans||{};
  const sev=ids=>{ let m=0; ids.forEach(id=>{ const a=ans[id]; if(!a) return; const it=ITEMS.find(i=>i.id===id); if(!it) return; const mx=it.k==='scale'?it.max:2; m=Math.max(m,Math.round(a.v/mx*10)) }); return m };
  const ids=n=>(QBLOCKS.find(b=>b.n===n)||{items:[]}).items.map(i=>i.id);
  const scores={heartburn:sev(ids(5)),bloating:sev(ids(7)),heaviness:sev(ids(4).concat(['b10q4'])),stool:sev(ids(8)),fatigue:sev(['b10q2','b10q4'])};
  const diag=q.diag||[], excluded=q.excluded||[];
  const diet=[]; if(excluded.includes('milk')||diag.includes('Непереносимость лактозы / фруктозы')) diet.push('nolactose');
  if(diag.includes('Целиакия / непереносимость глютена')) diet.push('nogluten');
  const flags=[]; if(diag.includes('Удалён желчный пузырь')) flags.push('chole');
  if(/омепр|пантопр|рабепр|эзомепр|нексиум|лансопр/i.test(q.meds||'')) flags.push('ppi');
  const red=DIAGNOSES.filter(([d,r])=>r&&diag.includes(d)).map(([d])=>d); if(ans.b8q_flag) red.push('Чёрный смолистый кал');
  return {scores,flags,diet,red};
}
// Ответы для автоназначения: номер варианта по шкале анкеты (как в разметке потока 3.0)
function scoringAnswers(ans){
  const qs={}; Q.blocks.forEach(b=>b.q.forEach(x=>qs[x[0]]=x));
  const out={}; Object.keys(ans||{}).forEach(id=>{ const it=ITEMS.find(i=>i.id===id), q=qs[id]; if(!it||!q) return;
    out[id]= it.k==='yes' ? SCALE_MAX[q[4]] : ans[id].v; });
  return out;
}

// Анкета → данные для сервера (одна функция и для ученицы, и для демо-данных)
function quizPayload(q){
  const d=deriveQuiz(q), labels={}, raw={};
  Object.keys(q.ans||{}).forEach(id=>{ raw[id]=q.ans[id].v; labels[id]=q.ans[id].label||labelOf(ITEMS.find(i=>i.id===id),q.ans[id].v) });
  const h=+q.height/100, w=+q.weight, bmi=h>0&&w>0?(w/(h*h)).toFixed(1):'';
  return { personal:{fio:q.fio||'',sex:q.pol||'',age:q.age||'',height:q.height||'',weight:q.weight||'',waist:q.waist||'',bmi},
    answers:scoringAnswers(q.ans), raw, labels, gates:q.gates||{}, diagnoses:(q.gates&&q.gates.diag==='yes')?(q.diag||[]):[], chol:q.chol||'',
    products:q.b7prod||'', meds:q.meds||'', goals:q.goals||'',
    excluded:(q.excluded||[]).map(c=>(EXCLUDABLE.find(p=>p.code===c)||{name:c}).name), excludedCodes:q.excluded||[],
    productsOther:q.productsOther||'', free:q.free||'', redFlags:d.red, redAck:!!q.redAck,
    scores:d.scores, flags:d.flags, diet:d.diet, tongueLater:!!q.tongueLater,

}

async function api(action, params = {}) {

    const r = await fetch(CFG.API_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(Object.assign({ action }, params)) });

}

  const lastTxt = n => n === null ? 'не заходил(а)' : n === 0 ? 'сегодня' : n === 1 ? 'вчера' : `${n} ${plural(n, ['день','дня','дней'])} назад`;
  const pctOf = (a, b) => b ? Math.round(a/b*100) : 0;
  function status(c){
    const s = stageOf(c);
    if (!c.paidOnly && closedC(c)) return `<span class="st o">Доступ закрыт</span>`;
    if (s < 3) return `<span class="st o">${s === 0 ? 'Не заходил(а)' : 'Анкета не заполнена'}</span>`;
    const f = flowOf(c);
    if (f === 'photo') return `<span class="st w">Ждём фото языка</span>`;
    if (f === 'review') return `<span class="st rv">Ждёт проверки${aiOpen(c) ? ' · ИИ' : ''}</span>`;
    if (c.red.length) return `<span class="st rd">Красный флаг</span>`;
    if (c.last !== null && c.last >= 5) return `<span class="st w">Давно не заходит</span>`;
    if (c.day > CAL.programDays) return `<span class="st">Завершил(а)</span>`;
    return `<span class="st">В программе</span>`;
  }
  function tags(it){
    const t = [];
    if (it.core) t.push(`<span class="chip d">всем</span>`);
    if (it.types) it.types.forEach(x => t.push(`<span class="chip">${TYPES[x].short}</span>`));
    if (it.sym) it.sym.forEach(x => t.push(`<span class="chip m">${(SYM.find(s => s.k === x) || {t:x}).t.split(',')[0].toLowerCase()}</span>`));
    if (it.flag) t.push(`<span class="chip m">${(FLAGNAME[it.flag] || it.flag).toLowerCase()}</span>`);
    return t.join('');
  }
  const meta = it => { const k = catOf(it.id); return k === 'lessons' ? `${WEEKSHORT[it.w]} · ${it.d}` : it.d || ''; };
  const linkOf = id => lessonLinks(id, (D && D.lessons) || {});

  // ── каркас ──
  function side(){
    const rv = C.filter(c => ['review','photo'].includes(flowOf(c))).length;
    $('#side').innerHTML = `<div class="brand">HOLISTICA<i>DOC</i></div><div class="prog">Формула здоровья ЖКТ${MODE === 'demo' ? '<br>Демо-режим' : ''}</div>
    <div class="navs">
    <button class="nav ${AV.s === 'over' ? 'on' : ''}" data-a="nav" data-s="over">${I.over}Обзор</button>
    <button class="nav ${(AV.s === 'clients' && CF.st !== 'review') || AV.s === 'client' ? 'on' : ''}" data-a="nav" data-s="clients">${I.cl}Клиенты<span class="n">${C.length}</span></button>
    <button class="nav ${AV.s === 'clients' && CF.st === 'review' ? 'on' : ''}" data-a="navq" data-st="review">${I.ck}Проверка<span class="n">${rv}</span></button>
    <button class="nav ${AV.s === 'comments' ? 'on' : ''}" data-a="nav" data-s="comments">${I.cm}Комментарии<span class="n">${openThreads().length}</span></button>
    <button class="nav ${AV.s === 'chats' ? 'on' : ''}" data-a="nav" data-s="chats">${I.chs}Чаты<span class="n">${chatClients().filter(unreadOf).length}</span></button>
    <button class="nav ${AV.s === 'raffle' ? 'on' : ''}" data-a="nav" data-s="raffle">${I.ck}Розыгрыш<span class="n">${rzList().filter(r => r.status === RZ_ST.wait).length}</span></button>
    <button class="nav ${AV.s === 'reviews' ? 'on' : ''}" data-a="nav" data-s="reviews">${I.star}Итоговые отзывы<span class="n">${rvList().filter(f => f.rv !== RV_OK).length}</span></button>
    <button class="nav ${AV.s === 'ratings' ? 'on' : ''}" data-a="nav" data-s="ratings">${I.star}Оценки<span class="n">${fbFlagged().length}</span></button>
    <button class="nav ${AV.s === 'catalog' ? 'on' : ''}" data-a="nav" data-s="catalog">${I.cat}Материалы</button></div>
    <div class="role"><label>Вы вошли как</label><b>${esc(S.user.name || S.user.email)}</b><span class="small" style="color:#C9E3D3">${esc(S.user.role)}</span>
      <button class="btn sm" data-a="preview">Кабинет глазами ученицы</button>
      <button class="btn sm" data-a="refresh">Обновить данные</button>
      ${MODE === 'demo' ? `<button class="btn sm" data-a="demoResetA">Сбросить демо-данные</button>` : ''}
      <button class="btn sm" data-a="logout">Выйти</button></div>`;
  }
  function render(keep){
    const y = window.scrollY;
    side();
    $('#adm').innerHTML = ({ over, clients, client, catalog, comments, chats, ratings, raffle, reviews })[AV.s]();
    if (AV.s === 'client') { loadPhoto(); loadMenuDays(); }

  }

  // ── обзор ──
  function over(){
    const n = C.length, filled = C.filter(c => c.filled), asg = C.filter(c => c.assigned);
    const fun = [['Получили доступ', n], ['Вошли в кабинет', C.filter(c => stageOf(c) >= 1).length], ['Заполнили анкету', filled.length],
      ['Протокол назначен', asg.length], ['Открыли первый урок', asg.filter(c => Object.keys(c.state.lx).length).length], ['Отмечают трекер', asg.filter(c => Object.keys(c.state.track).length).length]];
    const types = { slow:0, infl:0, sens:0, mix:0 }; filled.forEach(c => { if (c.type) types[c.type]++; });
    const withSc = filled.filter(c => c.quiz.scores);
    const symStat = SYM.map(s => ({ t:s.t, p:pctOf(withSc.filter(c => c.quiz.scores[s.k] >= 4).length, withSc.length), avg:withSc.length ? (withSc.reduce((a, c) => a + (c.quiz.scores[s.k] || 0), 0)/withSc.length).toFixed(1) : '0' })).sort((a, b) => b.p - a.p);
    const red = filled.filter(c => c.red.length), idle = asg.filter(c => c.last !== null && c.last >= 5).sort((a, b) => b.last - a.last);
    const trk = TRK_WEEKS.map(w => { const v = asg.map(c => weekTrack(c, w)).filter(Boolean); return v.length ? Math.round(v.reduce((a, s) => a + s.p, 0)/v.length) : null; });
    const withCheck = asg.filter(c => c.state.checks.length && c.quiz.scores);
    const impr = pctOf(withCheck.filter(c => { const sum = o => Object.values(o).reduce((x, y) => x + y, 0); return sum(c.state.checks[c.state.checks.length-1].scores) < sum(c.quiz.scores); }).length, withCheck.length);
    const withAuto = asg.filter(c => c.autoKey), match = withAuto.filter(c => c.autoKey === c.type).length;
    const lp = AV.lp || 'slow';
    const lessons = CAT.lessons.filter(l => l.core ? lp === 'core' : (l.types || []).includes(lp)).slice().sort((a, b) => a.w - b.w);
    return `<div class="head"><div><h1>Обзор программы</h1><p class="muted" style="margin:0">Данные на ${fmt(Date.now())}${D.settings && D.settings.start ? ` · старт потока ${fmt(D.settings.start)} · доступ до ${D.settings.accessEnd ? fmt(new Date(D.settings.accessEnd).getTime() - DAY) + ' включительно' : fmt(new Date(dayStart(D.settings.start) + (D.settings.accessDays - 1) * DAY))}` : ' · старт потока не задан — отсчёт от назначения протокола'}</p></div></div>
    <div class="panel todo" style="margin-bottom:16px"><h2><span>Нужно сделать</span></h2><div class="todo-g">
      <button class="tdi" data-a="navq" data-st="review"><b>${C.filter(c => flowOf(c) === 'review').length}</b><span>ждут проверки и назначения протокола</span></button>
      <button class="tdi" data-a="navq" data-st="photo"><b>${C.filter(c => flowOf(c) === 'photo').length}</b><span>ждём фото языка</span></button>
      <button class="tdi ${C.some(c => flowOf(c) !== 'assigned' && aiOpen(c)) ? 'w' : ''}" data-a="navq" data-st="ai"><b>${C.filter(c => flowOf(c) !== 'assigned' && aiOpen(c)).length}</b><span>расхождение с ИИ</span></button>
      <button class="tdi" data-a="nav" data-s="comments"><b>${openThreads().length}</b><span>комментариев без ответа</span></button>
      <button class="tdi" data-a="nav" data-s="chats"><b>${chatClients().filter(unreadOf).length}</b><span>чатов с новыми сообщениями</span></button>
      <button class="tdi ${red.length ? 'w' : ''}" data-a="navq" data-st="red"><b>${red.length}</b><span>с красными флагами</span></button>
      <button class="tdi ${fbFlagged().length ? 'w' : ''}" data-a="fbflag"><b>${fbFlagged().length}</b><span>сигналов в оценках обучения</span></button>
      <button class="tdi" data-a="navq" data-st="idle"><b>${idle.length}</b><span>не заходят 5+ дней</span></button>
      <button class="tdi" data-a="navq" data-st="noform"><b>${C.filter(c => !c.filled).length}</b><span>ещё не заполнили анкету</span></button>
      <button class="tdi" data-a="navcur" data-v="free"><b>${C.filter(c => !c.cur && !c.paidOnly).length}</b><span>без куратора</span></button>
      <button class="tdi" data-a="navcur" data-v="me"><b>${C.filter(c => c.cur === meEmail()).length}</b><span>закреплены за мной</span></button>
      <button class="tdi" data-a="navq" data-st="closed"><b>${C.filter(c => !c.paidOnly && closedC(c)).length}</b><span>доступ закрыт · продлили ${C.filter(extC).length}</span></button>
    </div></div>
    <div class="grid g4" style="margin-bottom:16px">
      <div class="panel kpi"><b>${n}</b><span>получили доступ</span></div>
      <div class="panel kpi"><b>${pctOf(filled.length, n)}%</b><span>заполнили анкету · ${filled.length} чел.</span></div>
      <div class="panel kpi"><b>${asg.length ? Math.round(asg.reduce((a, c) => a + lessonPct(c), 0)/asg.length) : 0}%</b><span>средний прогресс по урокам</span></div>
      <div class="panel kpi"><b>${impr}%</b><span>стало лучше по замерам</span> <em>${withCheck.length} с замером</em></div>
    </div>
    <div class="grid g3">
      <div class="panel span2"><h2><span>Воронка</span></h2>
        <div class="fun">${fun.map((f, k) => `<div class="r"><span>${f[0]}</span><span class="bar"><i style="width:${pctOf(f[1], n)}%"></i></span><span class="v">${f[1]}${k ? `<small>−${fun[k-1][1] - f[1]}</small>` : ''}</span></div>`).join('')}</div>
        <p class="small muted" style="margin:10px 0 0">Число под значением — сколько человек отвалилось на этом шаге. «Получили доступ» — ученицы из листа «Ученики» и из выгрузки оплативших.</p></div>
      <div class="panel"><h2 class="neg"><span>Требуют внимания</span></h2>
        <p class="small muted">Красные флаги в анкете</p>
        ${red.length ? red.map(c => `<button class="mi" style="width:100%;text-align:left;margin-bottom:6px" data-a="open" data-id="${esc(c.email)}"><span class="tx"><b>${esc(c.name)}</b><span>${esc(c.red.join(', '))}</span></span></button>`).join('') : `<p class="small">Нет</p>`}
        <p class="small muted" style="margin-top:14px">Не заходят 5+ дней</p>
        ${idle.slice(0, 5).map(c => `<button class="mi" style="width:100%;text-align:left;margin-bottom:6px" data-a="open" data-id="${esc(c.email)}"><span class="tx"><b>${esc(c.name)}</b><span>${lastTxt(c.last)} · уроки ${lessonPct(c)}%</span></span></button>`).join('') || `<p class="small">Нет</p>`}
      </div>
      <div class="panel"><h2><span>Типы пищеварения</span></h2><div class="hb">${Object.entries(types).map(([k, v]) => `<div class="r"><span>${TYPES[k].name}</span><span>${v}</span><span class="pb"><i style="width:${pctOf(v, filled.length)}%"></i></span></div>`).join('')}</div>
        <p class="small muted" style="margin:10px 0 0">${withAuto.length ? `Автоподбор совпал с решением куратора у ${match} из ${withAuto.length} (${pctOf(match, withAuto.length)}%).` : 'До назначения протоколов здесь — автоподбор по анкете.'}</p></div>
      <div class="panel"><h2><span>Частые жалобы</span></h2><div class="hb">${symStat.map(s => `<div class="r"><span>${s.t} <span class="muted small">· ср. ${s.avg}</span></span><span>${s.p}%</span><span class="pb m"><i style="width:${s.p}%"></i></span></div>`).join('')}</div>
        <p class="small muted" style="margin:10px 0 0">Доля тех, у кого жалоба 4+ из 10 на старте.</p></div>
      <div class="panel"><h2><span>Трекер</span></h2><div class="hb">${trk.map((v, i) => v === null ? '' : `<div class="r"><span>Неделя ${i+1}</span><span>${v}%</span><span class="pb"><i style="width:${v}%"></i></span></div>`).join('') || '<p class="small muted">Пока нет отметок.</p>'}</div>
        <p class="small muted" style="margin:10px 0 0">Средний процент выполненных обязательных действий.</p></div>
      <div class="panel span2" style="grid-column:1/-1"><div class="head" style="margin-bottom:10px"><h2 style="margin:0"><span>Уроки</span></h2>
        <span class="seg">${[['slow','Вялое'],['infl','Воспалённое'],['sens','Чувствительное'],['mix','Смешанное'],['core','Общие и бонусы']].map(([k, t]) => `<button class="${lp === k ? 'on' : ''}" data-a="lp" data-v="${k}">${t}</button>`).join('')}</span></div>
        <div class="tw" style="border:none"><table class="t la"><thead><tr><th>Урок</th><th>Назначен</th><th>Открыли</th><th>Отметили просмотренным</th><th>Видео на платформе</th></tr></thead><tbody>
        ${lessons.map(l => { const st = lstat(l.id); return `<tr class="ck" data-a="prev" data-id="${l.id}"><td><b>${esc(l.t)}</b><span class="sub">${WEEKSHORT[l.w]} · ${esc(l.d)}</span></td><td>${st.hold}</td>
          <td><span class="mini"><span class="pb"><i style="width:${pctOf(st.open, st.hold)}%"></i></span>${st.open}</span></td><td>${st.done}</td>
          <td>${linkOf(l.id).video ? '<span class="chip">есть</span>' : '<span class="chip g">нет</span>'}</td></tr>`; }).join('')}
        </tbody></table></div>
        <p class="small muted" style="margin:10px 0 0">Ссылки на видео и конспекты добавляются в лист «Уроки» Google-таблицы. Нажмите на урок, чтобы открыть карточку.</p></div>
    </div>`;
  }
  function lstat(id){
    const hold = C.filter(c => c.assigned && eff(c, 'lessons').includes(id));
    return { hold:hold.length, open:hold.filter(c => c.state.lx[id]).length, done:hold.filter(c => c.state.done[id]).length };
  }

  // ── клиенты ──
  function clients(){
    const q = CF.q.toLowerCase();
    let list = C.filter(c => !q || c.name.toLowerCase().includes(q) || c.email.includes(q));
    if (CF.st === 'review') list = list.filter(c => ['review','photo'].includes(flowOf(c)));
    if (CF.st === 'photo') list = list.filter(c => flowOf(c) === 'photo');
    if (CF.st === 'red') list = list.filter(c => c.filled && c.red.length);
    if (CF.st === 'idle') list = list.filter(c => c.assigned && c.last !== null && c.last >= 5);
    if (CF.st === 'noform') list = list.filter(c => !c.filled);
    if (CF.st === 'ai') list = list.filter(c => flowOf(c) !== 'assigned' && aiOpen(c));
    if (CF.st === 'ind') list = list.filter(c => c.tariff === TARIFF_IND);
    if (CF.st === 'edited') list = list.filter(c => ovCount(c));
    if (CF.st === 'closed') list = list.filter(c => !c.paidOnly && closedC(c));
    if (CF.st === 'ext') list = list.filter(extC);
    list = curFilter(list);
    if (CF.type !== 'all') list = list.filter(c => c.filled && c.type === CF.type);
    const seg = (k, v, t) => `<button class="${CF[k] === v ? 'on' : ''}" data-a="cf" data-k="${k}" data-v="${v}">${t}</button>`;
    return `<div class="head"><div><h1>${CF.st === 'review' ? 'Проверка назначений' : 'Клиенты'}</h1><p class="muted" style="margin:0">Нажмите на строку, чтобы открыть карточку</p></div><button class="btn ghost" data-a="addOpen">+ Добавить учениц</button></div>
    <div class="tools"><input class="inp" id="cq" placeholder="Имя или email" value="${esc(CF.q)}" style="flex:1 1 220px">
      <span class="seg">${seg('st','all','Все')}${seg('st','review','Ждут проверки')}${seg('st','photo','Нет фото языка')}${seg('st','ai','Расхождение с ИИ')}${seg('st','ind','Индивидуальный')}${seg('st','edited','С правками')}${seg('st','closed','Доступ закрыт')}${seg('st','ext','Продлили')}${seg('st','red','Красный флаг')}${seg('st','idle','Давно не заходят')}${seg('st','noform','Без анкеты')}</span>
      <span class="seg">${seg('type','all','Все типы')}${Object.keys(TYPES).map(k => seg('type', k, TYPES[k].short)).join('')}</span>
      ${curSeg()}</div>
    <div class="tw"><table class="t"><thead><tr><th>Клиент</th><th>Куратор</th><th>Статус</th><th>Тип</th><th>Уроки</th><th>Трекер, тек. неделя</th><th>Последний вход</th><th>Правки</th></tr></thead><tbody>
    ${list.map(c => { const lp = lessonPct(c), wt = c.assigned ? weekTrack(c, curWeekC(c)) : null;
      return `<tr data-a="open" data-id="${esc(c.email)}" tabindex="0"><td><b>${esc(c.name)}${c.tariff === TARIFF_IND ? ` <span class="chip m">инд.</span>` : ''}${unreadOf(c) ? ` <span class="chip r">${unreadOf(c)} нов.</span>` : ''}</b><span class="sub">${esc(c.email)}</span></td><td>${curChip(c)}</td><td>${status(c)}</td>
      <td>${c.filled && c.type ? `<span class="chip">${TYPES[c.type].short}</span>${c.assigned ? '' : ' <span class="small muted">авто</span>'}` : `<span class="nd muted">—</span>`}</td>
      <td data-l="Уроки">${c.assigned ? `<span class="mini"><span class="pb"><i style="width:${lp}%"></i></span>${lp}%</span>` : '<span class="nd">—</span>'}</td>
      <td data-l="Трекер">${wt ? `<span class="mini"><span class="pb"><i style="width:${wt.p}%"></i></span>${wt.p}%</span>` : '<span class="nd">—</span>'}</td>
 <td data-l="Вход">${lastTxt(c.last)}</td><td>${ovCount(c) ? `<span class="chip m">${ovCount(c)}</span>` : ''}</td></tr>`; }).join('') ||  `<tr><td colspan="8" class="muted">Никого не нашлось. Измените фильтры или поиск.</td></tr>`}
    </tbody></table></div>`;
  }

  // ── карточка клиента ──
  function client(){
    const c = C.find(x => x.email === AV.id);
    if (!c) return `<button class="btn lnk" data-a="nav" data-s="clients">← Все клиенты</button><div class="panel"><p>Клиент не найден.</p></div>`;
    const initials = c.name.split(' ').filter(Boolean).slice(0, 2).map(w => w[0]).join('').toUpperCase();

    ${c.paidOnly ? '' : `<div class="row2" style="align-items:center;margin-top:6px"><label class="small muted">Куратор: <select id="curSel" class="sel" style="width:auto;display:inline-block;padding:4px 10px"><option value="">— свободна —</option>${curators().map(x => `<option value="${esc(x.email)}" ${x.email === c.cur ? 'selected' : ''}>${esc(x.name)}${x.email === meEmail() ? ' (я)' : ''}</option>`).join('')}</select></label>

    ${c.paidOnly ? '' : `<label class="small muted">Тариф: <select id="tariff" class="sel" style="width:auto;display:inline-block;padding:4px 10px">${['Общий', TARIFF_IND].map(t => `<option ${t === c.tariff ? 'selected' : ''}>${t}</option>`).join('')}</select></label>`}</div></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">${status(c)}
      ${c.assigned ? `<button class="btn ghost sm" data-a="asStudent">Кабинет её глазами</button>` : ''}
      <button class="btn ghost sm" data-a="resetAll" ${c.filled ? '' : 'disabled'}>Открыть анкету заново</button>
      <button class="btn ghost sm" data-a="resetProg" ${c.assigned ? '' : 'disabled'}>Сбросить прогресс</button>

    if (a === 'aiSwitch') return act(() => api('aiResolve', { token:S.token, email:c.email, res:'switch' }), 'Выбран протокол, предложенный ИИ — проверьте и назначьте');
    if (a === 'aiRun') { b.disabled = true; b.textContent = 'Проверяем…';
      return act(async () => { const r = await api('aiRun', { token:S.token, email:c.email }); if (r.manual) toast('Ключ Claude API не задан — анкета добавлена в таблицу ИИ-проверки для ручной проверки'); }, 'Готово'); }
    if (a === 'confirm') { if (!c.photo || aiOpen(c)) return; const k = $('#proto').value, recs = $('#recs').value;
      return act(() => api('confirm', { token:S.token, email:c.email, protocol:PNAME[k], recs }), 'Протокол назначен — у ученицы открылась программа'); }
    if (a === 'saveRecs') return act(() => api('saveRecs', { token:S.token, email:c.email, recs:$('#recs').value }), 'Рекомендации сохранены — ученица видит их на главной');
    if (a === 'saveNote') return act(() => api('saveNote', { token:S.token, email:c.email, note:$('#note').value }), 'Заметка сохранена');
    if (a === 'resetAll') { if (!confirm(`Открыть анкету заново для ${c.name}? Ответы, протокол, рекомендации и прогресс будут сброшены.`)) return;
      return act(() => api('resetQuiz', { token:S.token, email:c.email }), 'Анкета открыта заново'); }
    if (a === 'resetProg') { if (!confirm(`Сбросить прогресс ${c.name}? Анкета и протокол сохранятся.`)) return;
      return act(() => api('resetProgress', { token:S.token, email:c.email }), 'Прогресс сброшен'); }
    if (a === 'resetPw') { if (!confirm(`Сбросить пароль для ${c.name}? При следующем входе она придумает новый.`)) return;
      return act(() => api('resetPassword', { token:S.token, email:c.email }), 'Пароль сброшен'); }
  }
  function change(e){
    if (e.target.id === 'curF') { CF.cur = e.target.value || 'all'; LS.set('hz_curf', CF.cur); return render(true); }
    if (e.target.id === 'curSel' && AV.s === 'client') { const c = C.find(x => x.email === AV.id); const v = e.target.value;
      return act(() => api('assignCurator', { token:S.token, email:c.email, curator:v }), v ? 'Куратор назначен: ' + curName(v) : 'Ученица откреплена'); }
    if (e.target.id === 'tariff' && AV.s === 'client') { const c = C.find(x => x.email === AV.id); return act(() => api('setTariff', { token:S.token, email:c.email, tariff:e.target.value }), 'Тариф сохранён'); }
    if (e.target.id !== 'proto' || AV.s !== 'client') return;
    const c = C.find(x => x.email === AV.id); if (!c || !c.assigned) return;
    const k = e.target.value;
    if (!confirm(`Сменить протокол на «${PNAME[k]}»?\n\nУроки, специи и фитосоставы у ученицы сменятся на материалы нового протокола.`)) { e.target.value = c.type; return; }
    act(() => api('confirm', { token:S.token, email:c.email, protocol:PNAME[k] }), 'Протокол изменён');
  }
  function input(e){
    const t = e.target;
    if (t.id === 'cq') { CF.q = t.value; const p = t.selectionStart; render(true); const n = $('#cq'); n.focus(); n.setSelectionRange(p, p); }
    if (t.id === 'pq') { AV.pq = t.value; const p = t.selectionStart; openDr(picker()); const n = $('#pq'); n.focus(); n.setSelectionRange(p, p); }
    if (t.id === 'asq') { $('#asl').innerHTML = assignList(AV.lastPrev, t.value); }
    if (t.id === 'kq') { KF.q = t.value; const p = t.selectionStart; render(true); const n = $('#kq'); n.focus(); n.setSelectionRange(p, p); }
  }
  return { fold(k, v){ AV.open = AV.open || {}; AV.open[k] = v; }, open, click, change, input, closeDr, reset(){ D = null; C = []; AV = { s:'over' }; }, get data(){ return D; }, set data(v){ if (!v) this.reset(); } };
})();

// ═══ Общие обработчики ═════════════════════════════════════════
document.addEventListener('click', e => {
  const b = e.target.closest('[data-a]'); if (!b) return;
  const a = b.dataset.a;
  if (b.closest('#A')) return Adm.click(e, b, a);
  if (b.closest('#U')) return studentClick(e, b, a);
});
document.addEventListener('change', e => { if (e.target.closest && e.target.closest('#A')) Adm.change(e); });
document.addEventListener('input', e => { if (e.target.closest && e.target.closest('#A')) Adm.input(e); });
document.addEventListener('toggle', e => { if (e.target.matches && e.target.matches('details.fold[data-k]')) Adm.fold(e.target.dataset.k, e.target.open); }, true);
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') Adm.closeDr();
  if (e.key === 'Enter' && e.target.matches && e.target.matches('tr[data-a=open]')) e.target.click();
});
$('#dr').addEventListener('click', e => { if (e.target.id === 'dr') Adm.closeDr(); });
boot();

</script>
