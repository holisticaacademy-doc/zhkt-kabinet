<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Кабинет «Формула здоровья ЖКТ»</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Commissioner:wght@400;500;600;700;800&display=swap">
<style>
/* Макет: узкая читательская колонка для ученицы, двухпанельный рабочий стол для куратора.
   Бренд Holistica DOC: тёмно-зелёный — заголовки, пурпурный — акценты, мята — инфоблоки, тёплый — инсайты. */
:root{
  --green:#173f35; --green2:#2a6b5a; --plum:#9e007e; --plum-soft:#f6e6f2;
  --mint:#e8f5f1; --mint2:#d0ede5; --warm:#fdf3ea; --warm-line:#f0d9c4;
  --bg:#f4f7f5; --surface:#ffffff; --fg:#22302b; --muted:#5d6b66; --line:#dbe7e2;
  --btn:#173f35; --btn-hover:#2a6b5a; --on:#ffffff;
  --ok:#1f7a4f; --ok-bg:#e3f4ea; --warn:#9a5b00; --warn-bg:#fff2dc; --bad:#b52a2a; --bad-bg:#fde8e8;
  --pV:#2f6f57; --pI:#b2452b; --pC:#6a4bb0; --pM:#9a6a12;
  --font:'Commissioner',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --r:14px; --shadow:0 2px 14px rgba(23,63,53,.08);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --green:#9fdcc6; --green2:#7cc4ab; --plum:#e77bd0; --plum-soft:#3a1d34;
  --mint:#173a31; --mint2:#1f4a3f; --warm:#2c241c; --warm-line:#4a3a2b;
  --bg:#0e1916; --surface:#15231f; --fg:#e5eeea; --muted:#9db1a9; --line:#26403a;
  --btn:#2a6b5a; --btn-hover:#358069; --on:#ffffff;
  --ok:#6fd3a0; --ok-bg:#16362a; --warn:#f0b65c; --warn-bg:#3a2c12; --bad:#f08a8a; --bad-bg:#3d1c1c;
  --pV:#7cc9a8; --pI:#f0957c; --pC:#b9a0f0; --pM:#e2bb6a;
  --shadow:0 2px 14px rgba(0,0,0,.35); color-scheme:dark;}}
:root[data-theme="dark"]{
  --green:#9fdcc6; --green2:#7cc4ab; --plum:#e77bd0; --plum-soft:#3a1d34;
  --mint:#173a31; --mint2:#1f4a3f; --warm:#2c241c; --warm-line:#4a3a2b;
  --bg:#0e1916; --surface:#15231f; --fg:#e5eeea; --muted:#9db1a9; --line:#26403a;
  --btn:#2a6b5a; --btn-hover:#358069; --on:#ffffff;
  --ok:#6fd3a0; --ok-bg:#16362a; --warn:#f0b65c; --warn-bg:#3a2c12; --bad:#f08a8a; --bad-bg:#3d1c1c;
  --pV:#7cc9a8; --pI:#f0957c; --pC:#b9a0f0; --pM:#e2bb6a;
  --shadow:0 2px 14px rgba(0,0,0,.35); color-scheme:dark;}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{color:var(--green);line-height:1.2;text-wrap:balance;margin:0}
h1{font-size:clamp(26px,4vw,34px);font-weight:800}
h2{font-size:22px;font-weight:700}
h3{font-size:17px;font-weight:700}
p{margin:0}
a{color:var(--plum)}
:focus-visible{outline:2px solid var(--plum);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:24px 64px}
.wrap.wide{max-width:1240px}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.small{font-size:14px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--plum)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:24px;box-shadow:var(--shadow)}
.info{background:var(--mint);border-radius:12px;padding:16px 18px}
.insight{background:var(--warm);border:1px solid var(--warm-line);border-radius:12px;padding:16px 18px}
.alert{background:var(--bad-bg);color:var(--bad);border-radius:12px;padding:14px 16px;font-weight:500}
.btn{border:0;border-radius:12px;padding:13px 22px;font-weight:700;cursor:pointer;background:var(--btn);color:var(--on);transition:background .15s,transform .15s}
.btn:hover{background:var(--btn-hover)}
.btn:disabled{opacity:.55;cursor:default}
.btn.plum{background:var(--plum);color:#fff}
.btn.plum:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--green);border:1.5px solid var(--line)}
.btn.ghost:hover{background:var(--mint)}
.btn.danger{background:transparent;color:var(--bad);border:1.5px solid var(--bad)}
.btn.sm{padding:8px 14px;font-size:14px;border-radius:10px}
.btn.block{width:100%;display:block;text-align:center;text-decoration:none}
.link{background:none;border:0;color:var(--plum);cursor:pointer;padding:0;font-weight:600;text-decoration:underline;text-underline-offset:3px}
label.f{display:block;font-weight:600;font-size:14px;color:var(--green);margin-bottom:6px}
.inp{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:11px;background:var(--surface);outline:none}
.inp:focus{border-color:var(--green2)}
textarea.inp{min-height:96px;resize:vertical}
.err{color:var(--bad);font-size:14px;min-height:20px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;padding:3px 10px;border-radius:99px;white-space:nowrap}
.pill.none{background:var(--mint);color:var(--muted)}
.pill.wait{background:var(--warn-bg);color:var(--warn)}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.flag{background:var(--bad-bg);color:var(--bad)}
.proto{font-weight:700;font-size:13px}
.proto.V{color:var(--pV)}.proto.I{color:var(--pI)}.proto.C{color:var(--pC)}.proto.M{color:var(--pM)}
.demo{background:var(--plum-soft);border:1px dashed var(--plum);border-radius:12px;padding:14px 16px;font-size:14px}
.demo b{color:var(--plum)}
.chipbtn{border:1.5px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:13.5px;cursor:pointer;font-weight:600;color:var(--green)}
.chipbtn:hover{border-color:var(--green2)}
.chipbtn.on{background:var(--green);border-color:var(--green);color:var(--surface)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--green);color:var(--surface);padding:12px 18px;border-radius:12px;font-weight:600;z-index:50;max-width:calc(100% - 32px);box-shadow:var(--shadow)}

/* шапка */
.top{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.top .in{max-width:1240px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;line-height:1.15}
.brand b{font-size:12px;letter-spacing:.16em;color:var(--plum);font-weight:800}
.brand span{font-weight:700;color:var(--green)}

/* вход */
.login{max-width:440px;margin:6vh auto 0}
.pw{position:relative}
.pw .inp{padding-right:96px}
.pw-eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:var(--mint);color:var(--green);font-weight:600;font-size:13px;border-radius:8px;padding:6px 10px;cursor:pointer}

/* анкета */
.prog{height:6px;background:var(--mint2);border-radius:6px;overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--green2),var(--plum));transition:width .3s}
.qhead{background:var(--green);color:#fff;border-radius:var(--r) var(--r) 0 0;padding:22px 24px}
:root[data-theme="dark"] .qhead{background:#1d4a3e}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .qhead{background:#1d4a3e}}
.qhead h2{color:#fff}
.qhead .eyebrow{color:rgba(255,255,255,.7)}
.qbody{background:var(--surface);border:1px solid var(--line);border-top:0;border-radius:0 0 var(--r) var(--r);padding:22px 24px;display:flex;flex-direction:column;gap:22px}
.gate{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.gate button{flex:1;min-width:120px;max-width:180px;padding:11px;border-radius:11px;border:2px solid rgba(255,255,255,.4);background:transparent;color:#fff;font-weight:700;cursor:pointer}
.gate button.on{background:#fff;color:#173f35;border-color:#fff}
.qi .qt{font-weight:600;margin-bottom:9px}
.scale{display:flex;gap:7px;flex-wrap:wrap}
.scale button{flex:1 1 120px;padding:10px 8px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);font-size:13.5px;font-weight:600;color:var(--muted);cursor:pointer;line-height:1.25}
.scale button:hover{border-color:var(--green2);color:var(--green)}
.scale button.on{background:var(--green);border-color:var(--green);color:var(--surface)}
.hint{font-size:14px;color:var(--plum);background:var(--plum-soft);border-radius:10px;padding:10px 14px}
.dgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px}
.dchk{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;cursor:pointer;font-size:14.5px;background:var(--surface)}
.dchk input{margin-top:4px;accent-color:var(--green)}
.dchk.on{border-color:var(--green2);background:var(--mint)}
.nav{display:flex;gap:10px;margin-top:16px}
.nav .btn:last-child{flex:1}
.sum-sec{border-top:1px solid var(--line);padding-top:14px}
.sum-row{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:12px;font-size:14.5px;padding:4px 0}
.sum-row span:last-child{font-weight:600;color:var(--green)}

/* кабинет */
.hero{background:var(--green);color:#fff;border-radius:18px;padding:26px 26px 24px;display:flex;flex-direction:column;gap:10px}
:root[data-theme="dark"] .hero{background:#1d4a3e}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .hero{background:#1d4a3e}}
.hero h1{color:#fff}
.hero .eyebrow{color:#f3b8e6}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.steps span{font-size:13px;font-weight:600;padding:5px 11px;border-radius:99px;background:rgba(255,255,255,.12);color:rgba(255,255,255,.75)}
.steps span.done{background:rgba(255,255,255,.22);color:#fff}
.steps span.cur{background:#fff;color:#173f35}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.tabs button{white-space:nowrap}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:8px;text-align:left;cursor:pointer;transition:border-color .15s,transform .15s;text-decoration:none;color:inherit}
.item:hover{border-color:var(--green2);transform:translateY(-1px)}
.item .t{font-weight:700;color:var(--green)}
.item .d{font-size:14px;color:var(--muted);flex:1}
.item .go{font-size:13px;font-weight:700;color:var(--plum)}
.item .tag{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.locked{border:1.5px dashed var(--line);border-radius:12px;padding:22px;text-align:center;color:var(--muted)}
.menu-frame{width:100%;height:85vh;min-height:620px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}

/* админка */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.kpi .n{font-size:28px;font-weight:800;color:var(--green);font-variant-numeric:tabular-nums}
.kpi .l{font-size:13px;color:var(--muted);font-weight:600}
.kpi .bar{height:5px;border-radius:5px;background:var(--mint2);margin-top:8px;overflow:hidden}
.kpi .bar i{display:block;height:100%;background:var(--green2)}
.admin{display:grid;grid-template-columns:minmax(260px,340px) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:860px){.admin{grid-template-columns:minmax(0,1fr)}}
.plist{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);max-height:72vh;overflow:auto}
.pi{padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer;display:flex;flex-direction:column;gap:4px}
.pi:hover{background:var(--mint)}
.pi.on{background:var(--mint);box-shadow:inset 3px 0 0 var(--plum)}
.pi .nm{font-weight:700;display:flex;justify-content:space-between;gap:8px}
.pi .em{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.bars{display:flex;flex-direction:column;gap:8px}
.brow{display:grid;grid-template-columns:150px minmax(0,1fr) 40px;gap:10px;align-items:center;font-size:14px}
.brow .tr{height:10px;background:var(--mint);border-radius:6px;overflow:hidden}
.brow .tr i{display:block;height:100%;border-radius:6px}
.brow b{text-align:right;font-variant-numeric:tabular-nums}
.blocks{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.blk{border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:14px}
.blk h3{font-size:14px;margin-bottom:6px}
.blk div{display:flex;justify-content:space-between;gap:10px;padding:2px 0}
.blk div span:last-child{font-weight:600;text-align:right;color:var(--green)}
.ev{font-size:13.5px;display:grid;grid-template-columns:120px minmax(0,1fr);gap:10px;padding:3px 0;border-bottom:1px dashed var(--line)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>

// ── Автоназначение протокола ─────────────────────────────────────
// Каждый симптом в анкете помечен протоколами (V — Вялое, I — Воспалённое,
// C — Чувствительное). Ответ переводим в долю от максимума шкалы, делим
// поровну между помеченными протоколами и нормируем на «потолок» протокола.
// Если второй по силе протокол набирает ≥ MIX_RATIO от первого — Смешанный тип.
// Веса и порог подобраны по решениям кураторов потока 3.0 (259 анкет).
var PROTO_NAMES = { V: 'Вялое пищеварение', I: 'Воспалённое пищеварение', C: 'Чувствительное пищеварение', M: 'Смешанный тип' };
var PROTO_WEIGHTS = { V: 1, I: 2, C: 1.5 };
var MIX_RATIO = 0.62;
var SCALE_MAX = { s4: 4, r5: 5, ro: 2, na: 2, yes: 1 };

function protoCeilings(Q) {
  var t = { V: 0, I: 0, C: 0 };
  Q.blocks.forEach(function (b) { b.q.forEach(function (q) {
    var pr = q[3]; if (!pr) return;
    for (var i = 0; i < pr.length; i++) t[pr[i]] += 1 / pr.length;
  }); });
  return t;
}

// answers: { qid: номер варианта (1..max) }, diagnoses: [названия]
function autoProtocol(Q, answers, diagnoses, redFlags) {
  var ceil = protoCeilings(Q), raw = { V: 0, I: 0, C: 0 };
  Q.blocks.forEach(function (b) { b.q.forEach(function (q) {
    var v = answers[q[0]], pr = q[3]; if (!v || !pr) return;
    var w = v / SCALE_MAX[q[4]];
    for (var i = 0; i < pr.length; i++) raw[pr[i]] += w / pr.length;
  }); });
  var s = {};
  ['V', 'I', 'C'].forEach(function (k) { s[k] = raw[k] / ceil[k] * PROTO_WEIGHTS[k]; });
  var order = ['V', 'I', 'C'].sort(function (a, b) { return s[b] - s[a]; });
  var top = order[0], second = order[1], code;
  if (s[top] === 0) code = 'M';
  else code = (s[second] / s[top] >= MIX_RATIO) ? 'M' : top;
  var maxS = s[top] || 1, pct = {};
  ['V', 'I', 'C'].forEach(function (k) { pct[k] = Math.round(s[k] / maxS * 100); });
  return { code: code, name: PROTO_NAMES[code], pct: pct, redFlags: redFlags || [] };

  get(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} },
  del(k){ try { localStorage.removeItem(k); } catch(e){} }
};

// ═══ API ════════════════════════════════════════════════════════
async function api(action, params = {}) {
  if (MODE === 'demo') return Demo.call(action, params);
  let j;
  try {
    const r = await fetch(CFG.API_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({ action, ...params }) });
    j = await r.json();
  } catch (e) { throw new Error('Нет связи с сервером. Проверьте интернет и попробуйте ещё раз.'); }
  if (!j.ok) throw new Error(j.error || 'Ошибка сервера');
  return j;
}

// ═══ Демо-бэкенд: повторяет логику Apps Script, хранит всё в браузере ═══
const Demo = (() => {
  const KEY = 'hz_demo_db_v3';
  let mem = null;
  const now = () => new Date().toISOString();
  function seed() {
    const db = { students: [], quizzes: {}, events: [], codes: {}, sessions: {}, content: CONTENT_STUB.map(r => ({'Протокол':r[0],'Раздел':r[1],'Порядок':r[2],'Заголовок':r[3],'Описание':r[4],'Ссылка':r[5],'Показывать':r[6]})) };
    const add = (email, name, role='ученик') => db.students.push({'Email':email,'Имя':name,'Роль':role,'Статус':ST.none});
    add('admin@holistica.test','Куратор (демо)','админ');
    // Вымышленные ученицы с готовыми анкетами — чтобы админка не была пустой
    const fake = [['svetlana','Светлана Пример','C',1],['irina','Ирина Пример','M',0],['natalia','Наталья Пример','I',0],['vera','Вера Пример','V',1],['daria','Дарья Пример','M',0],['ksenia.t','Ксения Пример','C',0]];
    let seedN = 7; const rnd = () => { seedN = (seedN * 9301 + 49297) % 233280; return seedN / 233280; };
    fake.forEach(([id, name, lean, confirmed], i) => {
      const email = id + '@holistica.test';
      add(email, name);
      const answers = {};
      Q.blocks.forEach(b => b.q.forEach(q => {
        const max = SCALE_MAX[q[4]], p = q[3].includes(lean) || (lean==='M' && q[3]) ? .45 : .12;
        if (rnd() < p) answers[q[0]] = 1 + Math.floor(rnd() * max);
      }));
      delete answers.b8q_flag;
      const quiz = { personal:{sex:'Женский',age:34+i*3,height:165,weight:60+i*2,waist:72+i,bmi:(60+i*2)/(1.65*1.65)}, answers, diagnoses: i%2 ? ['Гастрит хронический','Дисбиоз кишечника'] : ['Синдром раздражённого кишечника (СРК)'], redFlags: [], meds:'', goals:'Хочу понять, что происходит с животом, и перестать бояться еды.', date: new Date(Date.now()-86400000*(6-i)).toISOString() };
      quiz.auto = autoProtocol(Q, answers, quiz.diagnoses, []);
      db.quizzes[email] = quiz;
      const st = db.students.find(s => s['Email'] === email);
      st._pw = 'seeded';
      Object.assign(st, {'Статус':ST.wait,'Протокол авто':quiz.auto.name,'Баллы В/Вс/Ч':`${quiz.auto.pct.V} / ${quiz.auto.pct.I} / ${quiz.auto.pct.C}`,'Красные флаги':'Нет','Дата анкеты':quiz.date,'Первый вход':quiz.date,'Последний вход':quiz.date});
      db.events.push({'Дата':quiz.date,'Email':email,'Событие':'login','Объект':''},{'Дата':quiz.date,'Email':email,'Событие':'quiz_submit','Объект':quiz.auto.name});
      if (confirmed) {
        Object.assign(st, {'Статус':ST.ok,'Протокол итог':quiz.auto.name,'Куратор':'Куратор (демо)','Дата подтверждения':quiz.date});
        db.events.push({'Дата':quiz.date,'Email':email,'Событие':'open','Объект':'Уроки: Как работает программа'});
      }
    });
    return db;
  }
  const load = () => mem || (mem = LS.get(KEY, null) || seed());
  const save = () => LS.set(KEY, mem);
  const find = (email) => load().students.find(s => s['Email'].toLowerCase() === String(email).trim().toLowerCase());
  const log = (email, type, item='') => load().events.push({'Дата':now(),'Email':email,'Событие':type,'Объект':item});
  function auth(token) {
    const s = load().sessions[token];
    if (!s) throw new Error('AUTH');
    const st = find(s); if (!st) throw new Error('AUTH');
    return st;
  }
  function demoHash(x) { let h = 5381; for (const c of x) h = ((h << 5) + h + c.charCodeAt(0)) | 0; return 'd' + (h >>> 0).toString(36); }
  function session(st) {
    const token = 'demo-' + Math.random().toString(36).slice(2);
    load().sessions[token] = st['Email'];
    if (!st['Первый вход']) st['Первый вход'] = now();
    st['Последний вход'] = now(); log(st['Email'], 'login');
    return token;
  }
  function adminAuth(token) { const st = auth(token); if (!isStaff({role:st['Роль']})) throw new Error('Нет доступа'); return st; }
  const pub = d => ({ email:d['Email'], name:d['Имя'], role:d['Роль'], status:d['Статус']||ST.none, autoProtocol:d['Протокол авто'], protocol:d['Протокол итог'], comment:d['Комментарий куратора'] });
  const A = {
    checkEmail({email}) {
      const st = find(email);
      if (!st) throw new Error('На данный email не оформлена покупка курса. Проверьте адрес или напишите куратору.');
      return { hasPassword: !!st._pw, name: st['Имя'] || '' };
    },
    setPassword({email, password}) {
      const st = find(email); if (!st) throw new Error('На данный email не оформлена покупка курса. Проверьте адрес или напишите куратору.');
      if (String(password).length < 6) throw new Error('Пароль должен быть не короче 6 символов');
      if (st._pw) throw new Error('Пароль уже задан. Войдите с ним или попросите куратора сбросить пароль.');
      st._pw = demoHash(st['Email'] + password); log(st['Email'], 'password_set');
      return { token: session(st) };
    },
    login({email, password}) {
      const st = find(email); if (!st) throw new Error('На данный email не оформлена покупка курса. Проверьте адрес или напишите куратору.');
      if (!st._pw) throw new Error('Пароль ещё не задан');
      if (st._pw !== demoHash(st['Email'] + password)) throw new Error('Неверный пароль');
      return { token: session(st) };
    },
    me({token}) { const st = auth(token); return { user: pub(st), quiz: load().quizzes[st['Email']] || null, content: load().content }; },
    submitQuiz({token, quiz}) {
      const st = auth(token);
      if (st['Статус'] && st['Статус'] !== ST.none) throw new Error('Анкета уже отправлена');
      const res = autoProtocol(Q, quiz.answers||{}, quiz.diagnoses||[], quiz.redFlags||[]);
      quiz.auto = res; quiz.date = now();
      load().quizzes[st['Email']] = quiz;
      Object.assign(st, {'Статус':ST.wait,'Протокол авто':res.name,'Баллы В/Вс/Ч':`${res.pct.V} / ${res.pct.I} / ${res.pct.C}`,'Красные флаги':(quiz.redFlags||[]).join('; ')||'Нет','Дата анкеты':now()});
      log(st['Email'], 'quiz_submit', res.name);
      return { auto: res };
    },
    event({token, type, item}) { const st = auth(token); log(st['Email'], type, item); return {}; },
    adminData({token}) { adminAuth(token); const db = load();
      return { students: db.students.map(({_pw, ...r}) => ({ ...r, 'Пароль задан': _pw ? 'да' : 'нет' })), quizzes: db.quizzes, events: db.events }; },
    resetPassword({token, email}) {
      adminAuth(token); const st = find(email); if (!st) throw new Error('Ученица не найдена');
      delete st._pw; for (const k in load().sessions) if (load().sessions[k] === st['Email']) delete load().sessions[k];
      log(st['Email'], 'password_reset'); return {};
    },
    confirm({token, email, protocol, comment}) {
      const a = adminAuth(token), st = find(email); if (!st) throw new Error('Ученица не найдена');
      Object.assign(st, {'Протокол итог':protocol,'Комментарий куратора':comment||'','Куратор':a['Имя']||a['Email'],'Статус':ST.ok,'Дата подтверждения':now()});
      log(st['Email'], 'confirmed', protocol); return {};
    },
    resetQuiz({token, email}) {
      adminAuth(token); const st = find(email); if (!st) throw new Error('Ученица не найдена');
      delete load().quizzes[st['Email']];
      ['Протокол авто','Баллы В/Вс/Ч','Протокол итог','Красные флаги','Дата анкеты','Дата подтверждения'].forEach(k => st[k] = '');
      st['Статус'] = ST.none; log(st['Email'], 'quiz_reset'); return {};
    },
    addStudents({token, rows}) {
      adminAuth(token); let added = 0;
      rows.forEach(r => { const e = String(r.email||'').trim().toLowerCase(); if (!e || find(e)) return;
        load().students.push({'Email':e,'Имя':r.name||'','Роль':r.role||'ученик','Статус':ST.none}); added++; });
      return { added };
    }
  };
  return {
    async call(action, p) {
      await new Promise(r => setTimeout(r, 180));
      if (!A[action]) throw new Error('Неизвестное действие');
      const out = A[action](JSON.parse(JSON.stringify(p))); save();
      return JSON.parse(JSON.stringify({ ok:true, ...out }));
    },
    reset() { mem = seed(); save(); }
  };
})();

      ${passField('pw1', 'Пароль', 'current-password')}
      <div class="err" id="er"></div>
      <button class="btn block" id="go">Войти</button>
      <div class="row" style="justify-content:space-between"><button type="button" class="link" id="back">Другой email</button><button type="button" class="link" id="forgot">Забыли пароль?</button></div>
      <div class="info small stack" id="forgot-msg" style="gap:10px" hidden><span>Напишите своему куратору или в службу заботы: пароль сбросят, и при следующем входе вы придумаете новый.</span>${supportBtn()}</div>`;
  $('#app').innerHTML = `<main class="wrap"><div class="login stack">
    <div class="stack" style="gap:6px"><span class="eyebrow">Holistica DOC</span><h1>Формула здоровья ЖКТ</h1>
    <p class="muted">Личный кабинет участницы программы</p></div>
    <form class="card stack" id="lf" novalidate>${body}</form>${demo}</div></main>`;
  const f = $('#lf'), er = $('#er'), go = $('#go');
  const busy = (on, label) => { go.disabled = on; go.textContent = label; };
  document.querySelectorAll('.demo-email').forEach(b => b.onclick = () => renderLogin('email', b.dataset.e));
  document.querySelectorAll('.pw-eye').forEach(b => b.onclick = () => { const i = $('#' + b.dataset.for); const show = i.type === 'password'; i.type = show ? 'text' : 'password'; b.textContent = show ? 'Скрыть' : 'Показать'; });
  if ($('#demo-reset')) $('#demo-reset').onclick = () => { Demo.reset(); LS.del(TOKEN_KEY); toast('Демо-данные сброшены'); };
  if ($('#back')) $('#back').onclick = () => renderLogin('email', email);
  if ($('#forgot')) $('#forgot').onclick = () => { $('#forgot-msg').hidden = false; };
  const enter = token => { S.token = token; LS.set(TOKEN_KEY, token); boot(); };
  if (step === 'email') {
    $('#em').focus();
    f.onsubmit = async e => {
      e.preventDefault(); const em = $('#em').value.trim().toLowerCase();
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)) { er.textContent = 'Похоже, в адресе опечатка'; return; }
      busy(true, 'Проверяем…'); er.textContent = '';
      try { const r = await api('checkEmail', { email: em }); renderLogin(r.hasPassword ? 'password' : 'create', em, r.name); }
      catch (x) {
        er.textContent = x.message; busy(false, 'Продолжить');
        if (/не оформлена/.test(x.message) && !$('#support')) er.insertAdjacentHTML('afterend', supportBtn());
      }
    };
  } else if (step === 'create') {
    $('#pw1').focus();
    f.onsubmit = async e => {
      e.preventDefault(); const p1 = $('#pw1').value, p2 = $('#pw2').value;
      if (p1.length < 6) { er.textContent = 'Пароль должен быть не короче 6 символов'; return; }
      if (p1 !== p2) { er.textContent = 'Пароли не совпадают'; return; }
      busy(true, 'Сохраняем…'); er.textContent = '';
      try { enter((await api('setPassword', { email, password: p1 })).token); }
      catch (x) { er.textContent = x.message; busy(false, 'Сохранить и войти'); }
    };
  } else {
    $('#pw1').focus();
    f.onsubmit = async e => {
      e.preventDefault(); busy(true, 'Входим…'); er.textContent = '';
      try { enter((await api('login', { email, password: $('#pw1').value })).token); }
      catch (x) { er.textContent = x.message; busy(false, 'Войти'); }
    };
  }
}

// ═══ АНКЕТА ═════════════════════════════════════════════════════
const STEPS = ['intro','personal','diag', ...Q.blocks.map(b => b.id), 'meds', 'summary'];
const draftKey = () => 'hz_draft_' + MODE + '_' + (S.user?.email || '');
function getDraft() { return S.draft || (S.draft = LS.get(draftKey(), null) || { step: 0, personal: {}, gates: {}, answers: {}, diagnoses: [], chol: '', products: '', meds: '', goals: '' }); }
const saveDraft = () => LS.set(draftKey(), S.draft);

function redFlagsOf(d) {
  const f = d.diagnoses.filter(n => (Q.diagnoses.find(x => x[0] === n) || [])[1]);
  if (d.answers.b8q_flag) f.push('Чёрный смолистый кал (' + Q.scales.s4[d.answers.b8q_flag - 1] + ')');
  return f;
}

function scaleHTML(q, d) {
  const labels = Q.scales[q[4]];
  return `<div class="scale" role="group" aria-label="${esc(q[1])}">${labels.map((l, i) => `<button type="button" class="${d.answers[q[0]] === i + 1 ? 'on' : ''}" data-q="${q[0]}" data-v="${i + 1}">${esc(l)}</button>`).join('')}</div>`;
}

function renderQuiz() {
  const d = getDraft(), step = STEPS[d.step], total = STEPS.length - 2;
  const pct = Math.max(0, Math.min(100, Math.round((d.step - 1) / total * 100)));
  let html = '';
  const nav = (next = 'Продолжить') => `<div class="nav">${d.step > 0 ? '<button class="btn ghost" id="prev">Назад</button>' : ''}<button class="btn" id="next">${next}</button></div>`;
  if (step === 'intro') {
    html = `<div class="card stack">
      <span class="eyebrow">Шаг 1 · Диагностическая анкета</span>
      <h1>Здравствуйте${S.user.name ? ', ' + esc(S.user.name.split(' ')[0]) : ''}!</h1>
      <p>Прежде чем откроются материалы, расскажите, как сейчас живёт ваше пищеварение. По этим ответам куратор подберёт ваш протокол.</p>
      <div class="info stack" style="gap:6px"><p><b>Отвечайте про текущее состояние</b>, а не про то, как было когда-то.</p>
      <p>Если симптома нет, просто пропускайте его. Анкета занимает около 15 минут, прогресс сохраняется, можно вернуться позже.</p></div>
      <div class="insight"><p><b>Не забудьте про фото языка.</b> Утром, до чистки зубов, натощак. Куратор попросит его отдельно.</p></div>
      ${nav('Начать анкету')}</div>`;
  } else if (step === 'personal') {
    const p = d.personal;
    html = qwrap('Ваши данные на старте', '', `
      <div class="grid2">
        <div><label class="f">Пол</label><div class="scale">${['Женский','Мужской'].map(s => `<button type="button" class="${p.sex === s ? 'on' : ''}" data-sex="${s}">${s}</button>`).join('')}</div></div>
        <div><label class="f" for="p-age">Возраст</label><input class="inp" id="p-age" type="number" min="14" max="99" value="${esc(p.age || '')}"></div>
        <div><label class="f" for="p-h">Рост, см</label><input class="inp" id="p-h" type="number" value="${esc(p.height || '')}"></div>
        <div><label class="f" for="p-w">Вес, кг</label><input class="inp" id="p-w" type="number" step="0.1" value="${esc(p.weight || '')}"></div>
        <div><label class="f" for="p-waist">Обхват талии, см (необязательно)</label><input class="inp" id="p-waist" type="number" value="${esc(p.waist || '')}"></div>
      </div><div class="err" id="er"></div>`) + nav();
  } else if (step === 'diag') {
    html = qwrap('Диагнозы', 'Есть ли у вас диагнозы, установленные врачом по результатам обследований?', `
      <div class="hint">Отметьте всё, что есть. Если диагнозов нет, нажмите «Продолжить».</div>
      <div class="dgrid">${Q.diagnoses.map(([n], i) => `<label class="dchk ${d.diagnoses.includes(n) ? 'on' : ''}"><input type="checkbox" data-dg="${i}" ${d.diagnoses.includes(n) ? 'checked' : ''}><span>${esc(n)}</span></label>`).join('')}</div>
      ${d.diagnoses.includes('Повышенный холестерин') ? `<div><label class="f" for="chol">Значение холестерина, ммоль/л</label><input class="inp" id="chol" value="${esc(d.chol)}"></div>` : ''}`) + nav();
  } else if (step === 'meds') {
    html = qwrap('Лекарства и цели', '', `
      <div><label class="f" for="meds">Принимаете ли вы регулярно лекарства? Если да — какие и в связи с чем</label><textarea class="inp" id="meds" maxlength="600">${esc(d.meds)}</textarea></div>
      <div><label class="f" for="goals">С какой целью вы пришли на программу? Что уже пробовали?</label><textarea class="inp" id="goals" maxlength="800">${esc(d.goals)}</textarea></div>`) + nav('Посмотреть ответы');
  } else if (step === 'summary') {
    html = `<div class="card stack"><span class="eyebrow">Последний шаг</span><h2>Проверьте ответы</h2>
      <p class="muted">После отправки изменить анкету можно будет только через куратора.</p>
      ${answersSummary(d)}</div>
      <div class="nav"><button class="btn ghost" id="prev">Изменить</button><button class="btn plum" id="send">Всё верно, отправить</button></div><div class="err" id="er"></div>`;
  } else {
    const b = Q.blocks.find(x => x.id === step), gate = b.gate ? d.gates[b.id] : 'yes';
    html = qwrap(b.title, b.gate || 'Отметьте то, что у вас есть', `
      ${gate === 'yes' ? `<div class="hint">Отмечайте только те симптомы, которые у вас есть. Повторное нажатие снимает выбор.</div>
        ${b.q.map(q => `<div class="qi"><div class="qt">${esc(q[1])}</div>${scaleHTML(q, d)}
          ${q[0] === 'b7q3_scale' && d.answers.b7q3_scale ? `<input class="inp" id="products" style="margin-top:8px" placeholder="На какие продукты? Например: бобовые, молоко, капуста" value="${esc(d.products)}">` : ''}</div>`).join('')}`
        : gate === 'no' ? '<p class="muted">Хорошо, этот блок пропускаем.</p>' : '<p class="muted">Ответьте на вопрос выше, чтобы продолжить.</p>'}`,
      b.gate ? `<div class="gate"><button type="button" data-gate="yes" class="${gate === 'yes' ? 'on' : ''}">Да</button><button type="button" data-gate="no" class="${gate === 'no' ? 'on' : ''}">Нет</button></div>` : '') + nav();
  }
  $('#app').innerHTML = topbar() + `<main class="wrap stack">
    ${d.step > 0 ? `<div class="stack" style="gap:6px"><div class="row" style="justify-content:space-between"><span class="small muted">Анкета</span><span class="small muted">${pct}%</span></div><div class="prog"><i style="width:${pct}%"></i></div></div>` : ''}
    ${html}</main>`;
  bindTop();
  bindQuiz(d, step);
}
function qwrap(title, sub, body, gate = '') {
  const n = STEPS.indexOf(getDraft() && STEPS[getDraft().step]);
  return `<section><div class="qhead"><div class="eyebrow">Блок ${n} из ${STEPS.length - 2}</div><h2>${esc(title)}</h2>${sub ? `<p style="margin-top:6px;opacity:.85">${esc(sub)}</p>` : ''}${gate}</div><div class="qbody">${body}</div></section>`;
}
function readStep(d, step) {
  if (step === 'personal') {
    const p = d.personal; p.age = $('#p-age').value; p.height = $('#p-h').value; p.weight = $('#p-w').value; p.waist = $('#p-waist').value;
    if (p.height > 0 && p.weight > 0) p.bmi = +(p.weight / ((p.height / 100) ** 2)).toFixed(1);
  }
  if (step === 'diag' && $('#chol')) d.chol = $('#chol').value;
  if (step === 'b7' && $('#products')) d.products = $('#products').value;
  if (step === 'meds') { d.meds = $('#meds').value; d.goals = $('#goals').value; }
  saveDraft();
}
function bindQuiz(d, step) {
  const go = n => { readStep(d, step); d.step = n; saveDraft(); renderQuiz(); window.scrollTo(0, 0); };
  if ($('#prev')) $('#prev').onclick = () => go(d.step - 1);
  if ($('#next')) $('#next').onclick = () => {
    if (step === 'personal') {
      readStep(d, step); const p = d.personal;
      if (!p.sex || !p.age || !p.height || !p.weight) { $('#er').textContent = 'Заполните пол, возраст, рост и вес'; return; }
    }
    const b = Q.blocks.find(x => x.id === step);
    if (b && b.gate && !d.gates[b.id]) { toast('Ответьте «Да» или «Нет» в начале блока'); return; }
    go(d.step + 1);
  };
  document.querySelectorAll('[data-sex]').forEach(x => x.onclick = () => { readStep(d, step); d.personal.sex = x.dataset.sex; saveDraft(); renderQuiz(); });
  document.querySelectorAll('[data-gate]').forEach(x => x.onclick = () => {
    readStep(d, step); d.gates[step] = x.dataset.gate;
    if (x.dataset.gate === 'no') Q.blocks.find(b => b.id === step).q.forEach(q => delete d.answers[q[0]]);
    saveDraft(); renderQuiz();
  });
  document.querySelectorAll('.scale button[data-q]').forEach(x => x.onclick = () => {
    readStep(d, step); const q = x.dataset.q, v = +x.dataset.v;
    if (d.answers[q] === v) delete d.answers[q]; else d.answers[q] = v;
    saveDraft(); const y = window.scrollY; renderQuiz(); window.scrollTo(0, y);
  });
  document.querySelectorAll('[data-dg]').forEach(x => x.onchange = () => {
    readStep(d, step); const n = Q.diagnoses[+x.dataset.dg][0];
    d.diagnoses = x.checked ? [...new Set([...d.diagnoses, n])] : d.diagnoses.filter(z => z !== n);
    saveDraft(); const y = window.scrollY; renderQuiz(); window.scrollTo(0, y);
  });
  if ($('#send')) $('#send').onclick = async () => {
    const btn = $('#send'); btn.disabled = true; btn.textContent = 'Отправляем…';
    const quiz = { personal: d.personal, answers: d.answers, diagnoses: d.diagnoses, chol: d.chol, products: d.products, meds: d.meds, goals: d.goals, redFlags: redFlagsOf(d) };
    try {
      await api('submitQuiz', { token: S.token, quiz });
      LS.del(draftKey()); S.draft = null; S.justSent = true;
      await boot();
    } catch (x) { $('#er').textContent = x.message; btn.disabled = false; btn.textContent = 'Всё верно, отправить'; }
  };
}
function answersSummary(d) {
  const p = d.personal || {}, rows = [];
  rows.push(`<div class="sum-sec"><h3>Данные</h3>${[['Пол', p.sex], ['Возраст', p.age], ['Рост / вес', p.height && p.weight ? p.height + ' см / ' + p.weight + ' кг' : ''], ['ИМТ', p.bmi], ['Талия', p.waist ? p.waist + ' см' : '']].filter(r => r[1]).map(r => `<div class="sum-row"><span>${r[0]}</span><span>${esc(r[1])}</span></div>`).join('')}</div>`);
  if (d.diagnoses?.length) rows.push(`<div class="sum-sec"><h3>Диагнозы</h3>${d.diagnoses.map(n => `<div class="sum-row"><span>${esc(n)}</span><span>✓</span></div>`).join('')}${d.chol ? `<div class="sum-row"><span>Холестерин</span><span>${esc(d.chol)}</span></div>` : ''}</div>`);
  Q.blocks.forEach(b => {
    const qs = b.q.filter(q => d.answers?.[q[0]]); if (!qs.length) return;
    rows.push(`<div class="sum-sec"><h3>${esc(b.title)}</h3>${qs.map(q => `<div class="sum-row"><span>${esc(q[2])}</span><span>${esc(Q.scales[q[4]][d.answers[q[0]] - 1])}</span></div>`).join('')}${b.id === 'b7' && d.products ? `<div class="sum-row"><span>Продукты-триггеры</span><span>${esc(d.products)}</span></div>` : ''}</div>`);
  });
  if (d.meds) rows.push(`<div class="sum-sec"><h3>Лекарства</h3><p>${esc(d.meds)}</p></div>`);
  if (d.goals) rows.push(`<div class="sum-sec"><h3>Цели</h3><p>${esc(d.goals)}</p></div>`);
  return rows.join('');
}

function renderCabinet() {
  const u = S.user, ok = u.status === ST.ok, flags = S.quiz?.redFlags?.length;
  const auto = S.quiz?.auto;
  let hero;
  if (ok) {
    hero = `<div class="hero"><span class="eyebrow">Ваш протокол</span><h1>${esc(u.protocol)}</h1>
      <p style="opacity:.85">Куратор посмотрел вашу анкету и подтвердил протокол. Все материалы ниже подобраны под него.</p></div>
      ${u.comment ? `<div class="insight"><p class="eyebrow" style="margin-bottom:4px">Комментарий куратора</p><p>${esc(u.comment)}</p></div>` : ''}`;
  } else {
    hero = `<div class="hero"><span class="eyebrow">Анкета у куратора</span>
      <h1>${S.justSent ? 'Спасибо, ответы получены' : 'Ждём подтверждения протокола'}</h1>
      <p style="opacity:.85">Куратор внимательно посмотрит ответы и подтвердит протокол в течение двух рабочих дней. Как только это произойдёт, здесь откроются уроки, специи, фитоформулы и меню.</p>
      <div class="steps"><span class="done">Анкета ✓</span><span class="cur">Проверка куратором</span><span>Протокол открыт</span></div></div>
      ${CFG.SHOW_AUTO_TO_STUDENT && auto && !flags ? `<div class="info"><p>По ответам ваш рисунок пищеварения ближе всего к протоколу <b>«${esc(auto.name)}»</b>. Это предварительный результат, окончательно протокол определяет куратор.</p></div>` : ''}
      ${flags ? `<div class="insight"><p>В ваших ответах есть пункты, которые куратор обсудит с вами лично. Если сейчас есть обострение или сильная боль, пожалуйста, не откладывайте визит к врачу: программа идёт вместе с наблюдением у специалиста и не заменяет его.</p></div>` : ''}`;
  }
  const tabs = [...SECTIONS, 'Меню и рецепты', 'Мои ответы'];
  $('#app').innerHTML = topbar(isStaff(u) ? '<button class="btn ghost sm" id="switch-view">Админка</button>' : '') + `<main class="wrap stack${S.tab === 'Меню и рецепты' && ok ? ' wide' : ''}">${hero}
    <nav class="tabs" aria-label="Разделы">${tabs.map(t => `<button class="chipbtn ${S.tab === t ? 'on' : ''}" data-tab="${t}">${t}</button>`).join('')}</nav>
    <section id="tabc" class="stack"></section></main>`;
  bindTop();
  document.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { S.tab = b.dataset.tab; renderCabinet(); });
  renderTab();
}
function renderTab() {
  const u = S.user, ok = u.status === ST.ok, box = $('#tabc');
  const lockMsg = '<div class="locked">Материалы вашего протокола откроются после подтверждения куратором.</div>';
  if (S.tab === 'Мои ответы') {
    box.innerHTML = S.quiz ? `<div class="card stack"><p class="muted small">Анкета отправлена ${fmtDate(S.quiz.date)}. Изменить ответы можно через куратора.</p>${answersSummary(S.quiz)}</div>` : '<div class="locked">Анкета ещё не заполнена.</div>';
    return;
  }
  if (S.tab === 'Меню и рецепты') {
    if (!ok) { box.innerHTML = lockMsg; return; }
    const code = PROTO_CODE[u.protocol];
    box.innerHTML = '<div class="locked">Загружаем конструктор меню…</div>';
    const url = CFG.MENU_URL + (CFG.MENU_URL.includes('?') ? '&' : '?') + 'protocol=' + (code || '') + '#' + (code || '');
    fetch(CFG.MENU_URL, { method: 'HEAD' }).then(r => {
      if (!r.ok) throw 0;
      box.innerHTML = `<iframe class="menu-frame" src="${esc(url)}" title="Конструктор меню"></iframe>`;
      track('open', 'Меню: конструктор');
    }).catch(() => {
      box.innerHTML = `<div class="locked"><b>Конструктор меню скоро появится здесь.</b><br>${code ? 'Он откроется сразу на вашем протоколе.' : 'Для вашего протокола куратор пришлёт меню отдельно.'}</div>`;
    });
    return;
  }
  const items = S.content.filter(r => r['Раздел'] === S.tab && String(r['Показывать']).toLowerCase() !== 'нет'
    && (r['Протокол'] === 'Все' || (ok && r['Протокол'] === u.protocol)))
    .sort((a, b) => (a['Протокол'] === 'Все' ? 0 : 1) - (b['Протокол'] === 'Все' ? 0 : 1) || a['Порядок'] - b['Порядок']);
  const card = r => {
    const tag = r['Протокол'] === 'Все' ? 'Для всех' : 'Ваш протокол';
    const inner = `<span class="tag">${tag}</span><span class="t">${esc(r['Заголовок'])}</span><span class="d">${esc(r['Описание'])}</span><span class="go">${r['Ссылка'] ? 'Открыть →' : 'Скоро'}</span>`;
    return r['Ссылка']
      ? `<a class="item" href="${esc(r['Ссылка'])}" target="_blank" rel="noopener" data-track="${esc(S.tab + ': ' + r['Заголовок'])}">${inner}</a>`
      : `<button type="button" class="item" data-track="${esc(S.tab + ': ' + r['Заголовок'])}" data-soon="1">${inner}</button>`;
  };
  box.innerHTML = (items.length ? `<div class="items">${items.map(card).join('')}</div>` : '') +
    (!ok ? lockMsg : (!items.length ? '<div class="locked">В этом разделе пока пусто.</div>' : ''));
  box.querySelectorAll('[data-track]').forEach(a => a.addEventListener('click', () => {
    track('open', a.dataset.track); if (a.dataset.soon) toast('Материал появится совсем скоро');
  }));
}
function track(type, item) { api('event', { token: S.token, type, item }).catch(() => {}); }

async function loadAdmin() { S.admin = await api('adminData', { token: S.token }); }
async function renderAdmin() {
  $('#app').innerHTML = topbar('<button class="btn ghost sm" id="switch-view">Кабинет ученицы</button>') + '<main class="wrap wide"><p class="muted">Загружаем данные…</p></main>';
  bindTop();
  try { await loadAdmin(); } catch (x) { $('main').innerHTML = `<div class="alert">${esc(x.message)}</div>`; return; }
  drawAdmin();
}
function drawAdmin() {
  const A = S.admin, students = A.students.filter(s => !isStaff({ role: s['Роль'] }));
  const opened = new Set(A.events.filter(e => e['Событие'] === 'open').map(e => String(e['Email']).toLowerCase()));
  const n = students.length || 1;
  const f = {
    list: students.length,
    login: students.filter(s => s['Первый вход']).length,
    quiz: students.filter(s => s['Статус'] && s['Статус'] !== ST.none).length,
    ok: students.filter(s => s['Статус'] === ST.ok).length,
    open: students.filter(s => opened.has(String(s['Email']).toLowerCase())).length
  };
  const conf = students.filter(s => s['Статус'] === ST.ok && s['Протокол авто'] && PROTO_CODE[s['Протокол итог']]);
  const match = conf.filter(s => s['Протокол авто'] === s['Протокол итог']).length;
  const flagged = s => s['Красные флаги'] && s['Красные флаги'] !== 'Нет';
  const filters = [['all', 'Все', students.length], ['wait', 'Ждут подтверждения', students.filter(s => s['Статус'] === ST.wait).length], ['ok', 'Подтверждены', f.ok], ['none', 'Нет анкеты', students.filter(s => !s['Статус'] || s['Статус'] === ST.none).length], ['flag', 'Красные флаги', students.filter(flagged).length]];
  const q = S.search.toLowerCase();
  const shown = students.filter(s => {
    const st = s['Статус'] || ST.none;
    if (S.filter === 'wait' && st !== ST.wait) return false;
    if (S.filter === 'ok' && st !== ST.ok) return false;
    if (S.filter === 'none' && st !== ST.none) return false;
    if (S.filter === 'flag' && !flagged(s)) return false;
    return !q || (s['Email'] + ' ' + s['Имя']).toLowerCase().includes(q);
  }).sort((a, b) => (a['Статус'] === ST.wait ? 0 : 1) - (b['Статус'] === ST.wait ? 0 : 1) || String(b['Дата анкеты']).localeCompare(String(a['Дата анкеты'])));
  const kpi = (num, label) => `<div class="kpi"><div class="n">${num}</div><div class="l">${label}</div><div class="bar"><i style="width:${Math.round(num / n * 100)}%"></i></div></div>`;
  $('main').innerHTML = `<div class="stack">
    <div class="row" style="justify-content:space-between"><div><span class="eyebrow">Кураторская</span><h1>Ученицы потока</h1></div>
      <div class="row"><button class="btn ghost sm" id="add-toggle">Добавить учениц</button><button class="btn ghost sm" id="refresh">Обновить</button></div></div>
    ${MODE === 'demo' ? '<div class="demo">Демо-режим: ученицы с фамилией «Пример» вымышленные, их анкеты сгенерированы для проверки админки.</div>' : ''}
    <div class="kpis">${kpi(f.list, 'В списке')}${kpi(f.login, 'Входили в кабинет')}${kpi(f.quiz, 'Прошли анкету')}${kpi(f.ok, 'Протокол подтверждён')}${kpi(f.open, 'Открывали материалы')}</div>
    <p class="small muted">Автопротокол совпал с решением куратора: <b>${match} из ${conf.length}</b>${conf.length ? ' (' + Math.round(match / conf.length * 100) + '%)' : ''}. На анкетах потока 3.0 совпадение было 58%, поэтому подтверждение обязательно.</p>
    <div class="card stack" id="add-box" hidden>
      <label class="f" for="add-ta">По одной ученице в строке: email; имя; роль (ученик, куратор или админ, по умолчанию ученик)</label>
      <textarea class="inp" id="add-ta" placeholder="maria@mail.ru; Мария Иванова"></textarea>
      <div class="row"><button class="btn sm" id="add-go">Добавить</button><span class="small muted" id="add-msg"></span></div></div>
    <div class="row">${filters.map(([k, l, c]) => `<button class="chipbtn ${S.filter === k ? 'on' : ''}" data-f="${k}">${l} · ${c}</button>`).join('')}</div>
    <div class="admin">
      <div class="stack" style="gap:8px"><input class="inp" id="search" placeholder="Поиск по имени или email" value="${esc(S.search)}">
        <div class="plist">${shown.map(s => `<div class="pi ${S.sel === s['Email'] ? 'on' : ''}" data-e="${esc(s['Email'])}">
          <div class="nm"><span>${esc(s['Имя'] || s['Email'])}</span>${flagged(s) ? '<span class="pill flag">флаг</span>' : ''}</div>
          <div class="em">${esc(s['Email'])}</div>
          <div class="row" style="gap:8px">${statusPill(s['Статус'])}${protoTag(s['Протокол итог'] || s['Протокол авто'])}</div></div>`).join('') || '<p class="muted" style="padding:14px">Никого не нашли</p>'}</div></div>
      <div id="detail">${detailHTML()}</div>
    </div></div>`;
  document.querySelectorAll('[data-f]').forEach(b => b.onclick = () => { S.filter = b.dataset.f; drawAdmin(); });
  document.querySelectorAll('.pi').forEach(p => p.onclick = () => { S.sel = p.dataset.e; drawAdmin(); if (innerWidth < 860) $('#detail').scrollIntoView({ behavior: 'smooth' }); });
  const se = $('#search'); se.oninput = () => { S.search = se.value; const pos = se.selectionStart; drawAdmin(); const n2 = $('#search'); n2.focus(); n2.setSelectionRange(pos, pos); };
  $('#refresh').onclick = renderAdmin;
  $('#add-toggle').onclick = () => { $('#add-box').hidden = !$('#add-box').hidden; };
  $('#add-go').onclick = async () => {
    const rows = $('#add-ta').value.split('\n').map(l => l.split(/[;\t,]/).map(x => x.trim())).filter(r => r[0] && r[0].includes('@')).map(r => ({ email: r[0], name: r[1] || '', role: r[2] || 'ученик' }));
    if (!rows.length) { $('#add-msg').textContent = 'Не нашли ни одного email'; return; }
    try { const r = await api('addStudents', { token: S.token, rows }); toast('Добавлено: ' + r.added); await loadAdmin(); drawAdmin(); } catch (x) { $('#add-msg').textContent = x.message; }
  };
  bindDetail();
}
function detailHTML() {
  const s = S.admin.students.find(x => x['Email'] === S.sel);
  if (!s) return '<div class="card"><p class="muted">Выберите ученицу слева, чтобы посмотреть анкету и подтвердить протокол.</p></div>';
  const qz = S.admin.quizzes[s['Email']], auto = qz?.auto, st = s['Статус'] || ST.none;
  const ev = S.admin.events.filter(e => String(e['Email']).toLowerCase() === s['Email'].toLowerCase()).slice(-12).reverse();
  const evName = { login: 'Вход', password_set: 'Задала пароль', password_reset: 'Пароль сброшен куратором', quiz_submit: 'Отправила анкету', confirmed: 'Протокол подтверждён', quiz_reset: 'Анкета сброшена', open: 'Открыла' };
  const p = qz?.personal || {};
  const cur = s['Протокол итог'] || auto?.name || '';
  return `<div class="card stack">
    <div class="row" style="justify-content:space-between;align-items:flex-start"><div><h2>${esc(s['Имя'] || s['Email'])}</h2><p class="small muted">${esc(s['Email'])}</p></div>${statusPill(st)}</div>
    <div class="row small"><span>Пароль: <b>${s['Пароль задан'] === 'да' ? 'задан' : 'ещё не задан'}</b></span>
      ${s['Пароль задан'] === 'да' ? '<button class="link" id="d-pw">Сбросить пароль</button>' : ''}</div>
    <div class="info small" id="d-pw-confirm" hidden>Ученица выйдет на всех устройствах и при следующем входе придумает новый пароль.
      <div class="row" style="margin-top:8px"><button class="btn sm" id="d-pw-yes">Сбросить пароль</button><button class="btn ghost sm" id="d-pw-no">Отмена</button></div></div>
    <p class="small muted">Первый вход: ${fmtDate(s['Первый вход'])} · Анкета: ${fmtDate(s['Дата анкеты'])}${s['Дата подтверждения'] ? ' · Подтверждено: ' + fmtDate(s['Дата подтверждения']) + (s['Куратор'] ? ' (' + esc(s['Куратор']) + ')' : '') : ''}</p>
    ${qz?.redFlags?.length ? `<div class="alert">Красные флаги: ${qz.redFlags.map(esc).join('; ')}</div>` : ''}
    ${qz ? `<div class="info stack" style="gap:10px">
        <div class="row" style="justify-content:space-between"><h3>Автопротокол: ${protoTag(auto?.name)}</h3><span class="small muted">сила признаков относительно ведущего</span></div>
        <div class="bars">${[['V', 'Вялое'], ['I', 'Воспалённое'], ['C', 'Чувствительное']].map(([k, l]) => `<div class="brow"><span>${l}</span><span class="tr"><i style="width:${auto?.pct?.[k] || 0}%;background:var(--p${k})"></i></span><b>${auto?.pct?.[k] ?? 0}</b></div>`).join('')}</div>
        <p class="small muted">Смешанный тип ставится, когда второй протокол набирает не меньше 62% от ведущего.</p></div>
      <div class="stack" style="gap:10px">
        <div class="grid2"><div><label class="f" for="d-proto">Протокол</label><select class="inp" id="d-proto">${PROTO_OPTIONS.map(o => `<option ${o === cur ? 'selected' : ''}>${o}</option>`).join('')}</select></div></div>
        <div><label class="f" for="d-com">Комментарий для ученицы (она увидит его в кабинете)</label><textarea class="inp" id="d-com">${esc(s['Комментарий куратора'] || '')}</textarea></div>
        <div class="row"><button class="btn plum" id="d-ok">${st === ST.ok ? 'Сохранить изменения' : 'Подтвердить протокол'}</button>
          <button class="btn danger sm" id="d-reset">Сбросить анкету</button></div>
        <div class="alert" id="d-confirm" hidden>Анкета и протокол удалятся, ученица заполнит анкету заново. <div class="row" style="margin-top:8px"><button class="btn sm danger" id="d-reset-yes">Да, сбросить</button><button class="btn ghost sm" id="d-reset-no">Отмена</button></div></div></div>
      <div class="sum-sec"><h3>Данные</h3><p class="small">${esc([p.sex, p.age && p.age + ' лет', p.height && p.height + ' см', p.weight && p.weight + ' кг', p.bmi && 'ИМТ ' + p.bmi, p.waist && 'талия ' + p.waist].filter(Boolean).join(' · '))}</p>
        ${qz.diagnoses?.length ? `<p class="small" style="margin-top:6px"><b>Диагнозы:</b> ${qz.diagnoses.map(esc).join(', ')}${qz.chol ? ' (холестерин ' + esc(qz.chol) + ')' : ''}</p>` : ''}</div>
      <div class="blocks">${Q.blocks.map(b => { const qs = b.q.filter(q => qz.answers?.[q[0]]); return qs.length ? `<div class="blk"><h3>${esc(b.title)}</h3>${qs.map(q => `<div><span>${esc(q[2])}</span><span>${esc(Q.scales[q[4]][qz.answers[q[0]] - 1])}</span></div>`).join('')}${b.id === 'b7' && qz.products ? `<div><span>Триггеры</span><span>${esc(qz.products)}</span></div>` : ''}</div>` : ''; }).join('')}</div>
      ${qz.meds ? `<div class="sum-sec"><h3>Лекарства</h3><p class="small">${esc(qz.meds)}</p></div>` : ''}
      ${qz.goals ? `<div class="sum-sec"><h3>Цели</h3><p class="small">${esc(qz.goals)}</p></div>` : ''}`
    : '<div class="locked">Анкета ещё не заполнена.</div>'}
    <div class="sum-sec"><h3>Активность</h3>${ev.length ? ev.map(e => `<div class="ev"><span class="muted">${fmtDate(e['Дата'])}</span><span>${esc(evName[e['Событие']] || e['Событие'])}${e['Объект'] ? ': ' + esc(e['Объект']) : ''}</span></div>`).join('') : '<p class="small muted">Пока ничего</p>'}</div>
  </div>`;
}
function bindDetail() {
  if ($('#d-pw')) {
    $('#d-pw').onclick = () => { $('#d-pw-confirm').hidden = false; };
    $('#d-pw-no').onclick = () => { $('#d-pw-confirm').hidden = true; };
    $('#d-pw-yes').onclick = async () => {
      try { await api('resetPassword', { token: S.token, email: S.sel }); toast('Пароль сброшен'); await loadAdmin(); drawAdmin(); } catch (x) { toast(x.message); }
    };
  }
  const ok = $('#d-ok'); if (!ok) return;
  ok.onclick = async () => {
    ok.disabled = true;
    try { await api('confirm', { token: S.token, email: S.sel, protocol: $('#d-proto').value, comment: $('#d-com').value });
      toast('Протокол подтверждён'); await loadAdmin(); drawAdmin();
    } catch (x) { toast(x.message); ok.disabled = false; }
  };
  $('#d-reset').onclick = () => { $('#d-confirm').hidden = false; };
  $('#d-reset-no').onclick = () => { $('#d-confirm').hidden = true; };
  $('#d-reset-yes').onclick = async () => {
    try { await api('resetQuiz', { token: S.token, email: S.sel }); toast('Анкета сброшена'); await loadAdmin(); drawAdmin(); } catch (x) { toast(x.message); }
  };
}

boot();
</script>

</body>
</html>
