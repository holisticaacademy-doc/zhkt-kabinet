<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#173f35">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ЖКТ Holistica">
<title>Формула здоровья ЖКТ — личный кабинет</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="css-u">
:root{
  --e-dk:#14372E;--e:#1E4D3E;--lime:#7AC143;--mint:#A8E4C0;--mint-pale:#EAF5EE;
  --mint-bd:#8DC63F;--mag:#A0197E;--lav:#F0D6E8;--ink:#1B3A2F;--grey:#6B8A7C;
  --bg:#FFFFFF;--surface:#FFFFFF;--soft:#F6FAF7;--line:#D6E8DC;--on-dark:#FFFFFF;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ink:#E3F0E8;--grey:#9DB8AA;--bg:#0E211B;--surface:#132B23;--soft:#17342A;
    --mint-pale:#1B3A30;--line:#2A4B3F;--lav:#3A2536;--mint:#2F6A50;
  }
}
:root[data-theme="dark"]{
  --ink:#E3F0E8;--grey:#9DB8AA;--bg:#0E211B;--surface:#132B23;--soft:#17342A;
  --mint-pale:#1B3A30;--line:#2A4B3F;--lav:#3A2536;--mint:#2F6A50;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:Montserrat,"Segoe UI",system-ui,-apple-system,sans-serif;font-size:15.5px;line-height:1.55;
  -webkit-text-size-adjust:100%}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--mag);outline-offset:2px;border-radius:8px}
.wrap{max-width:820px;margin:0 auto;padding:0 16px 96px}

/* верхняя строка */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);
  border-bottom:1px solid var(--line)}
.bar .in{max-width:820px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;min-height:54px}
.brand{font-weight:800;font-size:14px;letter-spacing:.04em;color:var(--ink)}
.brand i{font-style:normal;color:var(--mint-bd);font-size:11px;margin-left:2px}
.bar .prog{margin-left:auto;font-size:12px;color:var(--grey);font-weight:600;text-align:right}
.back{border:none;background:var(--mint-pale);width:36px;height:36px;border-radius:50%;
  display:grid;place-items:center;flex:0 0 auto}
.back svg{width:18px;height:18px}

/* типографика */
h1{font-size:24px;line-height:1.3;margin:0 0 10px;font-weight:800}
h2{font-size:19px;line-height:1.5;margin:30px 0 12px;font-weight:700}
h2 span{background:var(--mint);padding:2px 8px;border-radius:3px;
  box-decoration-break:clone;-webkit-box-decoration-break:clone}
h2.neg span{background:var(--mag);color:#fff}
h3{font-size:16px;margin:18px 0 8px;font-weight:700}
p{margin:0 0 12px}
.muted{color:var(--grey)}
.small{font-size:13px}

/* кнопки */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;
  background:var(--e-dk);color:#fff;font-weight:700;font-size:15px;padding:14px 22px;border-radius:999px;
  min-height:48px;text-decoration:none}
.btn:hover{background:var(--e)}
.btn.full{width:100%}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--mint-bd)}
.btn.ghost:hover{background:var(--mint-pale)}
.btn.mag{background:var(--mag)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.btn{flex:1 1 160px}

/* брендовая «шапка» */
.top{background:linear-gradient(135deg,#14372E,#1E4D3E);border-radius:18px;padding:26px 24px;color:#fff;margin:20px 0 24px}
.top .sub{color:#A8E4C0;font-weight:700;font-size:12px;letter-spacing:.06em;margin-bottom:14px}
.top h1{color:#fff}
.top p{color:#DDEFE4}
.tag{display:inline-block;background:var(--lime);color:#fff;font-weight:800;padding:3px 12px;border-radius:5px}

.card{background:var(--mint-pale);border:2px solid var(--mint-bd);border-radius:14px;padding:16px 18px;margin:0 0 14px}
.card>*:last-child{margin-bottom:0}
.card.alt{border-color:var(--mag);background:var(--surface)}
.out{background:var(--lav);border-radius:14px;padding:16px 20px;margin:0 0 14px;text-align:center;font-weight:700}
.mark{background:var(--mag);color:#fff;font-weight:700;padding:1px 7px;border-radius:3px}

/* анкета */
.steps{display:flex;gap:4px;margin:20px 0 6px}
.steps i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.steps i.on{background:var(--mint-bd)}
.q{margin:22px 0}
.q .qt{font-weight:700;margin-bottom:10px}
.opts{display:grid;gap:8px}
.opt{display:flex;align-items:flex-start;gap:12px;text-align:left;width:100%;border:2px solid var(--line);
  background:var(--surface);border-radius:12px;padding:12px 14px;font-size:15px;line-height:1.4}
.opt:hover{border-color:var(--mint-bd)}
.opt .box{flex:0 0 22px;height:22px;border-radius:6px;border:2px solid var(--mint-bd);display:grid;place-items:center;margin-top:-1px}
.opt.radio .box{border-radius:50%}
.opt.on{border-color:var(--mint-bd);background:var(--mint-pale);font-weight:600}
.opt.on .box{background:var(--mint-bd)}
.opt.on .box:after{content:"";width:8px;height:8px;border-radius:2px;background:#fff}
.opt.radio.on .box:after{border-radius:50%}
.sl{background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.sl .h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-weight:600}
.sl .v{font-weight:800;font-size:18px;color:var(--mag);font-variant-numeric:tabular-nums;min-width:2ch;text-align:right}
.sl input{width:100%;accent-color:var(--mag);margin:10px 0 2px;height:28px}
.sl .ends{display:flex;justify-content:space-between;font-size:12px;color:var(--grey)}

/* поля анкеты */
.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px;margin:0 0 12px}
.fields.one{grid-template-columns:1fr;margin-top:6px}
.fld label{display:block;font-weight:600;font-size:14px;margin-bottom:6px}
.fld.wide{grid-column:1/-1}
.inp{width:100%;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:12px 14px;font:inherit;font-size:15px}
.inp:focus{border-color:var(--mint-bd);outline:none;box-shadow:0 0 0 3px var(--mint-pale)}
.inp.err{border-color:var(--mag)}
textarea.inp{min-height:120px;resize:vertical}
.errt{color:var(--mag);font-size:12.5px;font-weight:600;margin-top:5px}
.codebox{background:var(--lav);border-radius:14px;padding:16px 18px;margin:6px 0 16px}
.codebox .fields{margin-bottom:4px}
.linkbtn{border:none;background:none;padding:6px 0;color:var(--mag);font-weight:700;font-size:14px;text-decoration:underline;text-underline-offset:3px}
.lnk{color:var(--mag);font-weight:700}
.gate{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-width:420px}
.dg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.qi{background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.qi.on{border-color:var(--mint-bd);background:var(--mint-pale)}
.qi .qt{font-weight:600;margin-bottom:10px;font-size:15px;line-height:1.4}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{border:2px solid var(--mint-bd);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600;line-height:1.25}
.pill:hover{background:var(--mint-pale)}
.pill.on{background:var(--e-dk);border-color:var(--e-dk);color:#fff}
.hint-strong{display:flex;gap:12px;align-items:flex-start;background:var(--lav);border-left:5px solid var(--mag);border-radius:12px;padding:14px 16px;margin:18px 0 14px;font-size:17px;font-weight:700;line-height:1.4;color:var(--ink)}
.hint-strong .hint-ic{flex:0 0 28px;height:28px;border-radius:50%;background:var(--mag);color:#fff;font-weight:800;font-size:17px;display:grid;place-items:center}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;padding:0;margin:-1px}
.vh:focus-visible+label{outline:3px solid var(--mag);outline-offset:2px}
label.btn{cursor:pointer}
.tongue-prev{display:block;max-width:240px;width:100%;border-radius:12px;border:2px solid var(--mint-bd);margin:6px 0 12px}
.upcard{background:var(--lav);border:2px solid var(--mag);border-radius:14px;padding:16px 18px;margin:0 0 14px}
.testnote{border:2px dashed var(--mag);color:var(--mag);border-radius:12px;padding:10px 14px;font-size:13px;font-weight:700;margin:0 0 14px}
.sum{background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 10px}
.sum-h{font-weight:800;font-size:13px;color:var(--mag);margin-bottom:6px}
.sum-r{display:flex;justify-content:space-between;gap:14px;padding:5px 0;border-top:1px solid var(--line);font-size:14px}
.sum-r:first-of-type{border-top:none}
.sum-r span{color:var(--grey);flex:1 1 55%}
.sum-r b{flex:1 1 45%;text-align:right;font-weight:600}
@media (max-width:560px){.fields,.dg{grid-template-columns:1fr}.sum-r{flex-direction:column;gap:2px}.sum-r b{text-align:left}}

/* дашборд */
.next{display:flex;gap:14px;align-items:center;background:var(--surface);border:2px solid var(--mag);border-radius:14px;
  padding:14px 16px;margin:0 0 22px;width:100%;text-align:left}
.next .ic{flex:0 0 46px;height:46px;border-radius:50%;background:var(--mag);display:grid;place-items:center}
.next .ic svg{width:20px;height:20px;color:#fff}
.next small{display:block;color:var(--mag);font-weight:700;font-size:12px}
.next b{display:block;font-size:15.5px;line-height:1.35}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:640px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:10px;text-align:left;
  background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:16px;min-height:150px}
.tile:hover{border-color:var(--mint-bd);background:var(--soft)}
.tile .ic{width:44px;height:44px;border-radius:12px;background:var(--mint-pale);display:grid;place-items:center;color:var(--e)}
.tile .ic svg{width:24px;height:24px}
.tile b{font-size:16px}
.tile .cnt{font-size:13px;color:var(--grey);margin-top:-6px}
.tile .pb{margin-top:auto;width:100%}
.tile.prg{background:var(--lav);border-color:var(--lav);grid-column:1/-1;flex-direction:row;align-items:center;min-height:0}
.tile.prg .cnt{margin:0 0 0 auto}
.tile.prg .ic{background:var(--mag);color:#fff}
.pb{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.pb i{display:block;height:100%;background:var(--mint-bd);border-radius:3px}
.top .pb{background:rgba(255,255,255,.2);height:8px;margin-top:6px}
.top .pb i{background:var(--lime)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;padding:4px 10px;border-radius:999px;
  background:var(--mint-pale);color:var(--ink);border:1px solid var(--mint-bd)}
.chip.m{background:var(--lav);border-color:var(--lav)}

/* списки */
.list{display:grid;gap:8px;margin:0 0 14px}
.li{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--surface);
  border:2px solid var(--line);border-radius:12px;padding:12px 14px}
.li:hover{border-color:var(--mint-bd)}
.li .st{flex:0 0 26px;height:26px;border-radius:50%;border:2px solid var(--mint-bd);display:grid;place-items:center;color:#fff}
.li.done .st{background:var(--mint-bd)}
.li .st svg{width:14px;height:14px}
.li .tx{flex:1;min-width:0}
.li .tx b{display:block;font-size:15px;line-height:1.35}
.li .tx span{font-size:12.5px;color:var(--grey)}
.li .ch{color:var(--grey);flex:0 0 auto}
.li.done .tx b{color:var(--grey)}
.wk{font-weight:700;font-size:13px;color:var(--mag);margin:18px 2px 8px}

/* карточка материала */
.video{position:relative;aspect-ratio:16/9;border-radius:14px;overflow:hidden;
  background:linear-gradient(135deg,#14372E,#1E4D3E);display:grid;place-items:center;color:#fff;margin:14px 0 16px}
.video .pl{width:64px;height:64px;border-radius:50%;background:var(--lime);display:grid;place-items:center}
.video .pl svg{width:26px;height:26px;margin-left:4px}
.video small{position:absolute;left:14px;bottom:12px;right:14px;font-size:12px;color:#A8E4C0}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
ul.ing{list-style:none;padding:0;margin:0 0 14px}
ul.ing li{display:flex;justify-content:space-between;gap:12px;padding:8px 12px;border-radius:9px}
ul.ing li:nth-child(odd){background:var(--mint-pale)}
ul.ing li span:last-child{color:var(--grey);white-space:nowrap}
ol.stp{padding-left:0;list-style:none;counter-reset:s;margin:0 0 16px}
ol.stp li{counter-increment:s;position:relative;padding:0 0 12px 40px}
ol.stp li:before{content:counter(s);position:absolute;left:0;top:-1px;width:28px;height:28px;border-radius:50%;
  background:var(--mint);font-weight:800;font-size:13px;display:grid;place-items:center;color:var(--e-dk)}
ul.dot{padding-left:20px;margin:0 0 14px}
ul.dot li{margin:0 0 6px}
ul.dot li::marker{color:var(--mint-bd)}
.why{background:var(--lav);border-radius:12px;padding:12px 14px;font-size:14px;margin:0 0 16px}
.why b{color:var(--mag)}

/* меню */
.tabs{display:flex;gap:6px;margin:14px 0 14px;overflow-x:auto}
.tabs button{border:2px solid var(--mint-bd);background:var(--surface);border-radius:999px;padding:8px 16px;font-weight:700;font-size:14px;white-space:nowrap}
.tabs button.on{background:var(--e-dk);border-color:var(--e-dk);color:#fff}
.meal{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--surface);border:2px solid var(--line);
  border-radius:12px;padding:12px 14px;margin-bottom:8px}
.meal:hover{border-color:var(--mint-bd)}
.meal .t{flex:0 0 76px;font-size:12px;font-weight:700;color:var(--mag)}
.meal b{flex:1;font-size:15px}

/* прогресс */
.cmp{display:grid;gap:12px;margin:0 0 14px}
.cmp .r .h{display:flex;justify-content:space-between;font-weight:600;font-size:14px;margin-bottom:5px}
.cmp .r .h em{font-style:normal;font-weight:800}
.cmp .r .h em.good{color:#3F8A2E}
.cmp .r .h em.bad{color:var(--mag)}
.bars{display:grid;gap:3px}
.bars div{height:9px;border-radius:5px;background:var(--line);overflow:hidden}
.bars div i{display:block;height:100%}
.bars .a i{background:#C9B3C2}
.bars .b i{background:var(--mint-bd)}
.legend{display:flex;gap:16px;font-size:12.5px;color:var(--grey);margin:0 0 12px}
.legend span:before{content:"";display:inline-block;width:12px;height:8px;border-radius:4px;margin-right:6px;background:#C9B3C2}
.legend span.b:before{background:var(--mint-bd)}
.stat{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:0 0 14px}
.stat>div{background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:12px 14px}
.stat b{display:block;font-size:22px;font-weight:800}
.stat span{font-size:12.5px;color:var(--grey)}
.catrow{display:grid;grid-template-columns:120px 1fr 52px;align-items:center;gap:10px;font-size:14px;padding:6px 0}
.catrow span:last-child{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}

/* панель поддержки (демо) */
.adm-toggle{position:fixed;left:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:20;border:2px dashed var(--grey);
  background:var(--bg);color:var(--grey);font-size:12px;font-weight:700;padding:8px 12px;border-radius:999px}
.adm{position:fixed;inset:0;z-index:30;background:rgba(10,25,20,.55);display:none;align-items:flex-end;justify-content:center;padding:16px}
.adm.on{display:flex}
.adm .pan{background:var(--bg);border-radius:18px;max-width:520px;width:100%;padding:20px;border:2px dashed var(--grey);
  margin-bottom:env(safe-area-inset-bottom,0px);max-height:90%;overflow:auto}
.adm .pan h3{margin-top:0}
.adm dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px;margin:0 0 16px}
.adm dt{color:var(--grey)}
.adm dd{margin:0;font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(70px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:40;
  background:var(--e-dk);color:#fff;padding:10px 18px;border-radius:999px;font-weight:600;font-size:14px;opacity:0;
  transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
/* календарь и трекер */
.cal{display:flex;justify-content:space-between;gap:10px;font-size:13px;font-weight:700;margin-bottom:4px}
.cal span:last-child{color:#A8E4C0}
.today{display:block;width:100%;text-align:left;background:var(--mint-pale);border:2px solid var(--mint-bd);border-radius:14px;padding:14px 16px;margin:0 0 12px}
.today .h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:8px}
.today small{color:var(--e);font-weight:700;font-size:12px}
.today b{font-size:15.5px}
.today .n{font-weight:800;font-size:18px;font-variant-numeric:tabular-nums}
.li.lock{opacity:.55;cursor:default}
.li.lock .st{border-color:var(--grey);color:var(--grey)}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin:14px 0 16px}
.days button{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.days button b{font-size:13px}
.days button span{font-size:10.5px;color:var(--grey);white-space:nowrap}
.days button i{display:block;width:70%;height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.days button i em{display:block;height:100%;background:var(--mint-bd)}
.days button.on{border-color:var(--e-dk);background:var(--e-dk);color:#fff}
.days button.on span{color:#A8E4C0}
.days button.td{border-color:var(--mag)}
.days button.on.td{border-color:var(--mag)}
.days button[disabled]{opacity:.45;cursor:not-allowed}
.trk{display:grid;gap:6px;margin:0 0 12px}
.trk .opt.anc{background:var(--soft);font-weight:700}
.trk .opt.anc.on{background:var(--mint-pale)}
.trk .opt em{font-style:normal;font-weight:400;color:var(--grey);font-size:13px}
.trk .opt[disabled]{cursor:not-allowed;opacity:.6}
.gridwrap{overflow-x:auto;border:2px solid var(--line);border-radius:14px;margin:0 0 14px;-webkit-overflow-scrolling:touch}
table.wg{border-collapse:separate;border-spacing:0;font-size:12.5px;width:100%;min-width:520px}
table.wg th,table.wg td{padding:6px 4px;text-align:center}
table.wg th{background:var(--e-dk);color:#fff;font-weight:700;font-size:11.5px;white-space:nowrap}
table.wg th:first-child,table.wg td:first-child{text-align:left;position:sticky;left:0;background:var(--surface);padding-left:10px;min-width:170px;max-width:200px;line-height:1.3}
table.wg th:first-child{background:var(--e-dk)}
table.wg tr.anc td:first-child{font-weight:700}
table.wg tr:nth-child(even) td{background:var(--soft)}
table.wg td .c{display:inline-block;width:20px;height:20px;border-radius:6px;border:2px solid var(--line);vertical-align:middle}
table.wg td .c.y{background:var(--mint-bd);border-color:var(--mint-bd)}
table.wg td .c.f{border-style:dashed;opacity:.5}

 {id:"p1",t:"Дневник питания и симптомов",d:"ежедневно, 2 недели",core:1,
  body:["Записывайте каждый приём пищи, время и самочувствие через 1–2 часа.","Отмечайте изжогу, вздутие, тяжесть по шкале 0–10.","Через 2 недели найдите повторяющиеся связки «продукт → симптом»."],
  why:"Триггеры индивидуальны — без дневника их не найти."},
 {id:"p2",t:"Диафрагмальное дыхание",d:"5 минут в день",sym:["heartburn","fatigue"],types:["sens"],
  body:["Сядьте или лягте, ладонь на живот.","Глубокий вдох «в живот» — ладонь поднимается.","Выдох в два раза медленнее вдоха.","5 минут, лучше в одно и то же время."],
  why:"Ножки диафрагмы — часть антирефлюксного барьера; длинный выдох снижает тревогу."},
 {id:"p3",t:"Ходьба после еды",d:"10–20 минут",sym:["heaviness","heartburn"],types:["slow","mix"],
  body:["Спокойным шагом после обеда или ужина.","Без наклонов и нагрузки на пресс.","Интенсивные тренировки — не раньше чем через час после плотной еды."],
  why:"Ускоряет эвакуацию содержимого желудка."},
 {id:"p4",t:"Активация блуждающего нерва",d:"3–5 минут",types:["slow","sens","mix"],
  body:["Пение или громкое мычание 1–2 минуты.","Полоскание горла водой.","Умывание прохладной водой."],
  why:"Тонус блуждающего нерва запускает моторику желудка."},
 {id:"p5",t:"Мелатониновое окно",d:"каждый вечер",sym:["heartburn","fatigue"],core:0,
  body:["Ужин за 3–4 часа до сна.","Отбой так, чтобы спать в период 22:00–2:00.","При ночной изжоге — изголовье выше на 10–15 см, сон на левом боку."],
  why:"Мелатонин — лучший друг смыкания сфинктера."},
 {id:"p6",t:"Голодное окно между приёмами пищи",d:"3,5–5 часов",sym:["heaviness","bloating"],types:["slow","mix"],
  body:["3–5 полноценных приёмов пищи без постоянных перекусов.","Между ними — вода и травяной чай."],
  why:"Постоянные перекусы тормозят моторику желудка."},
 {id:"p7",t:"Тёплая вода небольшими порциями",d:"в течение дня",types:["sens"],sym:["stool"],
  body:["Вода 40–50 °С небольшими глотками между приёмами пищи.","При ночной изжоге не пить много перед сном."],
  why:"Мягко поддерживает моторику и успокаивает чувствительный кишечник."},
 {id:"p8",t:"Самомассаж живота",d:"5 минут утром",sym:["stool","bloating"],types:["sens"],
  body:["Тёплыми ладонями — круговые движения по часовой стрелке.","Без сильного давления, на выдохе.","Не делать сразу после еды."],
  why:"Помогает при вздутии и нерегулярном стуле."}

 {"id": "f1", "t": "Гранат-5", "types": ["slow"], "les": ["slow1_3", "slow3_8"], "why": "Тёплый, согревающий состав для медленного, «ленивого» пищеварения. Ждём, что ЖКТ и печень заработают слаженно, в теле появятся лёгкость и тепло, больше энергии, тёплые руки и ноги.", "who": ["медленное, слабое пищеварение", "сниженная кислотность желудка", "недостаток пищеварительных ферментов", "тяжесть и ощущение комка в желудке", "слабые боли в желудке после еды", "белый налёт на языке, запах изо рта", "пищевые аллергии и непереносимости", "отёки на фоне гипотиреоза"], "how": ["1 раз в день, за 10–15 минут до завтрака.", "Первые 3 дня — половинная доза: 1/4 чайной ложки порошка положить на язык и запить горячей кипячёной водой.", "Дальше — полная доза: 1/2 чайной ложки без горки.", "При чувствительной слизистой желудка принимайте вместе с едой: начали есть — и во время еды выпили дозу.", "Если вы принимаете лекарства, не сочетайте их с фитосоставами: между приёмами — не меньше 30 минут. Продолжительность приёма — 1–2 месяца, дальше — контроль врача или нутрициолога."], "contra": "Повышенная кислотность желудка, острые воспалительные процессы органов пищеварения, острая фаза простуды и гриппа. Дозировку снижаем в 2 раза при беременности, чувствительной слизистой желудка, ГЭРБ, удалённом желчном пузыре, подостром панкреатите, холецистите, язве желудка и двенадцатиперстной кишки, колите.", "use": "1 раз в день, за 10–15 минут до завтрака. Первые 3 дня — половинная доза: 1/4 чайной ложки порошка положить на язык и запить горячей кипячёной водой."},
 {"id": "f2", "t": "Горький сбор", "types": ["slow"], "les": ["slow1_3", "slow3_8"], "why": "Травы, которые защищают печень, помогают оттоку желчи и работают против паразитов. Стимулирует образование и отток желчи, помогает печени с детоксикацией, кишечнику — опорожняться при запорах, уменьшает тошноту.", "who": ["профилактика нарушений работы печени и желчного пузыря", "густая желчь, склонная к застою, желчный сладж", "дискинезия желчевыводящих путей по гипомоторному типу", "плохое усвоение жирорастворимых витаминов", "запоры", "мигрени с тошнотой", "повышенный общий холестерин", "жировой гепатоз"], "how": ["1 раз в день, после обеда или после ужина.", "Первые 3 дня — половинная доза: 1/4 чайной ложки порошка положить на язык и запить горячей кипячёной водой.", "Дальше — полная доза: 1/2 чайной ложки без горки.", "В первые дни может быть лёгкий дискомфорт или слабые тянущие боли в правом подреберье.", "Если вы принимаете лекарства, не сочетайте их с фитосоставами: между приёмами — не меньше 30 минут. Продолжительность приёма — 1–2 месяца, дальше — контроль врача или нутрициолога."], "contra": "Острые воспалительные процессы ЖКТ; реактивный панкреатит; желчнокаменная болезнь; дискинезия желчевыводящих путей по гипермоторному типу; высокая чувствительность к стрессу, дефицит веса, нарушения сна. При беременности не используем. На грудном вскармливании противопоказаний нет.", "use": "1 раз в день, после обеда или после ужина. Первые 3 дня — половинная доза: 1/4 чайной ложки порошка положить на язык и запить горячей кипячёной водой."},
 {"id": "f3", "t": "Отвар Трифалы", "types": ["infl"], "les": ["infl1_3", "infl3_8"], "why": "Один из самых известных фитосборов восточной медицины для здоровья ЖКТ. Отвар действует противовоспалительно, мягко снимает спазм и гонит желчь, подавляет патогенную микрофлору и поддерживает рост полезных лакто- и бифидобактерий.", "who": ["хронические воспалительные процессы в ЖКТ (гастрит, дуоденит, колит, холецистит)", "хроническое воспаление после удаления желчного пузыря", "дискинезия желчевыводящих путей", "боли, вздутие, тяжесть в животе"], "how": ["Нужна чистая Трифала в порошке (не Трифала гуггул). Таблетку или капсулу можно раздавить / раскрыть.", "1/2 чайной ложки без горки залейте 200 мл воды, доведите до кипения, варите 2 минуты, настаивайте 10 минут.", "Пейте тёплым в 11:00–13:00, между завтраком и обедом. Отвар каждый день свежий.", "При удалённом желчном пузыре — курсами по 3–4 недели несколько раз в год.", "Продолжительность приёма — 1–2 месяца, дальше — контроль врача или нутрициолога."], "contra": "Острые воспалительные процессы органов ЖКТ, индивидуальная непереносимость. При беременности — половинная доза, при грудном вскармливании ограничений нет.", "use": "Нужна чистая Трифала в порошке (не Трифала гуггул). Таблетку или капсулу можно раздавить / раскрыть. 1/2 чайной ложки без горки залейте 200 мл воды, доведите до кипения, варите 2 минуты, настаивайте 10 минут."},
 {"id": "f4", "t": "Отвар Иролтуева", "types": ["infl"], "les": ["infl1_3", "infl3_8"], "why": "Противовоспалительный, ранозаживляющий сбор: помогает слизистой ЖКТ восстановиться при эрозиях, облегчает боль, уменьшает воспаление, вздутие и газы.", "who": ["удалённый желчный пузырь", "хронический эрозивный гастрит, язвенная болезнь желудка и двенадцатиперстной кишки", "хронический дуоденит", "хронический реактивный панкреатит", "хронический колит, СИБР"], "how": ["1/2 чайной ложки порошка без горки залейте 200 мл воды, доведите до кипения, варите 2 минуты, настаивайте 10 минут.", "Пейте тёплым за 15–20 минут до завтрака. Во время обострения — по 150–200 мл 2–3 раза в день.", "Отвар каждый день свежий.", "Продолжительность приёма — 1–2 месяца, дальше — контроль врача или нутрициолога."], "contra": "Острые воспалительные процессы органов ЖКТ, индивидуальная непереносимость.", "use": "1/2 чайной ложки порошка без горки залейте 200 мл воды, доведите до кипения, варите 2 минуты, настаивайте 10 минут. Пейте тёплым за 15–20 минут до завтрака. Во время обострения — по 150–200 мл 2–3 раза в день."},
 {"id": "f9", "t": "Облепиховое масло", "types": ["infl"], "les": ["infl1_5", "infl3_8"], "why": "Защищает и восстанавливает слизистые ЖКТ.", "who": [], "how": ["Самая мягкая форма — вместе с горячей или тёплой едой или напитком (холодные жиры тормозят пищеварение).", "Начните с 1 чайной ложки масла в овсяном или льняном киселе на перекус.", "Через 3–4 дня добавьте ещё 1 чайную ложку — во вторую порцию киселя или к завтраку или ужину.", "Если симптомы продолжают беспокоить, можно 2 чайные ложки за приём (всего не больше 4 в день).", "Курс — 25–30 дней. В начале курса возможно послабление стула."], "contra": "Острые воспалительные процессы ЖКТ: острый панкреатит, холецистит, желчная колика. При камнях в желчном, гипермоторном желчном пузыре (диарея, колющие боли справа), тяжёлой ферментопатии — не больше 2 чайных ложек в день и строго вместе с едой.", "use": "Самая мягкая форма — вместе с горячей или тёплой едой или напитком (холодные жиры тормозят пищеварение). Начните с 1 чайной ложки масла в овсяном или льняном киселе на перекус."},
 {"id": "f10", "t": "Сок сырого картофеля", "types": ["infl"], "les": ["infl3_8"], "why": "Дополнительная мера при гиперацидном гастрите и эрозиях слизистой желудка и двенадцатиперстной кишки.", "who": ["гиперацидный гастрит", "эрозии слизистой желудка и двенадцатиперстной кишки"], "how": ["1 свежую картофелину (лучше розовых или жёлтых сортов) промойте, очистите и натрите на мелкой тёрке.", "Отожмите сок и выпейте 1 столовую ложку — или съешьте 1 столовую ложку с горкой кашицы вместе с соком.", "Работает только свежий сок: в течение 10–15 минут после приготовления.", "Вечером перед сном или между приёмами пищи. Курс — 2–3 недели.", "Нельзя позеленевший или проросший картофель — в нём токсичный соланин."], "contra": "Пониженная кислотность желудка.", "use": "1 свежую картофелину (лучше розовых или жёлтых сортов) промойте, очистите и натрите на мелкой тёрке. Отожмите сок и выпейте 1 столовую ложку — или съешьте 1 столовую ложку с горкой кашицы вместе с соком."},
 {"id": "f6", "t": "Рута-6 (Костус-6)", "types": ["sens"], "les": ["sens1_3", "sens3_8"], "why": "Один из лучших сборов при частом вздутии, газах, изжоге и рефлюксе, спастических болях в животе, частой отрыжке. Улучшает переваривание, снимает спазмы и помогает пище продвигаться.", "who": ["ГЭРБ, рефлюкс, изжога", "синдром раздражённого кишечника: вздутие, газы, боли, запоры или диарея", "дискинезия желчевыводящих путей"], "how": ["Принимаем только ОДИН состав — либо Рута-6, либо Жиру.", "1 раз в день, во время завтрака.", "Первые 3 дня — половинная доза: 1/4 чайной ложки порошка положить на язык и запить горячей кипячёной водой.", "Дальше — полная доза: 1/2 чайной ложки без горки.", "Оставьте половинную дозу при желчнокаменной болезни (без регулярных колик), низком весе, высокой чувствительности к лекарствам и травам, гиперчувствительной слизистой.", "Если вы принимаете лекарства, не сочетайте их с фитосоставами: между приёмами — не меньше 30 минут. Продолжительность приёма — 1–2 месяца, дальше — контроль врача или нутрициолога."], "contra": "Острые воспалительные процессы ЖКТ; частые обострения хронических воспалительных заболеваний ЖКТ; желчнокаменная болезнь с регулярными приступами колики. При удалённом или гиперкинетическом желчном пузыре самостоятельно не принимать — только под контролем врача или нутрициолога.", "use": "Принимаем только ОДИН состав — либо Рута-6, либо Жиру. 1 раз в день, во время завтрака."},
 {"id": "f7", "t": "Жиру", "types": ["sens"], "les": ["sens1_3", "sens3_8"], "why": "Выбирайте Жиру вместо Рута-6, если кроме плохого переваривания (вздутие, газы, изжога, рефлюкс) беспокоят запоры, дефициты питательных веществ, потеря веса и мышечной массы.", "who": ["вздутие, урчание, распирание в животе, газы", "синдром раздражённого кишечника", "частая отрыжка", "боли в желудке и кишечнике натощак", "хронические запоры", "плохое усвоение питательных веществ"], "how": ["Принимаем только ОДИН состав — либо Жиру, либо Рута-6.", "1 раз в день, во время завтрака.", "Первые 3 дня — половинная доза: 1/4 чайной ложки порошка положить на язык и запить горячей кипячёной водой.", "Дальше — полная доза: 1/2 чайной ложки без горки.", "Приготовить дома не получится — сбор покупают готовым.", "Если вы принимаете лекарства, не сочетайте их с фитосоставами: между приёмами — не меньше 30 минут. Продолжительность приёма — 1–2 месяца, дальше — контроль врача или нутрициолога."], "contra": "Индивидуальная непереносимость, острые воспалительные процессы ЖКТ. При беременности — половинная доза, на грудном вскармливании ограничений нет.", "use": "Принимаем только ОДИН состав — либо Жиру, либо Рута-6. 1 раз в день, во время завтрака."},
 {"id": "f5", "t": "Экстракт артишока", "types": ["sens"], "les": ["sens1_3", "sens3_8"], "why": "Мягко стимулирует печень и желчный пузырь, улучшает отток желчи, слегка снимает спазмы: меньше тяжести, вздутия и газов, лучше переваривается жирная пища. Работает мягко и медленно.", "who": ["тяжесть после еды, вздутие, газы", "плохое переваривание жирной пищи", "склонность к застою желчи"], "how": ["1–2 раза в день, после обеда или ужина, по дозировке производителя. Запить тёплым напитком.", "Первые 3 дня — половинная доза, потом можно полную.", "Оставьте половинную дозу при желчнокаменной болезни (без регулярных колик), низком весе, высокой чувствительности к лекарствам и травам.", "Курс — 25–30 дней, можно курсами несколько раз в год."], "contra": "Острые воспалительные процессы ЖКТ; реактивный панкреатит; желчнокаменная болезнь с регулярными приступами колики или мелкими камнями; дискинезия желчевыводящих путей по гипермоторному типу. При беременности — по согласованию с лечащим врачом.", "use": "1–2 раза в день, после обеда или ужина, по дозировке производителя. Запить тёплым напитком. Первые 3 дня — половинная доза, потом можно полную."},
 {"id": "f11", "t": "Облепиховое масло в капсулах", "types": ["sens"], "les": ["sens1_5", "sens3_8"], "why": "Заживляет слизистые, снимает воспаление, мягко гонит желчь и снимает спазмы. Капсулы защищают масло от окисления и не обволакивают слизистую желудка.", "who": [], "how": ["Первые 4–5 дней — половина дозы, после обеда или ужина с горячей едой. Запить тёплым напитком.", "Дальше — полная доза в 2 приёма: за обедом и ужином.", "Оставьте половинную дозу при желчнокаменной болезни (без регулярных колик), гиперкинетическом желчном пузыре, дефиците веса.", "Курс — 3–4 недели."], "contra": "Острые воспалительные процессы ЖКТ, частые обострения хронических заболеваний ЖКТ, желчнокаменная болезнь с регулярными коликами.", "use": "Первые 4–5 дней — половина дозы, после обеда или ужина с горячей едой. Запить тёплым напитком. Дальше — полная доза в 2 приёма: за обедом и ужином."},
 {"id": "f12", "t": "Магний", "types": ["sens"], "les": ["sens1_5", "sens3_8"], "why": "Расслабляет гладкие мышцы ЖКТ, успокаивает нервную систему, помогает нормализовать стул.", "who": [], "how": ["Одна форма на выбор: глицинат — вечером после ужина; малат — утром после завтрака; комбинированная форма — утром после завтрака; магний с кальцием (при склонности к низкому давлению) — вечером после ужина.", "Если вы не принимали магний раньше или чувствительны к добавкам — начните с половины дозы, через 4–5 дней можно полную.", "Курс — 30 дней.", "Перед началом приёма посоветуйтесь с лечащим врачом."], "contra": "Магний может понижать давление. Острые воспалительные процессы ЖКТ.", "use": "Одна форма на выбор: глицинат — вечером после ужина; малат — утром после завтрака; комбинированная форма — утром после завтрака; магний с кальцием (при склонности к низкому давлению) — вечером после ужина. Если вы не принимали магний раньше или чувствительны к добавкам — начните с половины дозы, через 4–5 дней можно полную."},
 {"id": "f13", "t": "Рута-6 (Костус-6)", "types": ["mix"], "les": ["mix1_4", "mix3_8"], "why": "Улучшает переваривание в желудке и кишечнике, стимулирует моторику и помогает пище продвигаться. Выручает при вздутии, газах, изжоге и рефлюксе, спастических болях, частой отрыжке.", "who": ["частое вздутие и газы", "изжога, рефлюкс", "спастические боли в животе", "частая отрыжка"], "how": ["1 раз в день, за 10–15 минут до завтрака.", "Первые 3 дня — 1/3 чайной ложки, затем 1/2 чайной ложки без горки. Запить тёплой кипячёной водой.", "Оставьте половинную дозу при желчнокаменной болезни (без регулярных колик), низком весе, высокой чувствительности к лекарствам и травам, гиперчувствительной слизистой.", "Если вы принимаете лекарства, не сочетайте их с фитосоставами: между приёмами — не меньше 30 минут. Продолжительность приёма — 1–2 месяца, дальше — контроль врача или нутрициолога."], "contra": "Острые воспалительные процессы органов ЖКТ, индивидуальная непереносимость.", "use": "1 раз в день, за 10–15 минут до завтрака. Первые 3 дня — 1/3 чайной ложки, затем 1/2 чайной ложки без горки. Запить тёплой кипячёной водой."},
 {"id": "f14", "t": "Отвар Иролтуева", "types": ["mix"], "les": ["mix1_4", "mix3_8"], "why": "Действует противовоспалительно, заживляет и восстанавливает слизистую, облегчает боль, уменьшает вздутие и газы. Нужен не всем — только при определённых диагнозах.", "who": ["удалённый желчный пузырь", "хронический эрозивный гастрит, язвенная болезнь желудка или двенадцатиперстной кишки", "хронический дуоденит", "хронический реактивный панкреатит", "хронический колит, СИБР"], "how": ["1/2 чайной ложки порошка без горки залейте 200 мл воды, доведите до кипения, варите 2 минуты, настаивайте 10 минут.", "Пейте тёплым за 10–15 минут перед любым удобным приёмом пищи, кроме завтрака (обед, перекус или ужин), — 200 мл.", "Во время обострения — по 150–200 мл 2–3 раза в день. Отвар каждый день свежий.", "Продолжительность приёма — 1–2 месяца, дальше — контроль врача или нутрициолога."], "contra": "Острые воспалительные процессы органов ЖКТ, индивидуальная непереносимость.", "use": "1/2 чайной ложки порошка без горки залейте 200 мл воды, доведите до кипения, варите 2 минуты, настаивайте 10 минут. Пейте тёплым за 10–15 минут перед любым удобным приёмом пищи, кроме завтрака (обед, перекус или ужин), — 200 мл."}

  Q.blocks.forEach(function (b) { b.q.forEach(function (q) {
    var v = answers[q[0]], pr = q[3]; if (!v || !pr) return;
    var w = v / SCALE_MAX[q[4]];
    for (var i = 0; i < pr.length; i++) raw[pr[i]] += w / pr.length;
  }); });
  var s = {};
  ['V', 'I', 'C'].forEach(function (k) { s[k] = raw[k] / ceil[k] * PROTO_WEIGHTS[k]; });
  var order = ['V', 'I', 'C'].sort(function (a, b) { return s[b] - s[a]; });
  var top = order[0], second = order[1], code;
  if (s[top] === 0) code = 'M';
  else code = (s[second] / s[top] >= MIX_RATIO) ? 'M' : top;
  var maxS = s[top] || 1, pct = {};
  ['V', 'I', 'C'].forEach(function (k) { pct[k] = Math.round(s[k] / maxS * 100); });
  return { code: code, name: PROTO_NAMES[code], pct: pct, redFlags: redFlags || [] };
}

- курсом 5–10 процедур, 1–2 раза в неделю
- вечером через 2–3 часа после еды или утром натощак
- 20–30 минут; перед процедурой выпейте 1–2 стакана тёплой воды
## Прогревание рефлекторных точек
Здесь мы греем не сам орган, а нерв, который им управляет. Так можно работать с органами, которые напрямую греть нельзя, и при полипах и кистах. Противопоказания те же, плюс 2–3 триместр беременности; в первом — только после согласования с врачом.`,
slow4_6: `## Физиологические причины
- **Заглатывание воздуха** — от еды на бегу, жвачки, разговоров за едой, курения. Помогает спокойная, неторопливая еда.
- **Медленный желудок и «ленивый» кишечник** — еда и газы задерживаются, отсюда тяжесть, распирание, запоры. Помогают инструменты программы: специи-прокинетики, баланс белков, жиров и клетчатки, ГКВ, правильные сочетания, напитки со специями.
- **Непроходимость кишечника** — сильная боль, рвота, задержка стула и газов. Это повод срочно обратиться за медицинской помощью.
## Не хватает ферментов поджелудочной
Признаки: вздутие через 30–60 минут после еды, газы, жирный светлый липкий стул, тошнота, дефициты. Помогают правила питания вашего типа, кулинарная обработка, сочетания, ГКВ, специи и поддержка оттока желчи.
**Отвар чёрного кардамона** заметно усиливает выработку ферментов и уменьшает вздутие: 1/3 ч. л. измельчённого кардамона на 200 мл горячей воды, настоять 10 минут, пить тёплым перед завтраком и/или ужином. Нельзя при воспалении поджелудочной, рецидивирующем панкреатите и воспалительных заболеваниях кишечника.
## Фруктоза и сорбит
Здоровый ЖКТ усваивает до 25 г фруктозы за раз (около 2 крупных яблок), при непереносимости — всего 5–10 г. Сорбит (E420) есть во фруктах, жвачках и «диетических» сладостях.
- лучше всего переносятся ягоды, цитрусовые, абрикосы
- яблоки, груши, черешню, сливы, арбуз и соки — умеренно; сухофруктов — не больше 30–40 г за раз
- фрукты лучше с тёплым напитком или запечёнными, со специями (имбирь, тмин, куркума)
## Глютен
Целиакия (1–2 % людей) — аутоиммунная реакция на глютен; нецелиакийная чувствительность (около 13 %) — анализы в норме, а вздутие, тяжесть и «туман в голове» после глютена есть. Как проверить: на 2–3 недели строго убрать глютен. Если стало лучше — вернуть его и сдать анализы (до анализов глютен не исключаем, иначе результат будет ложным). Дальше решение принимается вместе с врачом.
Глютен есть в пшенице, ржи, ячмене, полбе; безглютеновые — рис, гречка, киноа, кукуруза, пшено, амарант. Скрытый глютен бывает в соусах, колбасах, полуфабрикатах и сладостях.
## Лактоза
Признаки — вздутие, урчание, спазмы, жидкий стул через 30 минут — 2 часа после молочного. При частичной непереносимости выбирайте кисломолочное и твёрдые сыры (лактозы почти нет), безлактозные продукты, следите за количеством, молоко пейте горячим, с куркумой.
## FODMAP
Это группа углеводов, которые плохо всасываются у чувствительных людей и бродят в толстой кишке: фруктоза, лактоза, сахарные спирты, олигосахариды (лук, чеснок, бобовые, пшеница, капустные).
Как выявить: 1–2 недели дневника → 2–4 недели строгого исключения → по одной группе возвращаем маленькими, средними и большими порциями → оставляем в рационе то, что переносится. В любом случае помогают умеренные порции, лёгкие сочетания, горячая еда и специи.`,

slow4_7: `**Синдром раздражённого кишечника (СРК)** — функциональное расстройство: кишечник работает со сбоями, но язв, эрозий и опухолей нет. В основе — повышенная чувствительность нервных окончаний кишечника: обычное движение и растяжение ощущаются как боль.
## Как проявляется
- вздутие, особенно во второй половине дня и на сырые овощи, зелень, фрукты
- боль по ходу толстой кишки, которая проходит после стула; ночью болей нет
- запоры, диарея или их чередование, слизь в стуле, ощущение неполного опорожнения
## Что усиливает
Стресс и тревога, дисбиоз, непереносимость FODMAP, гормональные колебания (у женщин часто перед менструацией).
## Обследование
Важно исключить другие причины — это делает врач: УЗИ, кал на скрытую кровь и кальпротектин, анализы крови на воспаление и анемию, при диарее — на целиакию и СИБР.
**Срочно к врачу**, если есть ночные боли, потеря веса, кровь в стуле или новые симптомы после 50 лет.
## Образ жизни
- дневник еды и самочувствия 1–2 недели
- свободная одежда, которая не пережимает живот
- сон вовремя и достаточно, работа со стрессом: дыхание, медитация, ходьба, йога, пилатес — хотя бы 30 минут в день
- успокаивающие травы в течение дня: ромашка, мелисса, мята, тимьян
- тепло: грелка на живот (вялый и чувствительный тип), ванночки для ног
## Питание
- 4–5 спокойных приёмов пищи без переедания и без голода, всё тёплое и приготовленное
- основа — супы и бульоны, белок — по вашему протоколу
- овощи сначала 90 % приготовленных и 10 % сырых, постепенно до 70/30; сырые — вместе с супом
- на время убрать грубую клетчатку: сырые листовые овощи и капусту, проростки, кожуру яблок и груш
- фрукты с высоким содержанием фруктозы — запечёнными, остальные — умеренно и с тёплым напитком
- мягкая клетчатка: псиллиум, чиа, льняной кисель
- пробиотические продукты: йогурт, кисломолочное, мисо, ферментированные напитки
- специи: зира, тмин, фенхель, кориандр, бадьян, орегано
Мята хорошо снимает спазм, но при ГЭРБ с ней осторожнее.
## Чай против вздутия
Зира, фенхель (или укроп) и кориандр поровну, не перемалывая. 1 ч. л. смеси на 500 мл горячей воды в термосе, настоять 10 минут. Пить тёплым по 100–200 мл между едой — заодно уходят отёки.
## Домашний йогурт
500 мл молока довести до кипения и остудить до 40 °C, размешать закваску и оставить в тепле на 14–16 часов. Хранить в холодильнике 5–7 дней. При частичной непереносимости лактозы — до 100 мл в тёплом виде.
Пробиотики и магний в виде добавок обсудите с врачом.`,
slow4_8: `## Какой стул считается нормой
Ежедневный, 1–2 раза в сутки (обычно утром после подъёма или после завтрака), оформленный, достаточного объёма, обычного цвета, не липнет.
## Что считается запором
Стул не каждый день, плотный («тип 1–2» по Бристольской шкале), с натуживанием, ощущение неполного опорожнения.
## Почему так бывает
- мало клетчатки и воды, много белка и фастфуда
- мало движения, сидячая работа
- стресс и тревога, «запор путешественника»
- побочное действие некоторых лекарств, гипотиреоз, диабет

slow4_9: `**СИБР** — синдром избыточного бактериального роста: в тонкой кишке становится слишком много бактерий. Они сбраживают углеводы с выделением газов, мешают усвоению питательных веществ и раздражают слизистую.
## Что обычно защищает тонкую кишку
Кислый желудочный сок, желчь, ферменты поджелудочной, хорошая моторика и местный иммунитет. Когда одно из звеньев ослабевает, бактерии начинают размножаться.
## Причины
- сниженная кислотность желудка, хронический стресс
- медленная моторика: атрофический гастрит, гипотиреоз, мало движения, переедание, мало клетчатки
- застой желчи, сладж, дискинезия, удалённый желчный пузырь
- нехватка ферментов, хронические воспаления ЖКТ, операции
- много сахара в рационе, частые антибиотики
## Признаки
- вздутие, урчание и газы через 30–90 минут после еды
- плохая переносимость ферментированных продуктов и пробиотиков
- боль вокруг пупка (при воспалении), реакция на FODMAP
- плотный белый налёт на языке, запах изо рта, непереваренная пища в стуле
- хронический кандидоз, усталость, выпадение волос, низкие белок и железо
СИБР часто идёт вместе с СРК.
## Диагностика
Водородный дыхательный тест; дополнительно врач исключает воспаление и органические причины.
## Подход программы
Главное — устранить причины, иначе СИБР возвращается. Медикаментозное лечение при выраженном СИБР назначает врач.
- **Усиливаем желудок и моторику:** тёплое питьё, 4–5 спокойных приёмов пищи без переедания, движение, сон 7–8 часов, специи-прокинетики (имбирь, тмин, корица, фенхель, розмарин, куркума, тимьян, зира, чеснок), фитосоставы протокола, прогревания желудка.
- **Убираем застой желчи:** жиры и лецитин (масла, яйца, авокадо), желчегонные овощи (запечённая тыква, свёкла, морковь, брокколи, зелень), бульоны, движение, тёплая минеральная вода, специи-спазмолитики и холеретики, прогревания правого подреберья.
- **Поддерживаем поджелудочную:** без тяжёлых сочетаний, с правилами хорошего переваривания белков и жиров, со специями-«ферментами» (корица, кориандр, душистый перец, зира, куркума, тмин), отвар чёрного кардамона.
- **FODMAP-элиминация** на 4–8 недель — частичная или полная, в зависимости от реакции.
## Натуральные антимикробные средства
Если диеты и поддержки недостаточно, в уроке разобраны растительные антимикробные и противоплёночные средства и схема их приёма по неделям. Начинать их можно только после того, как ушло воспаление, — и обязательно после согласования с врачом. В еду же смело добавляйте орегано, чёрный тмин и чеснок.`,
slow4_10: `**Helicobacter pylori** — бактерия, которая умеет выживать в кислом желудке. Она есть больше чем у 60 % людей, и у большинства годами не вызывает проблем: многое зависит от штамма, иммунитета, генетики и образа жизни.
## Чем опасны патогенные штаммы
Они разрушают защитный слой слизистой, поддерживают хронический гастрит, могут приводить к эрозиям и язвам, а при долгом воспалении — к атрофии слизистой. При этом хеликобактер — не единственная причина гастрита и язвы: всегда важна совокупность факторов, включая стресс и состояние слизистой.
## Когда стоит обследоваться
- диспепсия неясной причины, хронический гастрит
- язва желудка или двенадцатиперстной кишки сейчас или в прошлом
- атрофический гастрит, метаплазия по результатам гастроскопии
- рак желудка у близких родственников, анемия неясного происхождения
- перед длительным приёмом обезболивающих, аспирина или антикоагулянтов
## Как проверяют
Дыхательный уреазный тест или анализ кала на антиген — показывают активную инфекцию и подходят для контроля после лечения (не раньше чем через 4 недели). Гастроскопия с биопсией показывает и бактерию, и состояние слизистой. ПЦР и посев нужны, чтобы определить штамм и устойчивость к антибиотикам. Как подготовиться к анализу и какие препараты отменить заранее, подскажет врач.
## Лечение
Нужна ли эрадикация и по какой схеме — решает гастроэнтеролог. Обязательна она при язве, атрофии и метаплазии, раке желудка у родственников, анемии неясного происхождения. Если бактерия найдена случайно, жалоб нет и анамнез спокойный, лечение может быть не нужно.
## Что можем сделать сами
- **Гигиена:** мыть руки перед едой и после улицы, не пользоваться чужой посудой и щётками, не доедать за детьми и не облизывать их ложки. Если хеликобактер есть у одного члена семьи, обследоваться стоит всем.
- **Вода и еда:** только кипячёная или фильтрованная вода, хорошо вымытые овощи и зелень, полностью приготовленные мясо и рыба.
- **Желудок:** поддерживаем нормальную кислотность и защиту слизистой — по урокам «Еда: какая делает мне хуже» и «Правила еды».
## Продукты и специи против H. pylori
Чеснок, орегано, куркума, тимьян, имбирь, розмарин, чёрный тмин, фенхель, кардамон, корица, гвоздика. Брокколи и её проростки, шпинат, лимон и лайм, клюква, облепиха, гранат, черника, свежая и квашеная капуста, оливковое масло, зелёный чай, лён, живые кисломолочные продукты, горькая зелень, тыква, свёкла, морковь, морская капуста.
Пробиотики, витамины и растительные средства в дополнение к терапии разобраны в презентации урока — их приём обязательно согласуйте с лечащим врачом.`,

slow5_3: `На программе вы уже используете базовые меры: убрали то, что мешает пищеварению, пьёте ГКВ и напитки со специями, едите по меню с правильными сочетаниями, делаете гимнастику, прогревания и принимаете фитосоставы. В этом уроке — дополнительные инструменты. Они подходят только для вялого типа; при другом типе сначала посоветуйтесь со специалистом.
## «Активатор пищеварения» для желудка
Тонкий кружок свежего имбиря, несколько крупинок соли (классически — чёрной гималайской соли кала намак) и пара капель лимонного сока. Разжевать перед обильной едой — праздником, застольем — или если уже переели и чувствуете тяжесть, запить тёплой водой. Это «скорая помощь», а не ежедневная привычка.

1 ст. л. натурального нефильтрованного уксуса (5 %, с «уксусной маткой») на стакан тёплой или комнатной воды, можно с парой листиков мяты. Пить в тёплый сезон между едой — вместо воды с лимоном и кардамоном или настоя шиповника, не вместе с ними. Повышает кислотность желудка, помогает переваривать белок, подгоняет желчь и выравнивает сахар.
## Тёплая минеральная вода для желчного пузыря
Хлоридно-натриевые, сульфатные и магниевые лечебные воды стимулируют желудок, желчный пузырь и кишечник.
- 1–2 стакана в день, подогретая до 30–40 °C, без газа
- за 20–30 минут до еды или между приёмами пищи
- курс 10–14 дней, затем перерыв; 3–4 курса в год

slow1_4: `
<p class="lt-lead">Одна из задач программы — мягко подтолкнуть отток желчи, чтобы она не застаивалась и пища в кишечнике переваривалась как следует. Наши помощники здесь — мягкие желчегонные напитки.</p>
<p>Даём два рецепта. Попробуйте оба за время программы — и оставьте тот, что больше по вкусу.</p>

<h3>Чай с иван-чаем, мятой и календулой</h3>
<h4>Понадобится</h4>
<ul>
<li>ферментированный иван-чай — 2 ст. л.</li>
<li>цветки календулы — 2 ст. л.</li>
<li>мята перечная, кудрявая или лимонная — 1 ч. л.</li>
</ul>
<h4>Как приготовить</h4>
<ol class="lt-steps">
<li>Смешайте все ингредиенты — это ваша заготовка на несколько дней.</li>
<li>1 чайную ложку смеси заварите на 200 мл воды в небольшом чайнике или в чашке с ситечком.</li>
<li>Пейте по 1–2 кружки в тёплом виде в течение дня, как обычный чай.</li>
</ol>
<div class="lt-note"><b>Курс:</b> 10–14 дней. Потом можно пить пару раз в неделю на постоянной основе.<br>Рецепт всесезонный, но благодаря освежающей мяте особенно приятен в тёплое время года.</div>
<h4>Чем полезен</h4>
<ul>
<li><b>иван-чай</b> — мягко снимает спазмы и улучшает тонус желчного пузыря;</li>
<li><b>календула</b> — уменьшает воспаление и помогает оттоку желчи;</li>
<li><b>мята</b> — помогает при спазмах желчного пузыря и кишечника, вздутии и газах.</li>
</ul>
<h4>Где купить</h4>
<ul>
<li><b>Ферментированный (коричневый) иван-чай</b> — любой крупный супермаркет или маркетплейс.</li>
<li><b>Цветки календулы</b> — аптека.</li>
<li><b>Мята перечная</b> — та самая обычная мята, самая «забористая». Аптеки и продуктовые магазины.</li>
<li><b>Мята кудрявая</b> — более мягкая по вкусу, её часто сажают в огороде. Маркетплейсы.</li>
<li><b>Мята лимонная</b> — строго говоря, это мелисса, но свойства у неё похожие, а вкус приятный цитрусовый. Маркетплейсы, «зелёные аптеки», магазины трав.</li>
</ul>

<h3>Настой шиповника со специями</h3>
<p>Шиповник — один из растительных лидеров по витамину С и настоящая кладовая пользы: минералы, полифенолы, горечи. А ещё он мягко гонит желчь и снимает спазмы. Добавьте специи — и получится напиток на каждый день: бодрит, восстанавливает силы, поддерживает иммунитет и ЖКТ. Бонус: витамин С помогает усваивать железо из растительной пищи.</p>

<h4>Экспресс-настой на одну кружку</h4>
<ul>
<li>сублимированный шиповник без сахара — 1 ч. л. с горкой</li>
<li>молотый сухой имбирь — на кончике ножа</li>
<li>молотая корица — на кончике ножа</li>
<li>горячая кипячёная вода — 200 мл</li>
<li>мёд — по вкусу</li>
</ul>
<p>Смешайте, дайте настояться пару минут. Пейте по 1–2 кружки тёплым вместо чая в течение дня.</p>
<div class="lt-ins"><b>Специи — по сезону</b><p>В жару специи лучше не добавлять, чтобы не перегреться. А зимой они как раз кстати: напиток приятно согреет руки и ноги и улучшит кровообращение.</p></div>
<p><i>Сублимация — это бережная сушка при низкой температуре в вакууме. Вода уходит из продукта, минуя жидкую фазу, поэтому сохраняются структура, аромат, вкус и почти все чувствительные к нагреву вещества. Сублимированный шиповник без сахара и добавок ищите в магазинах здорового питания и на маркетплейсах.</i></p>

<h4>Классический настой — на всю семью</h4>
<p>Удобен, если напиток будете пить не только вы: его выгоднее готовить сразу много.</p>
<ul>
<li>термос на 1 литр</li>
<li>сушёный шиповник — 4–5 ст. л.</li>
<li>любые ягоды, свежие или замороженные, — большая горсть</li>
<li>корица — 1/4 палочки</li>
<li>свежий имбирь — кусочек толщиной в палец (или 1/5 ч. л. сушёного)</li>
</ul>
<ol class="lt-steps">
<li>Промойте ягоды, шиповник слегка разомните.</li>
<li>Сложите ягоды, шиповник и специи в термос.</li>
<li>Залейте кипячёной водой, остывшей до 85–90 °C, и оставьте на ночь.</li>
<li>Утром процедите и при желании добавьте немного мёда.</li>
</ol>
<p>Пейте по 1–2 кружки тёплым в течение дня. В тёплый сезон специи можно не класть.</p>
<div class="lt-warn"><div><b>Выбирайте термос со стеклянной колбой</b><p>Металл ускоряет разрушение витамина С, поэтому для шиповника металлические колбы лучше не использовать.</p></div></div>
`,

slow1_6: `
<p class="lt-lead">Цампа — это обжаренное ячменное толокно. В завтраках программы вы будете часто встречать кашу из неё: простой, вкусный и очень подходящий завтрак при вялом пищеварении.</p>
<p>Толокно лучше приготовить заранее, сразу целую пачку: оно отлично хранится и надолго. А сама каша готовится за пару минут — спасение для торопливого утра.</p>
<h3>Почему ячмень</h3>
<ul>
<li>сытный и питательный — в нём много белка;</li>
<li>укрепляет мышцы, кости и связки;</li>
<li>даёт ровную энергию и долгое чувство сытости, поэтому помогает снижать вес;</li>
<li>у него самый низкий гликемический индекс среди круп — сахар в крови не скачет;</li>
<li>повышает чувствительность клеток к инсулину.</li>
</ul>
<h3>Как приготовить цампу</h3>
<ol class="lt-steps">
<li>Возьмите обычную перловую или ячневую крупу (для первого раза — стандартную пачку 800–900 г). Хорошо промойте и замочите на 3–4 часа или на ночь.</li>
<li>Слейте воду, ещё раз промойте и разложите крупу на противне. Духовка — 70–80 °C (в газовой — минимальная температура) с обдувом или приоткрытой дверцей, 50–60 минут. В газовой духовке крупа сохнет быстрее.</li>
<li>Время от времени ворошите крупу лопаткой. Готовность проверяйте «на зубок»: зерно должно быть полностью сухим, иначе оно не смелется, а слипнется.</li>
<li>Измельчите сухую крупу в кофемолке или мельнице до муки крупного помола.</li>
<li>Обжарьте муку на сухой сковороде, постоянно помешивая, до цвета кофе с молоком и приятного орехового запаха. Это около 7–10 минут на газовой плите.</li>
</ol>
<div class="lt-warn"><div><b>Не отходите от плиты, пока обжариваете</b><p>Цампа сгорает очень быстро — буквально за минуту.</p></div></div>
<h3>Каша из цампы</h3>
<ul>
<li>цампа — 2–3 ст. л.</li>
<li>горячая кипячёная вода — 200–250 мл</li>
<li>масло гхи или сливочное — 6–10 г</li>
<li>соль</li>
</ul>
<h4>Если помол крупный</h4>
<p>Насыпьте цампу в небольшую кастрюльку, залейте 200 мл воды, размешайте без комочков и доведите до кипения.</p>
<h4>Если помол мелкий</h4>
<p>Залейте цампу в мисочке кипятком, размешайте без комочков, посолите и оставьте под крышкой на 5 минут.</p>

slow1_7: `
<p class="lt-lead">В меню программы мы будем советовать добавлять ферментированные овощи к горячим блюдам. Попробуйте приготовить их заранее, чтобы набить руку.</p>
<h3>Зачем они при вялом пищеварении</h3>
<ul>
<li><b>Естественные пробиотики.</b> Поддерживают микрофлору кишечника, а здоровый микробиом стимулирует перистальтику и улучшает переваривание.</li>
<li><b>Мягче для ЖКТ.</b> Ферментация расщепляет часть грубой клетчатки, и овощи легче усваиваются.</li>
<li><b>Запускают пищеварительные соки</b> — слюну, желудочный сок и желчь.</li>
<li><b>Содержат ферменты.</b> Бактерии в процессе ферментации выделяют собственные ферменты, которые помогают расщеплять и усваивать еду.</li>
</ul>
<div class="lt-ins"><b>Начинайте с малого</b><p>Первое время добавляйте к горячему приёму пищи не больше 1 столовой ложки овощей в день. Через 2–3 недели при желании можно 2 ложки.</p></div>
<div class="lt-warn"><div><b>Не подходят при СИБР</b><p>Ферментированные овощи не рекомендуются при синдроме избыточного бактериального роста в тонкой кишке. Если на пробиотики и ферментированные продукты появляются боли, рези, вздутие — пропустите этот урок и обсудите это с куратором.</p></div></div>
<p>Ниже — три рецепта. Выберите один или попробуйте все.</p>

<h3>Квашеная капуста</h3>
<h4>Ингредиенты</h4>
<ul>
<li>капуста — 1 кочан</li>
<li>морковь — 2 шт.</li>
<li>рассол — 2 ст. л. соли на 1 л воды</li>
<li>чеснок, клюква или яблоко — по желанию</li>

<ol class="lt-steps">

</ol>
<div class="lt-note">Если банку часто открывать, в холодильнике капуста хранится до двух недель. В закрытой банке под рассолом при 0…+4 °C — 4–6 месяцев.</div>

<h3>Маринованная свёкла</h3>
<h4>Ингредиенты</h4>
<ul>
<li>крупная свёкла — 1 шт.</li>
<li>сок апельсина — 1/3 шт.</li>
<li>сок лимона — 1/3 шт.</li>
<li>чеснок — 1–2 зубчика</li>

</ol>
<div class="lt-note">Готовая свёкла хранится в холодильнике около недели.</div>

<h3>Ферментированные кабачки</h3>
<p>Самый простой и быстрый вариант.</p>
<h4>Ингредиенты</h4>
<ul>
<li>кабачок — 1 шт.</li>
<li>яблочный уксус — 1 ст. л.</li>
<li>оливковое масло — 1/2 ст. л.</li>
<li>соль — 1 ч. л. с горкой</li>
<li>чеснок — 1–2 зубчика</li>
<li>зира, тмин, чили или паприка, горчица — по щепотке, растолочь в ступке</li>

<ol class="lt-steps">

<li>Вылейте соус в банку и хорошо встряхните, чтобы он распределился. Через пару часов, когда кабачок даст сок, встряхните ещё раз. Через 20 часов всё готово.</li>

infl1_3: "<p class=\"lt-lead\">Наша главная задача в рамках программы — вывести хроническое воспаление из органов ЖКТ и при этом мягко поддержать работу желудка, поджелудочной железы, кишечника и желчного пузыря. В этом помогут сборы трав и специй — фитосборы.<\/p>\n<p>Один из них вы сможете приготовить дома, рецепт ниже. Понадобятся кофемолка или электромельница для специй и электронные кухонные весы — достаточно самых простых и недорогих. Электромельницы есть на Ozon, а вот <a href=\"https://aliexpress.ru/item/1005003772613227.html?sku_id=12000027112868952\" target=\"_blank\" rel=\"noopener\">ссылка на мельницу с AliExpress<\/a>.<\/p>\n<p>Готовые фитосборы можно купить в <a href=\"https://www.holistica.academy/shop\" target=\"_blank\" rel=\"noopener\">магазине Holistica<\/a>.<\/p>\n\n<h3>Трифала отвар<\/h3>\n<p>Трифала — один из самых известных фитосборов восточной медицины для поддержки здоровья ЖКТ и устранения воспаления в кишечнике. Она состоит из трёх растений: миробалан хебула, миробалан беллерический и эмблика лекарственная. Интересно, что в зависимости от формы — отвар, порошок или масляная форма — Трифала действует по-разному.<\/p>\n<p>Мы с вами будем использовать отвар. Его действие:<\/p>\n<ul>\n<li><b>противовоспалительное.<\/b> Показан при хронических воспалительных процессах в ЖКТ любого характера (хр. гастрит, дуоденит, колит, холецистит и т. д.). Полезен и для устранения хронического воспаления после удаления желчного пузыря. Уменьшает признаки воспаления: боли, вздутие, тяжесть в животе;<\/li>\n<li><b>спазмолитическое и мягкое желчегонное.<\/b> Показан при дискинезии желчевыводящих путей;<\/li>\n<li><b>улучшает профиль кишечной микрофлоры:<\/b> подавляет патогенную микрофлору и поддерживает рост полезных лакто- и бифидобактерий.<\/li>\n<\/ul>\n<div class=\"lt-note\">Для отвара нужен <b>порошок<\/b>, а не таблетки или капсулы. И нужна чистая Трифала — три компонента в составе, не Трифала гуггул. Продаётся в любом аюрведическом магазине, на маркетплейсах и <a href=\"https://www.holistica.academy/shop/tproduct/1028994046-726989135462-trifala\" target=\"_blank\" rel=\"noopener\">в магазине Holistica<\/a>.<\/div>\n<h4>Как приготовить<\/h4>\n<p>1/2 чайной ложки порошка залейте 200 мл воды, доведите до кипения и варите 2 минуты. Настаивайте 10 минут. Пейте в тёплом виде. Как и когда пить — расскажем дальше в программе.<\/p>\n<h4>Ограничения<\/h4>\n<ul><li>при беременности — можно, в дозировке 1/2 от указанной;<\/li><li>при грудном вскармливании ограничений нет.<\/li><\/ul>\n\n<h3>Отвар Иролтуева<\/h3>\n<p>Действие противовоспалительное, ранозаживляющее, эпителизирующее:<\/p>\n<ul>\n<li>помогает восстановиться слизистой ЖКТ при эрозиях и других повреждениях;<\/li>\n<li>облегчает болевой синдром;<\/li>\n<li>уменьшает воспаление;<\/li>\n<li>защищает слизистые желудка и кишечника;<\/li>\n<li>уменьшает вздутие и метеоризм.<\/li>\n<\/ul>\n<h4>Показания<\/h4>\n<ul>\n<li>удалённый желчный пузырь;<\/li>\n<li>хр. эрозивный гастрит, язвенная болезнь желудка и двенадцатиперстной кишки;<\/li>\n<li>хр. дуоденит;<\/li>\n<li>хр. реактивный панкреатит;<\/li>\n<li>хр. колит, СИБР.<\/li>\n<\/ul>\n<p>Типичные жалобы при этом: рези в области желудка и пупка, боли в левом и правом подреберье, боли в кишечнике, метеоризм и вздутие, нарушение стула (диарея), мальабсорбция — плохое усвоение питательных веществ.<\/p>\n<h4>Рецепт<\/h4>\n<p>В равных пропорциях берём (условно по 10 г):<\/p>\n<ul class=\"lt-cols\">\n<li>корень конского щавеля <i>(radix Rumex confertus)<\/i>;<\/li>\n<li>трава тысячелистника <i>(herba Achillea millefolium)<\/i>;<\/li>\n<li>корень ревеня лекарственного <i>(radix Rheum officinale)<\/i>;<\/li>\n<li>трава хвоща полевого или лесного <i>(herba Equisetum arvense / sylvaticum)<\/i>;<\/li>\n<li>лист подорожника <i>(folium Plantago major)<\/i>;<\/li>\n<li>чага, гриб <i>(Inonotus obliquus)<\/i>;<\/li>\n<li>семена кориандра <i>(Coriandrum sativum)<\/i>;<\/li>\n<li>нут, «турецкий горох» <i>(Cicer arietinum)<\/i>;<\/li>\n<li>соцветия пижмы <i>(flores Tanacetum vulgare)<\/i>;<\/li>\n<li>мумиё аптечное <i>(Shilajit)<\/i>;<\/li>\n<li>какалия копьевидная, лист и стебель <i>(Parasenecio hastatus)<\/i>.<\/li>\n<\/ul>\n<h4>Как приготовить<\/h4>\n<ol>\n<li>Сделайте навеску на кухонных весах.<\/li>\n<li>Измельчите в электромельнице для специй или в блендере до максимально мелкой фракции, затем в кофемолке — до состояния порошка.<\/li>\n<\/ol>\n<p>Доза на один приём — 1/3 чайной ложки без горки. Залейте её 250 мл воды, кипятите 2 минуты. Пейте с осадком в тёплом виде.<\/p>\n<p>Профилактически — 1 раз в день. Во время обострения — 2–3 раза в день. Точные указания по приёму дадим во время программы.<\/p>\n<h4>Где купить<\/h4>\n<p>Все компоненты продаются в аптеках и <a href=\"https://magazintrav.ru/\" target=\"_blank\" rel=\"noopener\">магазинах трав<\/a>. <a href=\"https://holistica.academy/shop/tproduct/352444083-713138416121-otvar-iroltueva\" target=\"_blank\" rel=\"noopener\">Отвар Иролтуева в готовом виде<\/a> есть в магазине Школы здоровья Holistica.<\/p>\n<div class=\"lt-ins\"><b>Если вы живёте не в СНГ<\/b><p>У отвара Иролтуева сложная рецептура, и найти компоненты может быть непросто. Не переживайте! Используйте другие методики программы: отвар Трифалы (найдёте в любой стране), чаи с травами и специями, облепиховое масло, меню, напитки. Каждый из этих шагов работает на устранение воспаления, заживление слизистых и поддержку пищеварения.<\/p><\/div>",
infl1_4: "<p class=\"lt-lead\">При воспалённом пищеварении многие напитки — чёрный чай, кофе, морсы, соки — могут быть слишком агрессивны для слизистой ЖКТ.<\/p>\n<p>Поэтому даём несколько рецептов мягких напитков. У них нет такого бодрящего эффекта, как у кофеинсодержащих, зато растения в них уменьшают воспаление, снимают спазмы кишечника и желчевыводящих путей и нежно поддерживают пищеварение. Попробуйте несколько чаёв и выберите самые приятные вам. Чередовать можно по дням недели или по неделям.<\/p>\n\n<h3>Противовоспалительный чай для ЖКТ и печени<\/h3>\n<h4>Ингредиенты<\/h4>\n<ul>\n<li>сафлор <i>(safflower)<\/i> — 1 щепотка;<\/li>\n<li>семена кориандра цельные <i>(coriander seeds)<\/i> — половина чайной ложки без горки;<\/li>\n<li>орегано, душица <i>(oregano)<\/i> — треть чайной ложки без горки;<\/li>\n<li>любой подсластитель — по вкусу.<\/li>\n<\/ul>\n<h4>Как приготовить<\/h4>\n<p>Заварите все компоненты в 200 мл воды в небольшом чайнике или в чашке с ситечком. Настойте несколько минут, добавьте немного подсластителя. Пейте в тёплом виде по 1–2 кружки в день. Вкус на первый взгляд странный, но привыкаешь :) Курс — 10–14 дней, затем можно продолжить пару раз в неделю.<\/p>\n<p>Все компоненты есть в магазинах специй, на маркетплейсах и в нашем <a href=\"https://www.holistica.academy/shop/tproduct/1028994046-628526421742-nabor-spetsii-vospalennoe-pischevarenie\" target=\"_blank\" rel=\"noopener\">боксе со специями<\/a>.<\/p>\n<p><b>Сафлор<\/b> выводит воспаление из печени и желчевыводящих путей. <b>Кориандр<\/b> — из желудка и двенадцатиперстной кишки. <b>Орегано<\/b> облегчает вздутие и спазмы в кишечнике, а ещё обладает выраженной бактерицидной и антигистаминной активностью, что полезно при СИБР.<\/p>\n<div class=\"lt-pair\"><figure class=\"\"><img src=\"materials/infl/img/w1_01.webp\" alt=\"Сафлор\" loading=\"lazy\"><figcaption>Сафлор<\/figcaption><\/figure><figure class=\"\"><img src=\"materials/infl/img/w1_02.webp\" alt=\"Шафран\" loading=\"lazy\"><figcaption>Шафран<\/figcaption><\/figure><\/div>\n<div class=\"lt-warn\"><div><b>Внимание!<\/b><p>Сафлор красильный (имеретинский шафран) — это <b>не<\/b> шафран посевной <i>(Crocus sativus)<\/i>.<\/p><p>Если вы купили шафран: на 1 чашку чая берите 7–10 нитей шафрана, <b>не щепотку!<\/b><\/p><\/div><figure class=\"lt-side\"><img src=\"materials/infl/img/w1_03.webp\" alt=\"\" loading=\"lazy\"><\/figure><\/div>\n\n<h3>Успокаивающий кишечник чай<\/h3>\n<h4>Ингредиенты<\/h4>\n<ul>\n<li>цветки ромашки <i>(chamomile flowers)<\/i> — 1 столовая ложка;<\/li>\n<li>бадьян колотый <i>(star anise)<\/i> — 1 чайная ложка;<\/li>\n<li>мята <i>(mint)<\/i> — половина чайной ложки без горки;<\/li>\n<li>орегано, душица <i>(oregano)<\/i> — половина чайной ложки без горки;<\/li>\n<li>любой подсластитель — по вкусу.<\/li>\n<\/ul>\n<h4>Как приготовить<\/h4>\n<p>Смешайте все ингредиенты. 1 чайную ложку смеси заварите в 200 мл воды в небольшом чайнике или в чашке с ситечком, добавьте чуть-чуть подсластителя. Пейте по 1–2 кружки в тёплом виде в течение дня. Курс — 10–14 дней, затем можно продолжить пару раз в неделю.<\/p>\n<p>Рецепт всесезонный, но из-за освежающей и немного охлаждающей мяты он особенно приятен в тёплое время года.<\/p>\n<p><b>Где купить:<\/b> ромашка и мята — в аптеке или в чайном отделе супермаркета. Бадьян и орегано — в супермаркете, магазине специй и в <a href=\"https://www.holistica.academy/shop/tproduct/1028994046-628526421742-nabor-spetsii-vospalennoe-pischevarenie\" target=\"_blank\" rel=\"noopener\">боксе со специями<\/a>.<\/p>\n<p><b>Что делает чай:<\/b> облегчает спазмы в кишечнике, уменьшает вздутие.<\/p>\n\n<h3>Противовоспалительный и мягкий желчегонный чай<\/h3>\n<h4>Ингредиенты<\/h4>\n<ul>\n<li>тысячелистник <i>(yarrow)<\/i> — 2 столовые ложки;<\/li>\n<li>цветки ромашки <i>(chamomile flowers)<\/i> — 1 столовая ложка;<\/li>\n<li>цветки календулы <i>(calendula flowers)<\/i> — 1 столовая ложка;<\/li>\n<li>любой подсластитель — по вкусу.<\/li>\n<\/ul>\n<h4>Как приготовить<\/h4>\n<p>Смешайте все ингредиенты. 1 чайную ложку смеси заварите в 200 мл воды, добавьте чуть-чуть подсластителя. Пейте по 1–2 кружки в тёплом виде в течение дня. Курс — 10–14 дней, затем можно продолжить пару раз в неделю. Всё для этого чая продаётся в аптеке.<\/p>\n<p><b>Ромашка<\/b> действует противовоспалительно и снимает спазмы кишечника и желчевыводящих путей. <b>Календула<\/b> нежно стимулирует отток желчи. <b>Тысячелистник<\/b> снимает спазмы, мягко гонит желчь, обладает вяжущим действием и уменьшает вздутие.<\/p>\n<div class=\"lt-warn\"><div><b>При беременности этот чай не используем.<\/b><\/div><\/div>",
infl1_5: "<p class=\"lt-lead\">Масло облепихи крушиновидной <i>(sea buckthorn oil)<\/i> — эффективное средство для восстановления ЖКТ при хронических воспалительных процессах. Его эффект объясняется составом: жирные кислоты, каротиноиды, токоферолы и фитостерины.<\/p>\n<h3>Чем масло полезно для ЖКТ<\/h3>\n<ol class=\"lt-steps\">\n<li><b>Заживляет слизистую.<\/b> Масло покрывает слизистые тонкой плёнкой, защищает их от раздражения и создаёт условия для восстановления. Особенно полезно при гастрите, рефлюксе, язвенной болезни, эрозиях пищевода и желудка.<\/li>\n<li><b>Снимает воспаление.<\/b> Облепиха снижает выработку провоспалительных цитокинов в кишечнике — это полезно при хронических колитах, энтеритах, синдроме раздражённого кишечника.<\/li>\n<li><b>Ускоряет восстановление тканей.<\/b> Витамины A, E, C и каротиноиды стимулируют обновление эпителия, поэтому масло помогает слизистой восстановиться после медикаментозных повреждений ЖКТ — например, после антибиотиков и НПВС.<\/li>\n<li><b>Мягко улучшает желчеотток.<\/b> Как и любые жиры, облепиховое масло помогает печени и желчному пузырю работать активнее.<\/li>\n<\/ol>\n<div class=\"lt-note\">При воспалённом пищеварении рекомендую принимать облепиховое масло <b>вместе с едой<\/b>. Как именно — подробно расскажем дальше в программе.<\/div>\n<h3>Где купить<\/h3>\n<p>Нужно <b>пищевое<\/b> облепиховое масло. В СНГ его выпускают многие производители: оно продаётся в аптеках, в отделах «товары для здоровья» в супермаркетах и в магазинах здорового питания. Купите бутылочку на 50 или 100 мл — хватит надолго.<\/p>\n<p>Если вы живёте не в СНГ, поищите облепиховое масло в магазинах здорового питания, на iHerb или Amazon.<\/p>\n<div class=\"lt-pair lt-pair-sm\"><figure class=\"\"><img src=\"materials/infl/img/w1_04.webp\" alt=\"\" loading=\"lazy\"><\/figure><figure class=\"\"><img src=\"materials/infl/img/w1_05.webp\" alt=\"\" loading=\"lazy\"><\/figure><\/div>\n<div class=\"lt-ins\"><b>Про холестерин<\/b><p>У приёма масла есть побочный эффект: уровень холестерина может немного подняться, в пределах 1 ммоль/л. Отнеситесь к этому спокойно: приём масел — временная терапевтическая мера, а специи на программе частично компенсируют этот эффект.<\/p><\/div>",
infl1_6: "<p class=\"lt-lead\">Чтобы готовить по программе было удобно, заранее подготовьте на кухне несколько вещей.<\/p>\n<div class=\"lt-inv\">\n<ol class=\"lt-steps\">\n<li><b>Термос на 0,5 или 1 л<\/b> — для напитков.<\/li>\n<li><b>Блендер<\/b> — для супов-пюре и паштетов.<\/li>\n<li><b>Кухонные весы.<\/b><\/li>\n<li><b>Кофемолка или электромельница для специй.<\/b><\/li>\n<\/ol>\n<figure class=\"lt-side\"><img src=\"materials/infl/img/w1_06.webp\" alt=\"\" loading=\"lazy\"><\/figure>\n<\/div>\n<div class=\"lt-note\">Если будете делать фитосборы сами, рекомендуем мощную и удобную <a href=\"https://aliexpress.ru/item/1005003772613227.html?sku_id=12000027112868952\" target=\"_blank\" rel=\"noopener\">мельницу с AliExpress<\/a>. Или используйте мощную кофемолку с загрузкой от 50 граммов.<\/div>",
infl1_7: "<p class=\"lt-lead\">Кисели обволакивают, снимают воспаление и щадят слизистую, поэтому при хронических воспалениях ЖКТ это очень полезный напиток. Они защищают слизистую от раздражения пищей, кислотой и ферментами, уменьшают боль и жжение, помогают слизистой быстрее восстанавливаться.<\/p>\n<h4>Кому особенно подойдут кисели<\/h4>\n<ul>\n<li>если слизистая желудка и кишечника воспалена и чувствительна и отвечает болью и изжогой на кислое, жгучее и выраженно горькое, алкоголь, острые специи, кофе, цикорий, крепкий чай;<\/li>\n<li>если бывают «голодные боли» в желудке через 1–2 часа после еды;<\/li>\n<li>если кажется, что пища переваривается очень быстро и часто хочется есть.<\/li>\n<\/ul>\n<p>Вот два простых киселя. Попробуйте оба и выберите тот, что больше нравится по эффекту и по вкусу. Или чередуйте их всю программу.<\/p>\n\n<h3>Овсяный кисель<\/h3>\n<h4>Ингредиенты<\/h4>\n<ul>\n<li>100 г овсяных хлопьев долгой варки <i>(slow cooking oats)<\/i>;<\/li>\n<li>600 мл воды для заливки и ещё немного для промывки;<\/li>\n<li>по желанию: изюм, черника, малина или фруктовое пюре.<\/li>\n<\/ul>\n<h4>Как приготовить<\/h4>\n<ol class=\"lt-steps\">\n<li>Измельчите хлопья блендером до муки крупного помола. Залейте 600 мл воды, хорошо перемешайте и оставьте под крышкой при комнатной температуре на 5–6 часов или на ночь.<\/li>\n<li>Процедите настой в ковшик через мелкое металлическое сито или дуршлаг с марлей. Остатки крахмала можно забрать: залейте жмых небольшим количеством воды, перемешайте и процедите ещё раз. Жмых больше не нужен — добавьте его в утреннюю кашу или сделайте оладьи.<\/li>\n<li>Поставьте ковшик на средний огонь, слегка посолите. Доведите до кипения, всё время помешивая, иначе прилипнет ко дну.<\/li>\n<li>Продолжая помешивать, уваривайте несколько минут до загустения. Если кисель не загустел на огне, он загустеет, пока остывает. Дайте ему остыть до тёплого.<\/li>\n<\/ol>\n<div class=\"lt-grid\"><figure class=\"\"><img src=\"materials/infl/img/w1_07.webp\" alt=\"\" loading=\"lazy\"><\/figure><figure class=\"\"><img src=\"materials/infl/img/w1_08.webp\" alt=\"\" loading=\"lazy\"><\/figure><figure class=\"\"><img src=\"materials/infl/img/w1_09.webp\" alt=\"\" loading=\"lazy\"><\/figure><figure class=\"\"><img src=\"materials/infl/img/w1_10.webp\" alt=\"\" loading=\"lazy\"><\/figure><figure class=\"\"><img src=\"materials/infl/img/w1_11.webp\" alt=\"\" loading=\"lazy\"><\/figure><figure class=\"\"><img src=\"materials/infl/img/w1_12.webp\" alt=\"\" loading=\"lazy\"><\/figure><\/div>\n<div class=\"lt-hero\"><figure class=\"\"><img src=\"materials/infl/img/w1_13.webp\" alt=\"\" loading=\"lazy\"><\/figure><\/div>\n<p>У такого киселя приятный нежный вкус овсянки, он вкусный и сам по себе. Можно добавить немного измельчённого изюма или некислых ягод — чернику, малину. Если нормально переносите кислый вкус, подойдёт пара ложек любого фруктового пюре, например грушевого или ягодного.<\/p>\n<div class=\"lt-note\">Пейте по 150–200 мл в тёплом виде 1–2 раза в день между приёмами пищи. Остаток храните в холодильнике.<\/div>\n\n<h3>Льняной кисель<\/h3>\n<p>Очень быстрый рецепт.<\/p>\n<h4>Ингредиенты<\/h4>\n<ul>\n<li>молотое семя льна <i>(flax seeds)<\/i> или льняная мука — 1 столовая ложка без горки;<\/li>\n<li>вода — 300 мл;<\/li>\n<li>горсть малины или черники.<\/li>\n<\/ul>\n<h4>Как приготовить<\/h4>\n<ol class=\"lt-steps\">\n<li>Размешайте льняную муку в воде комнатной температуры: сначала в небольшом объёме, потом долейте остальное — так не будет комков.<\/li>\n<li>Поставьте на огонь и, помешивая, доведите до кипения.<\/li>\n<li>Томите на малом огне 2 минуты, выключите плиту и остудите. Добавьте ягоды.<\/li>\n<\/ol>\n<div class=\"lt-ins\"><b>Пейте сразу<\/b><p>Льняной кисель не хранится: семена льна быстро окисляются. Пейте его тёплым сразу после приготовления.<\/p><\/div>"
});

// ── Подготовительная неделя · чувствительное и смешанное пищеварение (из материалов уроков) ──
var LT_SL = 'materials/slow/img/', LT_MX = 'materials/mix/img/';
const ltImg = (src, cap, cls) => `<figure class="${cls || ''}"><img src="${src}" alt="${cap || ''}" loading="lazy">${cap ? `<figcaption>${cap}</figcaption>` : ''}</figure>`;
const LT_GRANAT = `<h4>Где взять сушёный гранат</h4>
<p>Сушёные зёрна продаются на маркетплейсах. А можно высушить самим — гранат «усыхает» примерно в 10 раз.</p>
<ol class="lt-steps">

<li><b>Успокаивает нервную систему.</b> ЖКТ тесно связан с блуждающим нервом. Магний снижает реактивность кишечника при стрессе, уменьшает тревожность и улучшает сон — а это, в свою очередь, стабилизирует пищеварение.</li>
<li><b>Регулирует моторику кишечника.</b> Нормализует стул и при вялой моторике, и при спастических запорах.</li>
</ol>
<p>Кроме того, магний участвует почти в 300 реакциях в организме, поддерживает сердце, давление и нервно-мышечную передачу.</p>
<h4>Какую форму выбрать</h4>
<ul>
<li><b>Глицинат (бисглицинат, хелат)</b> — самая универсальная форма. Хорош при ГЭРБ, тошноте, изжоге, тревожности, улучшает сон. Усваивается до 90 %. Принимают вечером.</li>
<li><b>Малат</b> — бодрит и активизирует пищеварение, слегка повышает кислотность желудка. Хорош при хронической усталости, головных болях напряжения, постоянно холодных руках и ногах. Принимают утром.</li>
<li><b>Цитрат</b> — самая активная из этих форм, снимает спазмы, хорошо усваивается. Часто входит в комбинированные добавки.</li>
</ul>
<p>Магний продаётся в аптеках и на маркетплейсах. Обратите внимание на комбинированные добавки с несколькими формами магния. Как принимать — расскажем на программе.</p>
<div class="lt-warn"><div><b>Магний может понижать давление</b><p>Если у вас низкое давление, выбирайте добавку магния с кальцием. Перед началом приёма любых добавок посоветуйтесь с лечащим врачом — особенно если принимаете лекарства.</p></div></div>
