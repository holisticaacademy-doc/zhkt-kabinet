mix1_5: `
<div class="lt-inv"><div><p class="lt-lead">Три рецепта напитков на каждый день — вкусных и полезных для смешанного типа, когда пищеварение одновременно и «ленивое», и склонное к воспалению.</p></div><div class="lt-side">${ltImg(LT_MX + 'chai.webp')}</div></div>
<p>Растения в них мягко стимулируют ЖКТ, помогают оттоку желчи, снимают спазмы и не дают разгореться воспалению. Чаи можно чередовать по дням: в понедельник один, во вторник другой и так далее.</p>

<h3>Чай с шиповником и фенхелем</h3>
<p><b>Шиповник</b> — один из лидеров по витамину С, источник минералов и полифенолов, мягко гонит желчь и снимает спазмы. <b>Фенхель</b> — базовая специя для ЖКТ: снимает спазмы, уменьшает вздутие и помогает пище продвигаться. Вместе — бодрящий напиток на каждый день, который поддерживает иммунитет и помогает усваивать железо из растительной пищи.</p>
<h4>Понадобится</h4>
<ul>
<li>сублимированный шиповник без сахара — 1 ч. л.</li>
<li>горячая кипячёная вода — 200 мл</li>
<li>семена фенхеля — щепотка</li>
<li>мёд — по вкусу</li>
</ul>
<p>Смешайте, настаивайте 5 минут. Пейте по 1–2 кружки тёплым вместо чая в течение дня.</p>
<p><i>Сублимированный шиповник без сахара и добавок ищите в магазинах здорового питания и на маркетплейсах.</i></p>
<div class="lt-warn"><div><b>Осторожно с фенхелем</b><p>Если в анамнезе есть гормонозависимые злокачественные образования (груди, яичников, матки), фенхель лучше не использовать.</p></div></div>

<h3>Чай с кардамоном и кориандром</h3>
<p><b>Зелёный кардамон</b> мягко «будит» пищеварение и не перегревает его. <b>Кориандр</b> — одна из лучших противовоспалительных специй. Вместе — идеальное сочетание для смешанного типа.</p>
<h4>Понадобится</h4>
<ul>
<li>термокружка или небольшой термос на 0,35–0,5 л</li>
<li>зелёный кардамон, целый — 3 шт.</li>
<li>семена кориандра — щепотка</li>
<li>четверть кружочка лимона с цедрой — если хорошо переносите кислое</li>
</ul>
<p>Залейте всё горячей водой в термосе, дайте настояться 10–15 минут. Специи можно не вынимать. Пейте тёплым в течение дня.</p>
<div class="lt-warn"><div><b>Противопоказания</b><p>Острые воспалительные процессы органов ЖКТ, поджелудочной железы, печени и желчного пузыря; индивидуальная непереносимость.</p></div></div>

<h3>Чай с ромашкой, мятой и липой</h3>
<p><b>Чем помогает:</b> снимает спазмы кишечника, уменьшает вздутие, поддерживает отток желчи, мягко снимает воспаление.</p>
<h4>Понадобится</h4>
<ul>
<li>цветки ромашки — 2 ст. л.</li>
<li>цветки липы — 1 ст. л.</li>
<li>мята (перечная, кудрявая или другая) — 1/2 ч. л.</li>
</ul>
<p>Смешайте. 1 чайную ложку смеси заварите на 200 мл воды в небольшом чайнике или в чашке с ситечком. Пейте по 1–2 кружки тёплым в течение дня. Рецепт всесезонный, но с мятой особенно приятен в тёплое время года. Всё продаётся в аптеке или чайном отделе супермаркета.</p>
`,

mix1_6: `
<p class="lt-lead">Этот рецепт понадобится с 3-й недели, когда начнём питаться по меню. Даём его заранее, чтобы вы успели найти закваску и потренироваться :)</p>
<p>Для здорового пищеварения нужна полноценная микрофлора. Лучший способ её вырастить — регулярно есть качественные продукты с живыми лакто- и бифидобактериями. Магазинные кисломолочные продукты не всегда дают нужное разнообразие штаммов, поэтому проще сделать йогурт дома на хорошей закваске.</p>
<h3>Закваска</h3>
<p>Хорошие закваски на рынке СНГ — ViVo, БакЗдрав, Lactoferm. Можно сквасить молоко и качественным фермерским йогуртом — проверьте на упаковке, что в нём не меньше 7–8 штаммов лакто- и бифидобактерий.</p>
<div class="lt-grid">${ltImg(LT_MX + 'zakvaska1.webp')}${ltImg(LT_MX + 'zakvaska2.webp')}${ltImg(LT_MX + 'zakvaska3.webp')}</div>
<h3>Рецепт</h3>
<h4>Ингредиенты</h4>
<ul>
<li>нежирное молоко — 500 мл (коровье или козье 1,5–2,5 %, или кокосовое — минимальной жирности, какую найдёте)</li>
<li>закваска или 1–2 ложки фермерского йогурта</li>
</ul>
<ol class="lt-steps">
<li>Коровье или козье молоко доведите до кипения и остудите примерно до 40 °C. Кокосовое не кипятите — просто нагрейте до 40 °C (кастрюля чуть теплее руки).</li>
<li>Растворите в молоке пакетик закваски и хорошо перемешайте — или добавьте 1–2 ложки йогурта.</li>
<li>Поставьте банку в тёплое место — к батарее, в йогуртницу или тёплую духовку — на 12–14 часов. Не сквасился — подождите ещё: чем теплее, тем быстрее.</li>
</ol>
<div class="lt-note">Йогурт из кокосового молока получится жидким, как соус, — так и должно быть.</div>
<h3>Как хранить и есть</h3>
<ul>
<li>Готовый йогурт хранится в холодильнике 5 дней — не готовьте много. Если делаете регулярно, можно сквашивать новое молоко частью предыдущего йогурта.</li>
<li>Ешьте йогурт тёплым: поставьте плошку в горячую воду.</li>
<li>Йогурт из животного молока ешьте отдельно от другой еды, как перекус — между завтраком и обедом или обедом и ужином. Молочное плохо сочетается с другими продуктами.</li>
<li>Кокосовый йогурт можно добавлять к еде, но только к горячей — так лучше переварятся жиры. Или ешьте как перекус между обедом и ужином.</li>
</ul>
`,

 "infl1_1": "<h4>Главное за 1 минуту<\/h4>\n<div class=\"lt-note\"><p><strong>Воспалительный тип пищеварения<\/strong> — хроническое воспаление слизистой желудка, тонкого или толстого кишечника, иногда стенок жёлчного пузыря и поджелудочной железы. Меняется микробиом: возможны дисбиоз, СИБР, H. pylori.<\/p>\n<p><strong>Типичные диагнозы:<\/strong> гастрит, ГЭРБ, дуоденит, холецистит, хронический панкреатит, колит, язвенный колит, энтерит, дисбиоз, СИБР, хеликобактерная инфекция.<\/p><\/div>\n<h4>Характерные жалобы (достаточно 2–3)<\/h4>\n<ul>\n<li>изжога и жжение от кислого, горького, жгучего, острого (шоколад, кофе, алкоголь, цитрусы, томаты);<\/li>\n<li>боли через 1–1,5 часа после еды, на голодный желудок, ночью с 1:00 до 3:00;<\/li>\n<li>колющие боли справа; опоясывающие боли слева с отдачей в спину;<\/li>\n<li>вздутие на ферментированную пищу и пробиотики;<\/li>\n<li>лучше после обволакивающего: овсянка, льняная каша, пюре, кокосовое молоко;<\/li>\n<li>тошнота без связи с едой; диарея, несформированный стул, слизь в стуле.<\/li>\n<\/ul>\n<div class=\"lt-note\"><strong>Со временем<\/strong> воспаление истощает функции ЖКТ и добавляются признаки вялого и чувствительного типа: тяжесть, вечернее вздутие, отрыжка, изжога на мучное и сладкое, реакция на клетчатку и температуру еды. Протокол учитывает это, но приоритет — работа с воспалением.<\/div>\n<h4>Риски<\/h4>\n<p>Обострение заболеваний; язва желудка и 12-перстной кишки; эрозивный → атрофический гастрит; панкреатит с фиброзом; мальабсорбция; СРК с воспалительным компонентом; повышенная кишечная проницаемость → аллергии, аутоиммунные процессы. <strong>Каскад Корреа:<\/strong> воспаление → кишечная метаплазия → онкология желудка (менее 1 % случаев).<\/p>\n<h4>Какие обследования обсудить с гастроэнтерологом<\/h4>\n<div class=\"lt-tbl\"><table>\n<thead>\n<tr>\n<th><strong>Обследование<\/strong><\/th>\n<th><strong>Что показывает<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>УЗИ брюшной полости<\/strong><\/td>\n<td>Печень, жёлчный, поджелудочная; с нагрузкой — сократимость пузыря<\/td>\n<\/tr>\n<tr>\n<td><strong>ФГДС с биопсией<\/strong><\/td>\n<td>Слизистая, воспаление, H. pylori — при болях в желудке, изжоге, ГЭРБ<\/td>\n<\/tr>\n<tr>\n<td><strong>Кал: кальпротектин, скрытая кровь<\/strong><\/td>\n<td>Воспаление во всём кишечнике; дальше по показаниям — колоноскопия<\/td>\n<\/tr>\n<tr>\n<td><strong>СРБ (ультрачувств.), СОЭ<\/strong><\/td>\n<td>Общий уровень воспаления<\/td>\n<\/tr>\n<tr>\n<td><strong>ОАК, ферритин, B12, фолиевая кислота<\/strong><\/td>\n<td>Дефицит железа и кофакторов<\/td>\n<\/tr>\n<tr>\n<td><strong>Общий белок, альбумин<\/strong><\/td>\n<td>Усвоение белка<\/td>\n<\/tr>\n<tr>\n<td><strong>АЛТ, АСТ, билирубин<\/strong><\/td>\n<td>Печень и желчевыводящие пути<\/td>\n<\/tr>\n<tr>\n<td><strong>Амилаза, липаза<\/strong><\/td>\n<td>Острое воспаление поджелудочной, приступы<\/td>\n<\/tr>\n<tr>\n<td><strong>Кал на панкреатическую эластазу<\/strong><\/td>\n<td>Выработка ферментов поджелудочной<\/td>\n<\/tr>\n<tr>\n<td><strong>Водородно-дыхательный тест<\/strong><\/td>\n<td>СИБР, непереносимость лактозы, фруктозы и др. сахаров<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<div class=\"lt-warn\"><div><strong>Важно:<\/strong> точный список анализов назначает и результаты оценивает врач-гастроэнтеролог индивидуально.<\/div><\/div>\n<h4>Цель и план программы (5 недель)<\/h4>\n<p><strong>Цель:<\/strong> снизить воспаление, не допустить его развития и обострений, поддержать пищеварение и всасывание, повысить качество жизни и энергию — мягкими бережными методами.<\/p>\n<ol>\n<li>мягкие сорбенты — подготовка кишечника;<\/li>\n<li>режим дня;<\/li>\n<li>регуляция нервной системы, снижение стресса;<\/li>\n<li>напитки с противовоспалительными травами;<\/li>\n<li>коррекция питания;<\/li>\n<li>меню из легкоусвояемых противовоспалительных блюд;<\/li>\n<li>специи и травы для снятия воспаления и заживления слизистой.<\/li>\n<\/ol>\n<div class=\"lt-ins\"><strong>Задание: посмотрите другие уроки первой недели, проверьте, какие травы и специи есть дома, докупите недостающее. Не торопитесь.<\/strong><\/div>",
 "infl2_2": "<h4>Главное за 1 минуту<\/h4>\n<div class=\"lt-note\"><p><strong>Воспалительный тип пищеварения<\/strong> — хроническое воспаление слизистой желудка, тонкой или толстой кишки, стенок жёлчного пузыря или паренхимы поджелудочной железы.<\/p>\n<p><strong>Воспаление стартует не от одной причины<\/strong>, а когда складывается комбинация: генетика + образ жизни + ослабленные защитные факторы + лекарства + питание как триггер.<\/p>\n<p><strong>Каждая жалоба знаковая<\/strong> — даже если возникает изредка. Она указывает на конкретный отдел ЖКТ и конкретный процесс.<\/p><\/div>\n<h4>12 причин воспаления в ЖКТ<\/h4>\n<ol>\n<li><strong>Ослабление защитных факторов слизистой<\/strong> (слизь, бикарбонаты, обновление клеток, кровоснабжение, гормоны, иммунитет) — из-за плохого сна, хаоса в питании, ненормированного графика, нехватки белка.<\/li>\n<li><strong>Острый и хронический стресс.<\/strong><\/li>\n<li><strong>Генетика<\/strong> — склонность к слабому иммунитету, нарушенному синтезу слизи и бикарбонатов, изменённой моторике.<\/li>\n<li><strong>Отравления и инфекции<\/strong>: H. pylori, сальмонелла, вирусы, простейшие.<\/li>\n<li><strong>Длительный приём лекарств<\/strong>: НПВС, глюкокортикостероиды, препараты железа и калия, антибиотики, цитостатики.<\/li>\n<li><strong>Нарушение микробиома кишечника.<\/strong><\/li>\n<li><strong>Нарушения моторики<\/strong>: дискинезия, рефлюкс (заброс желудочного содержимого в пищевод, жёлчи — в желудок).<\/li>\n<li><strong>Удаление жёлчного пузыря<\/strong> — жёлчные кислоты хаотично поступают в кишечник и раздражают его.<\/li>\n<li><strong>Вторичные воспаления<\/strong> — на фоне болезней других систем, сахарного диабета, аутоиммунных заболеваний (например, АИТ + аутоиммунный гастрит).<\/li>\n<li><strong>Курение<\/strong> — никотин снижает кровоток и ослабляет сфинктеры.<\/li>\n<li><strong>Триггеры в питании<\/strong>: переедание, жареное и жирное, кислое, алкоголь, кофе, газировка.<\/li>\n<li><strong>Конституция с преобладанием доши Желчь / Питта.<\/strong><\/li>\n<\/ol>\n<div class=\"lt-note\"><strong>Пища — триггер, а не причина.<\/strong> Два человека едят одно и то же за праздничным столом: у того, кто в хроническом стрессе, плохо спит и ест как попало, случается приступ панкреатита; у стрессоустойчивого соседа с нормальным режимом — ничего.<\/div>\n<h4>Жалоба → что за ней стоит<\/h4>\n<div class=\"lt-tbl\"><table>\n<thead>\n<tr>\n<th><strong>Где<\/strong><\/th>\n<th><strong>Жалоба<\/strong><\/th>\n<th><strong>Возможная причина<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Пищевод<\/td>\n<td>Изжога, жжение (на кислое, жгучее, горькое)<\/td>\n<td>Гиперчувствительный пищевод, функциональная изжога, ГЭРБ<\/td>\n<\/tr>\n<tr>\n<td>Желудок (от мечевидного отростка до пупка)<\/td>\n<td>Боли натощак, через 1–1,5 ч после еды, на алкоголь, кислое, горькое<\/td>\n<td>Гастрит (поверхностный, эрозивный), язва желудка<\/td>\n<\/tr>\n<tr>\n<td>Желудок<\/td>\n<td>Тяжесть после еды<\/td>\n<td>Медленная эвакуация пищи, нарушение моторики<\/td>\n<\/tr>\n<tr>\n<td>Желудок<\/td>\n<td>Отрыжка<\/td>\n<td>Несмыкание нижнего пищеводного сфинктера, ГЭРБ<\/td>\n<\/tr>\n<tr>\n<td>Пищевод<\/td>\n<td>Неприятно глотать холодное и горячее<\/td>\n<td>Гиперсенситивный пищевод, слабая защита слизистой<\/td>\n<\/tr>\n<tr>\n<td>Правое подреберье<\/td>\n<td>Колющие боли после жирного, жареного<\/td>\n<td>Холецистит, дискинезия ЖВП, жёлчные камни<\/td>\n<\/tr>\n<tr>\n<td>Центр живота, левое подреберье<\/td>\n<td>Опоясывающие боли, отдают в спину<\/td>\n<td>Панкреатит<\/td>\n<\/tr>\n<tr>\n<td>Вокруг пупка<\/td>\n<td>Боли, жжение через 1–2 ч после еды<\/td>\n<td>Дуоденит, язва ДПК, энтерит, колит, болезнь Крона<\/td>\n<\/tr>\n<tr>\n<td>Кишечник<\/td>\n<td>Вздутие на ферментированное и пробиотики<\/td>\n<td>СИБР<\/td>\n<\/tr>\n<tr>\n<td>Кишечник<\/td>\n<td>Боли и газы от клетчатки<\/td>\n<td>СРК<\/td>\n<\/tr>\n<tr>\n<td>Кишечник<\/td>\n<td>Диарея, несформированный стул, слизь<\/td>\n<td>ВЗК, нехватка ферментов, гипермоторный ЖП, СИБР, СРК<\/td>\n<\/tr>\n<tr>\n<td>ЖКТ<\/td>\n<td>Ночные боли (01:00–03:00)<\/td>\n<td>Хронический панкреатит, гастрит, язвенная болезнь<\/td>\n<\/tr>\n<tr>\n<td>ЖКТ<\/td>\n<td>Легче от обволакивающей пищи<\/td>\n<td>Снижается контакт слизистой с кислотой и ферментами<\/td>\n<\/tr>\n<tr>\n<td>ЖКТ<\/td>\n<td>Тошнота на жирное, белковое<\/td>\n<td>Плохое переваривание жиров/белков, медленная эвакуация<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<div class=\"lt-warn\"><div><strong>Уточнение:<\/strong> на слайде про панкреатит по ошибке отмечено правое подреберье — правильно левое.<\/div><\/div>\n<h4>Когда пора обследоваться<\/h4>\n<ul>\n<li><strong>Частые колющие боли в правом боку<\/strong> — сделать УЗИ жёлчного пузыря.<\/li>\n<li><strong>Ночные боли в животе<\/strong> — начать обследование ЖКТ.<\/li>\n<li><strong>Диарея, несформированный стул<\/strong> — смотреть на признаки в других отделах и сдать анализы.<\/li>\n<\/ul>\n<div class=\"lt-ins\"><strong>Задание.<\/strong> Отметьте свои жалобы в таблице и подумайте, какие из 12 причин могли сформировать воспалительный тип пищеварения у вас. Напишите в комментариях к уроку.<\/div>\n<div class=\"lt-next\"><strong>В следующих уроках — что со всем этим делать.<\/strong><\/div>",
 "infl2_3": "<h4>Главное за 1 минуту<\/h4>\n<div class=\"lt-note\"><p>Каждый организм уникален, и отклик тела на еду, специи, фитосоставы тоже. Чтобы собрать свою формулу ЖКТ, на программе используем <strong>два инструмента<\/strong>:<\/p>\n<ul>\n<li><strong>Дневник симптомов и ощущений<\/strong> — связь еды и режима питания с ощущениями;<\/li>\n<li><strong>Трекер самочувствия<\/strong> — как меняется самочувствие в целом по дням недели.<\/li>\n<\/ul><\/div>\n<h4>Тест «Где вы сейчас?»<\/h4>\n<div class=\"lt-tbl\"><table>\n<thead>\n<tr>\n<th><strong>Вопрос<\/strong><\/th>\n<th><strong>5 баллов<\/strong><\/th>\n<th><strong>3 балла<\/strong><\/th>\n<th><strong>1 балл<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Часто замечаете связь между едой и самочувствием?<\/td>\n<td>Всегда<\/td>\n<td>Иногда<\/td>\n<td>Никогда<\/td>\n<\/tr>\n<tr>\n<td>Что делаете при тяжести после еды?<\/td>\n<td>Анализирую, что съел(а)<\/td>\n<td>Пью таблетку<\/td>\n<td>Игнорирую<\/td>\n<\/tr>\n<tr>\n<td>Как часто отслеживаете стул?<\/td>\n<td>Ежедневно<\/td>\n<td>Редко<\/td>\n<td>Никогда<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>12–15<\/strong> — вы детектив своего здоровья. <strong>6–11<\/strong> — вы на пути: заполняйте Дневник и Трекер. <strong>3–5<\/strong> — время начать диалог с телом, сегодня.<\/p>\n<h4>Дневник: что и как записывать<\/h4>\n<p><strong>Отслеживаем:<\/strong> регулярность приёмов пищи; аппетит и тягу к еде; стул (регулярность, частота, тип); качество и продолжительность сна (засыпание, просыпания); энергию в течение дня; настроение и стресс; ваши симптомы (кожа, давление, головные боли).<\/p>\n<ul>\n<li><strong>1–2 раза в день<\/strong> (утро и/или вечер), но каждый день.<\/li>\n<li><strong>Честность важнее «как правильно»<\/strong> — записывайте и кусочничество, и тягу к сладкому.<\/li>\n<li><strong>Фокус на паттерны<\/strong>, а не на единичные случаи (стресс утром → тяга к сладкому днём).<\/li>\n<li><strong>Колонки:<\/strong> приём пищи и время → блюда/напитки (можно фотографировать еду днём) → ощущения. Отдельно — стул и сон.<\/li>\n<\/ul>\n<h4>Трекер: формат и шкала<\/h4>\n<div class=\"lt-tbl\"><table>\n<thead>\n<tr>\n<th><strong>Формат<\/strong><\/th>\n<th><strong>Шкала (выберите одну)<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Бумажный<\/strong> — распечатка или от руки, со своими значками (лампочка — энергия, «zzz» — сон)<\/td>\n<td><strong>Баллы 1–10<\/strong>: 1 — очень плохо, 10 — отлично<\/td>\n<\/tr>\n<tr>\n<td><strong>Цифровой<\/strong> — Google/Excel с автоподсчётом, удобно вносить с телефона сразу<\/td>\n<td><strong>Смайлики<\/strong>: хорошо / нормально / трудный день<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><strong>Цвет<\/strong>: зелёный — отлично, жёлтый — умеренный дискомфорт, красный — симптом<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Строки — дни недели, столбцы — ваши параметры (аппетит, тяга к сладкому, еда после 20:00, стул, сон, энергия, ваш симптом). В конце — <strong>итог дня<\/strong> и <strong>итог недели<\/strong>. Женщинам — отмечать день цикла.<\/p>\n<h4>Анализ в конце недели: 3 шага<\/h4>\n<ol>\n<li><strong>Ищите связи.<\/strong> Триггеры ухудшений (бананы → вздутие; недосып → тяга к сладкому) и факторы улучшений (бульон на ужин → лёгкий стул утром).<\/li>\n<li><strong>Сравните лучший и худший день.<\/strong> Что ели, как спали, какие эмоции? Какие симптомы были и что «ДО» могло их вызвать? Какие триггеры повторяются в «красные» дни?<\/li>\n<li><strong>Создавайте заметки.<\/strong> «Когда я ем ___, в животе ___ и энергия ___»; «Когда я ем/пью ___, хожу в туалет лучше/хуже»; замены: кофе натощак → изжога → цикорий или чай из программы.<\/li>\n<\/ol>\n<div class=\"lt-note\"><strong>Вопрос себе: «Что ЛУЧШЕЕ из этого дня я могу повторить завтра?»<\/strong><\/div>\n<h4>Запомнить: Дневник и Трекер — это эксперимент<\/h4>\n<div class=\"lt-tbl\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th><strong>Правило<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>7<\/strong><\/td>\n<td>дней трекинга — минимум для выявления паттернов<\/td>\n<\/tr>\n<tr>\n<td><strong>3+<\/strong><\/td>\n<td>параметра — минимум для комплексной оценки<\/td>\n<\/tr>\n<tr>\n<td><strong>Анализ<\/strong><\/td>\n<td>лучшего и худшего дня → план на следующую неделю<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>",
 "infl2_4": "<h4>Главное за 1 минуту<\/h4>\n<div class=\"lt-note\"><p><strong>Здоровье ЖКТ = здоровье всего тела.<\/strong> Пищеварение влияет на поступление питательных веществ, энергию и митохондрии, мозг и нервную систему, печень, уровень воспаления, сон и настроение, кожу и суставы, репродуктивное здоровье, иммунитет.<\/p>\n<p><strong>ЖКТ — последовательный конвейер.<\/strong> Пища механически и химически обрабатывается, мелкие молекулы всасываются в кровь и лимфу. Все отделы работают в связке, как оркестр: сбой в одном звене влияет на всё пищеварение.<\/p><\/div>\n<h4>Этапы пищеварения<\/h4>\n<div class=\"lt-tbl\"><table>\n<thead>\n<tr>\n<th><strong>Этап<\/strong><\/th>\n<th><strong>Что происходит<\/strong><\/th>\n<th><strong>Хорошая работа — это<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Мозг<\/strong><\/td>\n<td>Пищевой центр гипоталамуса. Голод: состав крови, сигналы нервов ЖКТ, вид/запах/мысли о еде → запуск соков. Насыщение: наполнение желудка, состав пищи, гормоны ЖКТ и лептин, осознанная еда<\/td>\n<td>Голод и насыщение приходят естественно и вовремя<\/td>\n<\/tr>\n<tr>\n<td><strong>Рот<\/strong><\/td>\n<td>Анализ вкуса; слюна: размягчение, лизоцим, начало переваривания углеводов; жевание, глотание<\/td>\n<td>Сигнал желудку и поджелудочной готовить соки<\/td>\n<\/tr>\n<tr>\n<td><strong>Желудок<\/strong><\/td>\n<td>3 слоя мышц перемешивают пищу; соляная кислота (pH ≈ 1), пепсин и др.; первичное расщепление белков; транспортные белки для железа и B12; бактерицидная обработка; защитный муцин<\/td>\n<td>Расщепление белков; усвоение железа, B12, кальция, цинка, магния, меди; барьер от инфекций; нет тяжести, болей, изжоги, отрыжки<\/td>\n<\/tr>\n<tr>\n<td><strong>Тонкая кишка (7–8 м)<\/strong><\/td>\n<td>12-перстная — переваривание; тощая — всасывание; подвздошная — B12 и транзит. Работают желчь, ферменты поджелудочной и кишечника<\/td>\n<td>Мелкие молекулы всасываются через избирательно проницаемую стенку<\/td>\n<\/tr>\n<tr>\n<td><strong>Поджелудочная<\/strong><\/td>\n<td>Проферменты (липаза, протеаза, амилаза, трипсин, химотрипсин) под состав пищи, активируются в 12-перстной кишке; инсулин и глюкагон<\/td>\n<td>Полное переваривание БЖУ, усвоение ПНЖК и витаминов A, E, K, D; нет газов, вздутия, диареи<\/td>\n<\/tr>\n<tr>\n<td><strong>Желчь<\/strong><\/td>\n<td>Молодая (печёночная) → зрелая (пузырная). Щелочная среда, активация ферментов, эмульгация жиров, перистальтика, бактерицидность<\/td>\n<td>Усвоение жиров, витаминов, аминокислот и сахаров; здоровая микрофлора; регулярный стул<\/td>\n<\/tr>\n<tr>\n<td><strong>Ферменты тонкой кишки<\/strong><\/td>\n<td>Пристеночное пищеварение на щёточной кайме (до 200 м²): сахароза, лактоза, изомальтоза, пептиды и др.<\/td>\n<td>Нет брожения и дефицитов, ритмичный стул<\/td>\n<\/tr>\n<tr>\n<td><strong>Толстая кишка<\/strong><\/td>\n<td>Вода, электролиты, витамины K и B; каловые массы; иммунный надзор; ~100 трлн бактерий: клетчатка, витамины, КЖК, связь с мозгом и кожей<\/td>\n<td>Сформированный стул, низкое воспаление, нет патогенов, здоровье всего организма<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<div class=\"lt-note\"><strong>Когда есть?<\/strong> По голоду. Голод — природный регулятор пищевого поведения; полное отсутствие голода опасно. Голодом и насыщением можно управлять: питанием, композицией приёмов пищи, режимом, работой со стрессом и микробиотой.<\/div>\n<h4>Чек-лист здорового пищеварения<\/h4>\n<p><strong>Это не идеал, а ориентир:<\/strong> если есть 80–90 % пунктов — ЖКТ работает хорошо.<\/p>\n<ul class=\"lt-check\"><li>Голод и насыщение приходят естественно и вовремя<\/li><li>Нет постоянной тяги к сладкому, мучному<\/li><li>Здоровый вес<\/li><li>Пища переваривается без тяжести<\/li><li>Нет хронического вздутия, урчания, отрыжки, изжоги<\/li><li>Стул ежедневный, оформленный, без боли (1–3 раза в день)<\/li><li>Кожа чистая, энергия стабильна, настроение ровное<\/li><\/ul>",
 "infl2_5": "<h4>Главное за 1 минуту<\/h4>\n<div class=\"lt-note\">ЖКТ не работает сам по себе. <strong>Ключевой регулятор его работы — нервная система.<\/strong> Поэтому проблемы с пищеварением могут возникать не от еды, а от стресса, недосыпа, спешки и эмоций.<\/div>\n<h4>Три «этажа» управления ЖКТ<\/h4>\n<div class=\"lt-tbl\"><table>\n<thead>\n<tr>\n<th><strong>Этаж<\/strong><\/th>\n<th><strong>Чем управляет<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Головной мозг<\/strong><\/td>\n<td>Аппетит, голод, насыщение, пищевое поведение и привычки (питание «по часам» или хаотично, заедание эмоций, еда или отказ от еды на стрессе)<\/td>\n<\/tr>\n<tr>\n<td><strong>Вегетативная нервная система<\/strong><\/td>\n<td>Работает автономно. Симпатика и парасимпатика включаются по очереди, как газ и тормоз<\/td>\n<\/tr>\n<tr>\n<td><strong>Энтеральная (метасимпатическая) нервная система<\/strong><\/td>\n<td>«Местный мозг кишечника» в стенках ЖКТ: перистальтика, слизь и ферменты, реакция на объём и состав пищи, местный иммунитет. Может работать автономно<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h4>Симпатика и парасимпатика<\/h4>\n<div class=\"lt-tbl\"><table>\n<tbody>\n<tr>\n<td><h4>Парасимпатика: «спи, переваривай, отдыхай»<\/h4>\n<p>✔ усиливает перистальтику<\/p>\n<p>✔ активирует слюну, кислоту, желчь, ферменты<\/p>\n<p>✔ расширяет сосуды ЖКТ<\/p>\n<h4>→ пищеварение улучшается<\/h4><\/td>\n<td><h4>Симпатика: «бей, беги, работай»<\/h4>\n<p>✔ уменьшает секрецию<\/p>\n<p>✔ замедляет перистальтику<\/p>\n<p>✔ сужает сосуды ЖКТ<\/p>\n<h4>→ пищеварение «встаёт»<\/h4><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<div class=\"lt-tbl\"><table>\n<thead>\n<tr>\n<th><strong>Включает симпатику<\/strong><\/th>\n<th><strong>Включает парасимпатику<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Острый и хронический стресс, тревога<\/td>\n<td>Спокойствие и чувство безопасности<\/td>\n<\/tr>\n<tr>\n<td>Холод, голод, скачки сахара<\/td>\n<td>Сон в достаточном количестве (7–9 ч)<\/td>\n<\/tr>\n<tr>\n<td>Кофеин, крепкий чай, энергетики<\/td>\n<td>Тепло: ванна, душ, тёплая еда и напитки<\/td>\n<\/tr>\n<tr>\n<td>Еда на бегу, спешка, многозадачность<\/td>\n<td>Глубокое медленное дыхание<\/td>\n<\/tr>\n<tr>\n<td>Недосыпание, поздний отход ко сну<\/td>\n<td>Прогулки, спокойная ритмичная активность, йога<\/td>\n<\/tr>\n<tr>\n<td>Шум, яркий свет, громкие звуки<\/td>\n<td>Тишина, мягкий свет, природа<\/td>\n<\/tr>\n<tr>\n<td>Интенсивные тренировки<\/td>\n<td>Медитация, молитва, чтение, творчество, музыка<\/td>\n<\/tr>\n<tr>\n<td>Новости, соцсети, экраны перед сном<\/td>\n<td>Тёплая мягкая еда, осознанная спокойная трапеза<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<div class=\"lt-note\"><strong>Нужны обе системы.<\/strong> Проблема в том, что современный образ жизни чаще включает симпатику. Напрямую управлять ею нельзя, но косвенно — через образ жизни — можно.<\/div>\n<h4>Что помогает «местному мозгу» кишечника<\/h4>\n<p>Подходящий состав пищи (жиры, белки, клетчатка), низкий уровень воспаления, здоровая микробиота, меньше хронического стресса, движение, осанка и диафрагмальное дыхание.<\/p>\n<h4>Стресс и ЖКТ<\/h4>\n<p><strong>Прямая связь со стрессом:<\/strong> синдром раздражённого кишечника, язвенная болезнь желудка и 12-перстной кишки («стресс-язва»), гастрит, функциональная диспепсия, ГЭРБ, дискинезия желчевыводящих путей.<\/p>\n<p><strong>Как проявляется:<\/strong> «узел» в животе, ком в горле, диарея («медвежья болезнь») или запоры («запор путешественника»), вздутие, тяга к сладкому и жирному, переедание или отказ от еды.<\/p>\n<div class=\"lt-note\"><strong>Контроль стресса — важная часть профилактики нарушений ЖКТ при любом типе пищеварения, особенно при чувствительном и воспалённом.<\/strong><\/div>",
 "infl2_6": "<h4>Главное за 1 минуту<\/h4>\n<div class=\"lt-note\"><strong>6 универсальных привычек режима дня<\/strong> нужны при любом типе пищеварения — вялом, чувствительном, воспалённом. Они налаживают выработку соков, снижают хронический стресс, улучшают усвоение и энергию. Это фронт работ на ближайшую неделю.<\/div>\n<h4>1. Сон вовремя: 22:00–02:00<\/h4>\n<figure class=\"lt-clock\"><img src=\"materials/infl/img/son_gormony.webp\" alt=\"Мелатонин 22:00–02:00, соматотропный гормон 23:00–02:00\" loading=\"lazy\"><\/figure>\n<div class=\"lt-tbl\"><table>\n<thead>\n<tr>\n<th><strong>Гормон<\/strong><\/th>\n<th><strong>Что делает для ЖКТ<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Мелатонин<\/strong> (шишковидная железа, 22:00–02:00)<\/td>\n<td>Защитный слой слизистых, заживление язв и эрозий, меньше избытка кислоты, профилактика ГЭРБ, меньше воспаления, рост полезных бактерий, местный иммунитет, барьерная функция кишечника, меньше боли при СРК, защита от оксидативного стресса<\/td>\n<\/tr>\n<tr>\n<td><strong>Соматотропный гормон<\/strong> (гипофиз, 23:00–02:00)<\/td>\n<td>Восстановление и регенерация слизистой, больше ферментов поджелудочной, нормальная перистальтика, всасывание аминокислот, глюкозы и жиров, меньше воспаления при ВЗК, влияние на микробиоту, защита при стрессе<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Бонус:<\/strong> к 23:00 активизируется грелин (гормон голода) — если вы уже спите, вечернего «жора» не будет.<\/p>\n<p><strong>Как уложить себя вовремя:<\/strong> приглушённый тёплый свет; яркость экранов ниже за 1–2 часа до сна или фильтр синего; тёплый душ или ванночка для ног; дыхание животом; тёплый травяной чай (мелисса, ромашка) или кипячёное молоко; подъём в 06:00–07:00; днём с 10:00 до 14:00 — 20–30 минут на ярком свету.<\/p>\n<div class=\"lt-note\"><strong>Без налаженного сна<\/strong> справиться с чувствительным и воспалённым типом пищеварения очень сложно: ЖКТ восстанавливается главным образом во сне.<\/div>\n<h4>2. Достаточно сна: не менее 7–8 часов<\/h4>\n<p>Во сне работает парасимпатика — ЖКТ восстанавливается. Недосып включает симпатику и тревожность. Для сна — <strong>тишина, темнота, прохлада<\/strong>, при храпе партнёра — спать отдельно. <strong>Недоспали — ешьте чуть меньше обычного.<\/strong><\/p>\n<h4>3. Движение: 30–60 минут в день<\/h4>\n<p>Непрерывная активность низкой или средней интенсивности: прогулка, бег трусцой, велосипед, лыжи, танцы, йога, пилатес. Улучшает иннервацию и кровоток в ЖКТ, перистальтику, отток желчи. Без спешки и напряжения.<\/p>\n<h4>4. Ритмичность приёмов пищи<\/h4>\n<p>Хаос и кусочничество сбивают гормоны голода и насыщения — соки выделяются не вовремя. Нужны <strong>чёткие завтрак, обед, ужин (и перекусы) в одно и то же время<\/strong>.<\/p>\n<div class=\"lt-ins\"><strong>Задание:<\/strong> выпишите свой идеальный ритм питания — сколько раз и когда едите, объём, когда приходит голод, сколько держится сытость, комфортно ли после еды.<\/div>\n<h4>5. Тепло перед едой и во время еды<\/h4>\n<p>Крупные приёмы пищи — тёплые или горячие, напитки до и во время еды — температуры тела или выше. Тепло включает парасимпатику.<\/p>\n<h4>6. Во время еды — фокус на еде<\/h4>\n<p>Без телефона, новостей, ТВ и спешки. Замедлиться перед едой, почувствовать запах и вкус, полюбоваться тарелкой, красиво сервировать стол. Лучше вкус — лучше соки и быстрее насыщение.<\/p>\n<h4>Чек-лист на неделю<\/h4>\n<ul class=\"lt-check\"><li>Ложусь так, чтобы спать с 22:00 до 02:00<\/li><li>Сплю не менее 7–8 часов<\/li><li>Двигаюсь 30–60 минут в день<\/li><li>Ем в одно и то же время, без кусочничества<\/li><li>Ем тёплую еду, пью тёплые напитки<\/li><li>Во время еды — фокус на еде<\/li><\/ul>",
 "infl2_7": "<h4>Главное за 1 минуту<\/h4>\n<div class=\"lt-note\">Перед активной работой с ЖКТ (фитосоставы, специи, рацион, микробиота) его нужно подготовить: мягко почистить и снизить воспалительный фон. Инструмент — <strong>сорбенты<\/strong>: как губка, они связывают в кишечнике и выводят бактериальные токсины, избыток жёлчных кислот, непереваренные остатки, аллергены, соли тяжёлых металлов, пищевой холестерин, продукты воспаления, метаболиты гормонов.<\/div>\n<h4>Правила приёма<\/h4>\n<ul class=\"lt-check\"><li><strong>Интервал 1,5–2 часа<\/strong> с лекарствами и нутрицевтиками<\/li><li><strong>4–5 дней<\/strong> — не для длительного применения<\/li><li><strong>+2 стакана жидкости в день<\/strong>: один — запить сорбент, второй — через 30–60 минут<\/li><li><strong>Склонность к запорам<\/strong> — подготовьте свечку с глицерином или микроклизму<\/li><\/ul>\n<h4>Что не подходит при воспалённом пищеварении<\/h4>\n<p>Активированный уголь, «Полисорб», белый уголь, отруби, глина, кислый (яблочный) пектин. При лактазной недостаточности — осторожно с формами «Смекты», «Фильтрума», «Энтеросгеля» со вкусовыми добавками: читайте состав на лактозу.<\/p>\n<h4>Мягкие сорбенты: выберите один<\/h4>\n<div class=\"lt-tbl\"><table>\n<thead>\n<tr>\n<th><strong>Вариант<\/strong><\/th>\n<th><strong>Как принимать<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Кисели<\/strong><\/td>\n<td>Льняной (из семян или муки) или овсяный — рецепты в уроках 1-й недели<\/td>\n<\/tr>\n<tr>\n<td><strong>Псиллиум<\/strong><\/td>\n<td>1 ч. л. на стакан тёплой воды, настоять 10 минут, выпить вместе с гелем через 1,5–2 часа после еды или вечером<\/td>\n<\/tr>\n<tr>\n<td><strong>Семена чиа<\/strong><\/td>\n<td>1–2 ч. л. на 100–150 мл тёплой воды или компота из чернослива (можно пюре из сливы), настоять 10 минут, пить через 1,5–2 часа после еды или вечером<\/td>\n<\/tr>\n<tr>\n<td><strong>«Зостерин»<\/strong><\/td>\n<td>Некислый пектин из взморника, мягкий, селективная сорбция, не влияет на микрофлору<\/td>\n<\/tr>\n<tr>\n<td><strong>«Оптифайбер»<\/strong><\/td>\n<td>Мягкая клетчатка из циамопсиса, можно применять длительно как источник клетчатки<\/td>\n<\/tr>\n<tr>\n<td><strong>Рисовый суп-детокс<\/strong><\/td>\n<td>На ужин. Не подходит при выраженной инсулинорезистентности и сильном вздутии на крупы<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h4>Рисовый суп-детокс<\/h4>\n<p><strong>30 г<\/strong> риса басмати или жасмин промыть, замочить на час, снова промыть. Залить <strong>400 мл<\/strong> воды, довести до кипения, добавить куркуму на кончике ножа, щепотку зиры, 2 лавровых листа, соль. Варить <strong>20 минут<\/strong> на очень слабом огне — суп останется полужидким. Есть на ужин; можно с приготовленными овощами или салатом с нерафинированным маслом.<\/p>\n<div class=\"lt-note\"><strong>Мягкие сорбенты 4–5 дней + больше жидкости = ЖКТ готов к работе.<\/strong><\/div>",
 "infl2_8": "<h4>Схема питья на всю программу<\/h4>\n<div class=\"lt-tbl\"><table>\n<thead>\n<tr>\n<th><strong>Когда<\/strong><\/th>\n<th><strong>Что и сколько<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Утром до завтрака<\/strong><\/td>\n<td>1–2 кружки тёплой кипячёной воды (ТКВ)<\/td>\n<\/tr>\n<tr>\n<td><strong>До или во время обеда и ужина<\/strong><\/td>\n<td>По 1 кружке ТКВ<\/td>\n<\/tr>\n<tr>\n<td><strong>Между приёмами пищи<\/strong><\/td>\n<td>Кисель — 1–2 кружки (больше при выраженном воспалении)<\/td>\n<\/tr>\n<tr>\n<td><strong>В любое время, можно на перекус<\/strong><\/td>\n<td>Противовоспалительный травяной чай — 1–2 кружки в день<\/td>\n<\/tr>\n<tr>\n<td><strong>В течение дня<\/strong><\/td>\n<td>Другие напитки — по желанию<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h4>Тёплая кипячёная вода<\/h4>\n<p><strong>35–45 °C<\/strong> — тёплая, но не обжигающая; можно теплее, если комфортно. <strong>3–4 стакана<\/strong> в день и больше по жажде. Стимулирует перистальтику, снимает спазмы, улучшает кровоток в ЖКТ. Кипячение убирает бактерии, снижает соли и хлор; тепло щадит слизистую.<\/p>\n<p><strong>Лайфхак:<\/strong> вскипятить воду с вечера в термос. Для вкуса — огурец, мята; ягоды и лимон — если переносите кислое.<\/p>\n<h4>Противовоспалительные чаи<\/h4>\n<div class=\"lt-tbl\"><table>\n<thead>\n<tr>\n<th><strong>Чай<\/strong><\/th>\n<th><strong>Состав<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Для печени и ЖКТ<\/strong><\/td>\n<td>Сафлор, кориандр, орегано<\/td>\n<\/tr>\n<tr>\n<td><strong>Успокаивающий для кишечника<\/strong><\/td>\n<td>Ромашка, бадьян, орегано, мята<\/td>\n<\/tr>\n<tr>\n<td><strong>Мягкий желчегонный<\/strong><\/td>\n<td>Тысячелистник, календула, ромашка<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Рецепты — в материалах 1-й недели. Тёплыми, 1–2 кружки в день. Подсластитель — по вкусу, но лучше не мёд: может раздражать слизистую.<\/p>\n<div class=\"lt-note\"><strong>Сафлор ≠ шафран!<\/strong> Сафлора можно щепотку. Если купили шафран — только 7–10 нитей на чашку, не щепотку.<\/div>\n<h4>Кисели<\/h4>\n<p>Овсяный или льняной (рецепты в 1-й неделе). Защищают слизистую от кислоты, ферментов и раздражающей пищи. Тёплыми, 1–2 кружки в день между приёмами пищи.<\/p>\n<h4>Ограничить / можно вместо<\/h4>\n<div class=\"lt-tbl\"><table>\n<thead>\n<tr>\n<th><strong>Ограничить — могут вызвать рефлюкс и раздражение<\/strong><\/th>\n<th><strong>Можно вместо<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Кофе, крепкий чёрный чай, пуэр<\/td>\n<td>Некрепкий чёрный чай, ферментированный иван-чай<\/td>\n<\/tr>\n<tr>\n<td>Зелёный чай, матча<\/td>\n<td>Какао с животным или растительным молоком<\/td>\n<\/tr>\n<tr>\n<td>Газированные напитки, шампанское<\/td>\n<td>Компоты из сухофруктов<\/td>\n<\/tr>\n<tr>\n<td>Кислые соки и напитки, алкоголь<\/td>\n<td>—<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<div class=\"lt-note\"><strong>ТКВ + противовоспалительные чаи + кисели — уже достаточный объём жидкости. Начинайте сегодня.<\/strong><\/div>",
 "slow1_1": "<h4>Главное за 1 минуту<\/h4>\n<div class=\"lt-note\"><strong>Вялый тип пищеварения<\/strong> — не диагноз, а собирательный термин для сниженной активности ЖКТ: пища переваривается медленно и некачественно. В основе — медленное опорожнение желудка, недостаток желудочного сока, ферментов и желчи, слабый тонус и моторика, брожение в кишечнике, нарушение нервной регуляции.<\/div>\n<h4>Признаки<\/h4>\n<p><strong>Основные:<\/strong> тяжесть после еды; слабые тупые боли в правом подреберье; вздутие сразу после еды; газы после любой еды и прохладных напитков; еда «долго стоит», ком в желудке; изжога на мучное, сладкое, крахмалистое; отрыжка; тошнота на жирное или белковое; запоры (иногда диарея); тонкий белый налёт на языке.<\/p>\n<p><strong>Дополнительно:<\/strong> ком в горле, заложенность носа, сонливость и упадок сил, сниженный аппетит утром, тяга к кислому и острому, отёки, кандидоз, повышенный холестерин. Часто усиливаются в холодное время года.<\/p>\n<h4>Характерные диагнозы<\/h4>\n<div class=\"lt-tbl\"><table>\n<thead>\n<tr>\n<th><strong>Функциональные<\/strong><\/th>\n<th><strong>Органические<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Диспепсия; дискинезия ЖВП по гипокинетическому типу; функциональная изжога; сладж жёлчного пузыря; ферментопатия; атонический запор<\/td>\n<td>Гастрит с пониженной кислотностью; H. pylori; атрофический гастрит; диффузные изменения или липоматоз поджелудочной железы<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h4>Риски<\/h4>\n<p>Дефициты белка, железа, B12 и др.; дисбиоз; желчнокаменная болезнь; жировая болезнь печени; переход в воспалённый тип; метаплазия кишечного типа в желудке (<strong>каскад Корреа<\/strong>: норма → гастрит → атрофия → кишечная метаплазия → в небольшом проценте случаев онкология).<\/p>\n<div class=\"lt-note\"><strong>Опасность — в отсутствии острых болей:<\/strong> проблемы могут развиваться годами незаметно. Обследование лучше не пропускать.<\/div>\n<h4>Обследования (необязательно для программы)<\/h4>\n<div class=\"lt-tbl\"><table>\n<thead>\n<tr>\n<th><strong>Обследование<\/strong><\/th>\n<th><strong>Что показывает<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>УЗИ брюшной полости<\/strong><\/td>\n<td>Печень, поджелудочная, жёлчный: сладж, стенки, полипы<\/td>\n<\/tr>\n<tr>\n<td><strong>«Гастропанель» (кровь)<\/strong><\/td>\n<td>Пепсиногены, гастрин-17, антитела к H. pylori: атрофия, кислотность, инфекция<\/td>\n<\/tr>\n<tr>\n<td><strong>ФГДС с биопсией<\/strong><\/td>\n<td>Слизистая, воспаление, H. pylori; под седацией<\/td>\n<\/tr>\n<tr>\n<td><strong>24-часовая pH-метрия<\/strong><\/td>\n<td>Кислотность, ГЭРБ, частота рефлюксов<\/td>\n<\/tr>\n<tr>\n<td><strong>АЛТ, АСТ, ГГТ, ЩФ, билирубин<\/strong><\/td>\n<td>Печень и желчевыводящие пути<\/td>\n<\/tr>\n<tr>\n<td><strong>Общий белок, альбумин<\/strong><\/td>\n<td>Усвоение белка<\/td>\n<\/tr>\n<tr>\n<td><strong>ОАК, ферритин, B12, фолиевая к-та<\/strong><\/td>\n<td>Дефицит железа и кофакторов<\/td>\n<\/tr>\n<tr>\n<td><strong>Кал на панкреатическую эластазу<\/strong><\/td>\n<td>Выработка ферментов поджелудочной<\/td>\n<\/tr>\n<tr>\n<td><strong>Копрограмма<\/strong><\/td>\n<td>Общая оценка отделов ЖКТ (дополнительно)<\/td>\n<\/tr>\n<tr>\n<td><strong>Водородно-дыхательный тест<\/strong><\/td>\n<td>СИБР, непереносимость лактозы, фруктозы<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Точный список назначает и результаты оценивает <strong>врач-гастроэнтеролог<\/strong>.<\/p>\n<h4>Цель и методы программы (5 недель)<\/h4>\n<p><strong>Цель:<\/strong> восстановить моторику ЖКТ и желчевыделение, поддержать слизистые, улучшить переваривание и всасывание, наладить нервную регуляцию, повысить энергию и качество жизни.<\/p>\n<p><strong>Методы:<\/strong> режим дня → регуляция нервной системы → коррекция питания (убрать мешающее, добавить продукты-стимуляторы) → полноценное меню → специи и травы → домашние процедуры.<\/p>\n<div class=\"lt-ins\"><strong>Задание: посмотрите другие уроки первой недели, проверьте запасы трав и специй, приготовьте заготовки. Со следующей недели — активная работа.<\/strong><\/div>",
 "slow2_2": "<h4>Главное за 1 минуту<\/h4>\n<div class=\"lt-note\"><p><strong>Вялое пищеварение<\/strong> — снижение активности ЖКТ, «гаснущий пищеварительный огонь». Формируется обычно <strong>совокупностью факторов<\/strong>, а каждая жалоба указывает на конкретный отдел ЖКТ и процесс.<\/p>\n<p><strong>Задание:<\/strong> отметьте, какие из 12 причин актуальны для вас, и напишите в комментариях. Утром, лёжа, мягко прощупайте живот справа и слева — так можно понять свой тип запора.<\/p><\/div>\n<h4>12 причин вялого пищеварения<\/h4>\n<div class=\"lt-tbl\"><table>\n<thead>\n<tr>\n<th><strong>Образ жизни и питание<\/strong><\/th>\n<th><strong>Состояния и другие факторы<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1. Хронический стресс, переутомление, недосып, позднее засыпание<\/td>\n<td>7. Длительное хроническое воспаление ЖКТ (гастриты и др.)<\/td>\n<\/tr>\n<tr>\n<td>2. Сидячий образ жизни, гиподинамия, плохая осанка<\/td>\n<td>8. Бариатрическая операция<\/td>\n<\/tr>\n<tr>\n<td>3. Избыток холодного, сладкого, тяжёлого, мучного, обволакивающего<\/td>\n<td>9. Гипотиреоз, депрессия, вегетативная дисфункция, неврозы, СД 2 типа<\/td>\n<\/tr>\n<tr>\n<td>4. Строгие диеты → дефицит B1 и др. витаминов B, магния, железа, цинка<\/td>\n<td>10. Лекарства: антациды, ИПП, антидепрессанты, бета-блокаторы<\/td>\n<\/tr>\n<tr>\n<td>5. Мало жиров, клетчатки, горького, кислого, ферментированного, экстрактивных веществ<\/td>\n<td>11. Старение<\/td>\n<\/tr>\n<tr>\n<td>6. Переедание, еда на ночь, лежать после еды, купание в холодной воде<\/td>\n<td>12. Конституция с преобладанием доши Слизь / Капха<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h4>Жалоба → что за ней стоит<\/h4>\n<div class=\"lt-tbl\"><table>\n<thead>\n<tr>\n<th><strong>Где<\/strong><\/th>\n<th><strong>Жалоба<\/strong><\/th>\n<th><strong>Причина / возможные диагнозы<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Язык<\/td>\n<td>Тонкий белый налёт<\/td>\n<td>Замедленное переваривание; густой — дисбиоз<\/td>\n<\/tr>\n<tr>\n<td>Язык<\/td>\n<td>Отпечатки зубов<\/td>\n<td>Отёчность: слабая функция поджелудочной и щитовидной<\/td>\n<\/tr>\n<tr>\n<td>Желудок<\/td>\n<td>Тяжесть, переполненность, еда «стоит»<\/td>\n<td>Медленная эвакуация (до 10 ч вместо 20 мин–4 ч), низкая кислотность; диспепсия, атрофический гастрит, гастропарез<\/td>\n<\/tr>\n<tr>\n<td>Желудок<\/td>\n<td>Отрыжка<\/td>\n<td>Несмыкание нижнего пищеводного сфинктера; ГЭРБ<\/td>\n<\/tr>\n<tr>\n<td>Желудок<\/td>\n<td>Изжога на мучное, сладкое, крахмалистое<\/td>\n<td>Рефлюкс; ГЭРБ, низкая кислотность, гастропарез<\/td>\n<\/tr>\n<tr>\n<td>Желудок<\/td>\n<td>Слабые ноющие боли<\/td>\n<td>Функциональная диспепсия с гиперчувствительностью<\/td>\n<\/tr>\n<tr>\n<td>Правое подреберье<\/td>\n<td>Слабые тупые боли<\/td>\n<td>Застой желчи; гипокинетическая дискинезия ЖВП, сладж, холецистит без камней; риск камней<\/td>\n<\/tr>\n<tr>\n<td>Вокруг пупка<\/td>\n<td>Вздутие через 30–60 мин после еды<\/td>\n<td>Мало ферментов поджелудочной и кишечника, желчи; непереносимости<\/td>\n<\/tr>\n<tr>\n<td>Толстая кишка<\/td>\n<td>Вздутие во второй половине дня<\/td>\n<td>СРК, дисбиоз<\/td>\n<\/tr>\n<tr>\n<td>Толстая кишка<\/td>\n<td>Запор<\/td>\n<td>Атонический (застой справа, стул раз в 2–3 дня) или спастический (дискомфорт слева, «катышки»)<\/td>\n<\/tr>\n<tr>\n<td>Кишечник<\/td>\n<td>Диарея, несформированный стул<\/td>\n<td>Недостаток ферментов тонкой кишки и поджелудочной<\/td>\n<\/tr>\n<tr>\n<td>Кишечник<\/td>\n<td>Газы от клетчатки<\/td>\n<td>Чувствительный тип / СРК, дисбиоз, избыток грубой клетчатки<\/td>\n<\/tr>\n<tr>\n<td>—<\/td>\n<td>Тошнота на жирное / белковое; от голода, стресса<\/td>\n<td>Медленная эвакуация, нехватка ферментов, дискинезия ЖВП; при голоде и стрессе — нейрогастроэнтерологические нарушения<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>",
 "slow2_3": "<h4>Главное за 1 минуту<\/h4>\n<div class=\"lt-note\"><p>Каждый организм уникален, и отклик тела на еду, специи, фитосоставы тоже. Чтобы собрать свою формулу ЖКТ, на программе используем <strong>два инструмента<\/strong>:<\/p>\n<ul>\n<li><strong>Дневник симптомов и ощущений<\/strong> — связь еды и режима питания с ощущениями;<\/li>\n<li><strong>Трекер самочувствия<\/strong> — как меняется самочувствие в целом по дням недели.<\/li>\n<\/ul><\/div>\n<h4>Тест «Где вы сейчас?»<\/h4>\n<div class=\"lt-tbl\"><table>\n<thead>\n<tr>\n<th><strong>Вопрос<\/strong><\/th>\n<th><strong>5 баллов<\/strong><\/th>\n<th><strong>3 балла<\/strong><\/th>\n<th><strong>1 балл<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Часто замечаете связь между едой и самочувствием?<\/td>\n<td>Всегда<\/td>\n<td>Иногда<\/td>\n<td>Никогда<\/td>\n<\/tr>\n<tr>\n<td>Что делаете при тяжести после еды?<\/td>\n<td>Анализирую, что съел(а)<\/td>\n<td>Пью таблетку<\/td>\n<td>Игнорирую<\/td>\n<\/tr>\n<tr>\n<td>Как часто отслеживаете стул?<\/td>\n<td>Ежедневно<\/td>\n<td>Редко<\/td>\n<td>Никогда<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>12–15<\/strong> — вы детектив своего здоровья. <strong>6–11<\/strong> — вы на пути: заполняйте Дневник и Трекер. <strong>3–5<\/strong> — время начать диалог с телом, сегодня.<\/p>\n<h4>Дневник: что и как записывать<\/h4>\n<p><strong>Отслеживаем:<\/strong> регулярность приёмов пищи; аппетит и тягу к еде; стул (регулярность, частота, тип); качество и продолжительность сна (засыпание, просыпания); энергию в течение дня; настроение и стресс; ваши симптомы (кожа, давление, головные боли).<\/p>\n<ul>\n<li><strong>1–2 раза в день<\/strong> (утро и/или вечер), но каждый день.<\/li>\n<li><strong>Честность важнее «как правильно»<\/strong> — записывайте и кусочничество, и тягу к сладкому.<\/li>\n<li><strong>Фокус на паттерны<\/strong>, а не на единичные случаи (стресс утром → тяга к сладкому днём).<\/li>\n<li><strong>Колонки:<\/strong> приём пищи и время → блюда/напитки (можно фотографировать еду днём) → ощущения. Отдельно — стул и сон.<\/li>\n<\/ul>\n<h4>Трекер: формат и шкала<\/h4>\n<div class=\"lt-tbl\"><table>\n<thead>\n<tr>\n<th><strong>Формат<\/strong><\/th>\n<th><strong>Шкала (выберите одну)<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Бумажный<\/strong> — распечатка или от руки, со своими значками (лампочка — энергия, «zzz» — сон)<\/td>\n<td><strong>Баллы 1–10<\/strong>: 1 — очень плохо, 10 — отлично<\/td>\n<\/tr>\n<tr>\n<td><strong>Цифровой<\/strong> — Google/Excel с автоподсчётом, удобно вносить с телефона сразу<\/td>\n<td><strong>Смайлики<\/strong>: хорошо / нормально / трудный день<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><strong>Цвет<\/strong>: зелёный — отлично, жёлтый — умеренный дискомфорт, красный — симптом<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Строки — дни недели, столбцы — ваши параметры (аппетит, тяга к сладкому, еда после 20:00, стул, сон, энергия, ваш симптом). В конце — <strong>итог дня<\/strong> и <strong>итог недели<\/strong>. Женщинам — отмечать день цикла.<\/p>\n<h4>Анализ в конце недели: 3 шага<\/h4>\n<ol>\n<li><strong>Ищите связи.<\/strong> Триггеры ухудшений (бананы → вздутие; недосып → тяга к сладкому) и факторы улучшений (бульон на ужин → лёгкий стул утром).<\/li>\n<li><strong>Сравните лучший и худший день.<\/strong> Что ели, как спали, какие эмоции? Какие симптомы были и что «ДО» могло их вызвать? Какие триггеры повторяются в «красные» дни?<\/li>\n<li><strong>Создавайте заметки.<\/strong> «Когда я ем ___, в животе ___ и энергия ___»; «Когда я ем/пью ___, хожу в туалет лучше/хуже»; замены: кофе натощак → изжога → цикорий или чай из программы.<\/li>\n<\/ol>\n<div class=\"lt-note\"><strong>Вопрос себе: «Что ЛУЧШЕЕ из этого дня я могу повторить завтра?»<\/strong><\/div>\n<h4>Запомнить: Дневник и Трекер — это эксперимент<\/h4>\n<div class=\"lt-tbl\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th><strong>Правило<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>7<\/strong><\/td>\n<td>дней трекинга — минимум для выявления паттернов<\/td>\n<\/tr>\n<tr>\n<td><strong>3+<\/strong><\/td>\n<td>параметра — минимум для комплексной оценки<\/td>\n<\/tr>\n<tr>\n<td><strong>Анализ<\/strong><\/td>\n<td>лучшего и худшего дня → план на следующую неделю<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>",
 "slow2_4": "<h4>Главное за 1 минуту<\/h4>\n<div class=\"lt-note\"><p><strong>Здоровье ЖКТ = здоровье всего тела.<\/strong> Пищеварение влияет на поступление питательных веществ, энергию и митохондрии, мозг и нервную систему, печень, уровень воспаления, сон и настроение, кожу и суставы, репродуктивное здоровье, иммунитет.<\/p>\n<p><strong>ЖКТ — последовательный конвейер.<\/strong> Пища механически и химически обрабатывается, мелкие молекулы всасываются в кровь и лимфу. Все отделы работают в связке, как оркестр: сбой в одном звене влияет на всё пищеварение.<\/p><\/div>\n<h4>Этапы пищеварения<\/h4>\n<div class=\"lt-tbl\"><table>\n<thead>\n<tr>\n<th><strong>Этап<\/strong><\/th>\n<th><strong>Что происходит<\/strong><\/th>\n<th><strong>Хорошая работа — это<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Мозг<\/strong><\/td>\n<td>Пищевой центр гипоталамуса. Голод: состав крови, сигналы нервов ЖКТ, вид/запах/мысли о еде → запуск соков. Насыщение: наполнение желудка, состав пищи, гормоны ЖКТ и лептин, осознанная еда<\/td>\n<td>Голод и насыщение приходят естественно и вовремя<\/td>\n<\/tr>\n<tr>\n<td><strong>Рот<\/strong><\/td>\n<td>Анализ вкуса; слюна: размягчение, лизоцим, начало переваривания углеводов; жевание, глотание<\/td>\n<td>Сигнал желудку и поджелудочной готовить соки<\/td>\n<\/tr>\n<tr>\n<td><strong>Желудок<\/strong><\/td>\n<td>3 слоя мышц перемешивают пищу; соляная кислота (pH ≈ 1), пепсин и др.; первичное расщепление белков; транспортные белки для железа и B12; бактерицидная обработка; защитный муцин<\/td>\n<td>Расщепление белков; усвоение железа, B12, кальция, цинка, магния, меди; барьер от инфекций; нет тяжести, болей, изжоги, отрыжки<\/td>\n<\/tr>\n<tr>\n<td><strong>Тонкая кишка (7–8 м)<\/strong><\/td>\n<td>12-перстная — переваривание; тощая — всасывание; подвздошная — B12 и транзит. Работают желчь, ферменты поджелудочной и кишечника<\/td>\n<td>Мелкие молекулы всасываются через избирательно проницаемую стенку<\/td>\n<\/tr>\n<tr>\n<td><strong>Поджелудочная<\/strong><\/td>\n<td>Проферменты (липаза, протеаза, амилаза, трипсин, химотрипсин) под состав пищи, активируются в 12-перстной кишке; инсулин и глюкагон<\/td>\n<td>Полное переваривание БЖУ, усвоение ПНЖК и витаминов A, E, K, D; нет газов, вздутия, диареи<\/td>\n<\/tr>\n<tr>\n<td><strong>Желчь<\/strong><\/td>\n<td>Молодая (печёночная) → зрелая (пузырная). Щелочная среда, активация ферментов, эмульгация жиров, перистальтика, бактерицидность<\/td>\n<td>Усвоение жиров, витаминов, аминокислот и сахаров; здоровая микрофлора; регулярный стул<\/td>\n<\/tr>\n<tr>\n<td><strong>Ферменты тонкой кишки<\/strong><\/td>\n<td>Пристеночное пищеварение на щёточной кайме (до 200 м²): сахароза, лактоза, изомальтоза, пептиды и др.<\/td>\n<td>Нет брожения и дефицитов, ритмичный стул<\/td>\n<\/tr>\n<tr>\n<td><strong>Толстая кишка<\/strong><\/td>\n<td>Вода, электролиты, витамины K и B; каловые массы; иммунный надзор; ~100 трлн бактерий: клетчатка, витамины, КЖК, связь с мозгом и кожей<\/td>\n<td>Сформированный стул, низкое воспаление, нет патогенов, здоровье всего организма<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<div class=\"lt-note\"><strong>Когда есть?<\/strong> По голоду. Голод — природный регулятор пищевого поведения; полное отсутствие голода опасно. Голодом и насыщением можно управлять: питанием, композицией приёмов пищи, режимом, работой со стрессом и микробиотой.<\/div>\n<h4>Чек-лист здорового пищеварения<\/h4>\n<p><strong>Это не идеал, а ориентир:<\/strong> если есть 80–90 % пунктов — ЖКТ работает хорошо.<\/p>\n<ul class=\"lt-check\"><li>Голод и насыщение приходят естественно и вовремя<\/li><li>Нет постоянной тяги к сладкому, мучному<\/li><li>Здоровый вес<\/li><li>Пища переваривается без тяжести<\/li><li>Нет хронического вздутия, урчания, отрыжки, изжоги<\/li><li>Стул ежедневный, оформленный, без боли (1–3 раза в день)<\/li><li>Кожа чистая, энергия стабильна, настроение ровное<\/li><\/ul>",
 "slow2_5": "<h4>Главное за 1 минуту<\/h4>\n<div class=\"lt-note\"><strong>6 универсальных привычек режима дня<\/strong> нужны при любом типе пищеварения — вялом, чувствительном, воспалённом. Они налаживают выработку соков, снижают хронический стресс, улучшают усвоение и энергию. Это фронт работ на ближайшую неделю.<\/div>\n<h4>1. Сон вовремя: 22:00–02:00<\/h4>\n<figure class=\"lt-clock\"><img src=\"materials/infl/img/son_gormony.webp\" alt=\"Мелатонин 22:00–02:00, соматотропный гормон 23:00–02:00\" loading=\"lazy\"><\/figure>\n<div class=\"lt-tbl\"><table>\n<thead>\n<tr>\n<th><strong>Гормон<\/strong><\/th>\n<th><strong>Что делает для ЖКТ<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Мелатонин<\/strong> (шишковидная железа, 22:00–02:00)<\/td>\n<td>Защитный слой слизистых, заживление язв и эрозий, меньше избытка кислоты, профилактика ГЭРБ, меньше воспаления, рост полезных бактерий, местный иммунитет, барьерная функция кишечника, меньше боли при СРК, защита от оксидативного стресса<\/td>\n<\/tr>\n<tr>\n<td><strong>Соматотропный гормон<\/strong> (гипофиз, 23:00–02:00)<\/td>\n<td>Восстановление и регенерация слизистой, больше ферментов поджелудочной, нормальная перистальтика, всасывание аминокислот, глюкозы и жиров, меньше воспаления при ВЗК, влияние на микробиоту, защита при стрессе<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Бонус:<\/strong> к 23:00 активизируется грелин (гормон голода) — если вы уже спите, вечернего «жора» не будет.<\/p>\n<p><strong>Как уложить себя вовремя:<\/strong> приглушённый тёплый свет; яркость экранов ниже за 1–2 часа до сна или фильтр синего; тёплый душ или ванночка для ног; дыхание животом; тёплый травяной чай (мелисса, ромашка) или кипячёное молоко; подъём в 06:00–07:00; днём с 10:00 до 14:00 — 20–30 минут на ярком свету.<\/p>\n<div class=\"lt-note\"><strong>Без налаженного сна<\/strong> справиться с чувствительным и воспалённым типом пищеварения очень сложно: ЖКТ восстанавливается главным образом во сне.<\/div>\n<h4>2. Достаточно сна: не менее 7–8 часов<\/h4>\n<p>Во сне работает парасимпатика — ЖКТ восстанавливается. Недосып включает симпатику и тревожность. Для сна — <strong>тишина, темнота, прохлада<\/strong>, при храпе партнёра — спать отдельно. <strong>Недоспали — ешьте чуть меньше обычного.<\/strong><\/p>\n<h4>3. Движение: 30–60 минут в день<\/h4>\n<p>Непрерывная активность низкой или средней интенсивности: прогулка, бег трусцой, велосипед, лыжи, танцы, йога, пилатес. Улучшает иннервацию и кровоток в ЖКТ, перистальтику, отток желчи. Без спешки и напряжения.<\/p>\n<h4>4. Ритмичность приёмов пищи<\/h4>\n<p>Хаос и кусочничество сбивают гормоны голода и насыщения — соки выделяются не вовремя. Нужны <strong>чёткие завтрак, обед, ужин (и перекусы) в одно и то же время<\/strong>.<\/p>\n<div class=\"lt-ins\"><strong>Задание:<\/strong> выпишите свой идеальный ритм питания — сколько раз и когда едите, объём, когда приходит голод, сколько держится сытость, комфортно ли после еды.<\/div>\n<h4>5. Тепло перед едой и во время еды<\/h4>\n<p>Крупные приёмы пищи — тёплые или горячие, напитки до и во время еды — температуры тела или выше. Тепло включает парасимпатику.<\/p>\n<h4>6. Во время еды — фокус на еде<\/h4>\n<p>Без телефона, новостей, ТВ и спешки. Замедлиться перед едой, почувствовать запах и вкус, полюбоваться тарелкой, красиво сервировать стол. Лучше вкус — лучше соки и быстрее насыщение.<\/p>\n<h4>Чек-лист на неделю<\/h4>\n<ul class=\"lt-check\"><li>Ложусь так, чтобы спать с 22:00 до 02:00<\/li><li>Сплю не менее 7–8 часов<\/li><li>Двигаюсь 30–60 минут в день<\/li><li>Ем в одно и то же время, без кусочничества<\/li><li>Ем тёплую еду, пью тёплые напитки<\/li><li>Во время еды — фокус на еде<\/li><\/ul>",
 "slow2_6": "<h4>Главное за 1 минуту<\/h4>\n<div class=\"lt-note\">ЖКТ не работает сам по себе. <strong>Ключевой регулятор его работы — нервная система.<\/strong> Поэтому проблемы с пищеварением могут возникать не от еды, а от стресса, недосыпа, спешки и эмоций.<\/div>\n<h4>Три «этажа» управления ЖКТ<\/h4>\n<div class=\"lt-tbl\"><table>\n<thead>\n<tr>\n<th><strong>Этаж<\/strong><\/th>\n<th><strong>Чем управляет<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Головной мозг<\/strong><\/td>\n<td>Аппетит, голод, насыщение, пищевое поведение и привычки (питание «по часам» или хаотично, заедание эмоций, еда или отказ от еды на стрессе)<\/td>\n<\/tr>\n<tr>\n<td><strong>Вегетативная нервная система<\/strong><\/td>\n<td>Работает автономно. Симпатика и парасимпатика включаются по очереди, как газ и тормоз<\/td>\n<\/tr>\n<tr>\n<td><strong>Энтеральная (метасимпатическая) нервная система<\/strong><\/td>\n<td>«Местный мозг кишечника» в стенках ЖКТ: перистальтика, слизь и ферменты, реакция на объём и состав пищи, местный иммунитет. Может работать автономно<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h4>Симпатика и парасимпатика<\/h4>\n<div class=\"lt-tbl\"><table>\n<tbody>\n<tr>\n<td><h4>Парасимпатика: «спи, переваривай, отдыхай»<\/h4>\n<p>✔ усиливает перистальтику<\/p>\n<p>✔ активирует слюну, кислоту, желчь, ферменты<\/p>\n<p>✔ расширяет сосуды ЖКТ<\/p>\n<h4>→ пищеварение улучшается<\/h4><\/td>\n<td><h4>Симпатика: «бей, беги, работай»<\/h4>\n<p>✔ уменьшает секрецию<\/p>\n<p>✔ замедляет перистальтику<\/p>\n<p>✔ сужает сосуды ЖКТ<\/p>\n<h4>→ пищеварение «встаёт»<\/h4><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<div class=\"lt-tbl\"><table>\n<thead>\n<tr>\n<th><strong>Включает симпатику<\/strong><\/th>\n<th><strong>Включает парасимпатику<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Острый и хронический стресс, тревога<\/td>\n<td>Спокойствие и чувство безопасности<\/td>\n<\/tr>\n<tr>\n<td>Холод, голод, скачки сахара<\/td>\n<td>Сон в достаточном количестве (7–9 ч)<\/td>\n<\/tr>\n<tr>\n<td>Кофеин, крепкий чай, энергетики<\/td>\n<td>Тепло: ванна, душ, тёплая еда и напитки<\/td>\n<\/tr>\n<tr>\n<td>Еда на бегу, спешка, многозадачность<\/td>\n<td>Глубокое медленное дыхание<\/td>\n<\/tr>\n<tr>\n<td>Недосыпание, поздний отход ко сну<\/td>\n<td>Прогулки, спокойная ритмичная активность, йога<\/td>\n<\/tr>\n<tr>\n<td>Шум, яркий свет, громкие звуки<\/td>\n<td>Тишина, мягкий свет, природа<\/td>\n<\/tr>\n<tr>\n<td>Интенсивные тренировки<\/td>\n<td>Медитация, молитва, чтение, творчество, музыка<\/td>\n<\/tr>\n<tr>\n<td>Новости, соцсети, экраны перед сном<\/td>\n<td>Тёплая мягкая еда, осознанная спокойная трапеза<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<div class=\"lt-note\"><strong>Нужны обе системы.<\/strong> Проблема в том, что современный образ жизни чаще включает симпатику. Напрямую управлять ею нельзя, но косвенно — через образ жизни — можно.<\/div>\n<h4>Что помогает «местному мозгу» кишечника<\/h4>\n<p>Подходящий состав пищи (жиры, белки, клетчатка), низкий уровень воспаления, здоровая микробиота, меньше хронического стресса, движение, осанка и диафрагмальное дыхание.<\/p>\n<h4>Стресс и ЖКТ<\/h4>\n<p><strong>Прямая связь со стрессом:<\/strong> синдром раздражённого кишечника, язвенная болезнь желудка и 12-перстной кишки («стресс-язва»), гастрит, функциональная диспепсия, ГЭРБ, дискинезия желчевыводящих путей.<\/p>\n<p><strong>Как проявляется:<\/strong> «узел» в животе, ком в горле, диарея («медвежья болезнь») или запоры («запор путешественника»), вздутие, тяга к сладкому и жирному, переедание или отказ от еды.<\/p>\n<div class=\"lt-note\"><strong>Контроль стресса — важная часть профилактики нарушений ЖКТ при любом типе пищеварения, особенно при чувствительном и воспалённом.<\/strong><\/div>",
 "slow2_7": "<h4>Главное за 1 минуту<\/h4>\n<div class=\"lt-note\">Перед активной работой с ЖКТ — мягкая очистка и снижение воспалительного фона с помощью <strong>сорбентов<\/strong>. Как губка, они связывают в кишечнике бактериальные токсины, избыток жёлчных кислот, непереваренные остатки, аллергены, соли тяжёлых металлов, пищевой холестерин, продукты воспаления, метаболиты гормонов — и снижают нагрузку на ЖКТ, печень и иммунитет.<\/div>\n<h4>Правила приёма<\/h4>\n<ul class=\"lt-check\"><li><strong>Интервал 1,5–2 часа<\/strong> с лекарствами и БАДами<\/li><li><strong>4–5 дней<\/strong> — при длительном приёме выводится и полезное<\/li><li><strong>+2 стакана жидкости в день<\/strong> — иначе возможен запор<\/li><li><strong>Начался запор<\/strong> — свечка с глицерином или микроклизма<\/li><\/ul>\n<h4>Сорбенты при вялом пищеварении (ограничений нет)<\/h4>\n<div class=\"lt-tbl\"><table>\n<thead>\n<tr>\n<th><strong>Вариант<\/strong><\/th>\n<th><strong>Как принимать / что это<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Псиллиум<\/strong><\/td>\n<td>1 ч. л. на стакан тёплой воды, настоять 10 минут; между едой или вечером через 1,5–2 часа после еды. Для вкуса — ягоды или пюре<\/td>\n<\/tr>\n<tr>\n<td><strong>Семена чиа<\/strong><\/td>\n<td>1–2 ч. л. на 100–150 мл тёплой воды или компота (из чернослива — для послабления, можно пюре сливы), 10 минут, выпить с осадком<\/td>\n<\/tr>\n<tr>\n<td><strong>Активированный уголь с пектином<\/strong><\/td>\n<td>Сорбент «2 в 1»<\/td>\n<\/tr>\n<tr>\n<td><strong>«Зостерин»<\/strong><\/td>\n<td>Мягкий пектин из взморника, селективная сорбция, не вредит микрофлоре<\/td>\n<\/tr>\n<tr>\n<td><strong>«Хитозан»<\/strong><\/td>\n<td>Из панцирей ракообразных; нельзя при аллергии на моллюсков<\/td>\n<\/tr>\n<tr>\n<td><strong>«Полисорб»<\/strong><\/td>\n<td>Диоксид кремния<\/td>\n<\/tr>\n<tr>\n<td><strong>«Лактофильтрум», «Фитомуцил»<\/strong><\/td>\n<td>Со слабительным эффектом — при склонности к запорам<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<div class=\"lt-note\"><strong>Выберите один вариант, пейте 4–5 дней и не забывайте про воду.<\/strong><\/div>",
 "slow2_8": "<h4>Схема питья на день<\/h4>\n<div class=\"lt-tbl\"><table>\n<thead>\n<tr>\n<th><strong>Когда<\/strong><\/th>\n<th><strong>Что и сколько<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Утром до завтрака<\/strong><\/td>\n<td>1–2 кружки горячей кипячёной воды (ГКВ)<\/td>\n<\/tr>\n<tr>\n<td><strong>Через 40–60 мин после завтрака<\/strong><\/td>\n<td>Кружка желчегонного чая<\/td>\n<\/tr>\n<tr>\n<td><strong>За 15–20 мин до обеда, ужина, перекуса<\/strong><\/td>\n<td>По 1 кружке ГКВ<\/td>\n<\/tr>\n<tr>\n<td><strong>Между приёмами пищи<\/strong><\/td>\n<td>ГКВ с кардамоном и лимоном — 2–3 кружки<\/td>\n<\/tr>\n<tr>\n<td><strong>В течение дня<\/strong><\/td>\n<td>Другие напитки по желанию; кофеин — до 16:00<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h4>Горячая кипячёная вода (ГКВ)<\/h4>\n<p><strong>40–55 °C<\/strong> — теплее тела, но не обжигает; летом прохладнее, зимой горячее. <strong>4–5 стаканов<\/strong> в день и больше по жажде. Удобно — термос с вечера. Для вкуса — лимон, огурец, ягоды, мята.<\/p>\n<p><strong>Зачем:<\/strong> убирает излишек Капхи из желудка (меньше тяжести, вздутия, тошноты); снимает спазм гладких мышц и улучшает моторику; усиливает кровоток; даёт ферментам рабочую температуру 38–42 °C; разжижает желчь (она на 90 % из воды). Кипячение дезинфицирует воду и убирает лишние соли металлов.<\/p>\n<h4>ГКВ с кардамоном и лимоном<\/h4>\n<div class=\"lt-note\"><p><strong>0,5 л ГКВ + 3–4 шт. цельного зелёного кардамона + ½ тонкого кружочка лимона.<\/strong> Настоять в термосе 10–15 минут, специи не вынимать. Пить 2–3 кружки между едой.<\/p>\n<p><strong>Кардамон:<\/strong> противоотёчный (усилится мочеиспускание), стимулирует желудочный сок и отток желчи, снимает спазмы и вздутие, поддерживает перистальтику, не раздражает слизистую, антисептик, бодрит. <strong>Лимон:<\/strong> стимулирует слюну и желудочный сок, слегка желчегонный.<\/p><\/div>\n<div class=\"lt-note\"><strong>Для не прошедших тест:<\/strong> нельзя при острых воспалениях ЖКТ, поджелудочной, печени, жёлчного и при непереносимости; при беременности, ЖКБ, хронических воспалениях — дозировку вдвое меньше.<\/div>\n<h4>Желчегонные чаи<\/h4>\n<p>Чай с иван-чаем, мятой и календулой или настой с шиповником и специями (рецепты — в 1-й неделе). По 1–2 кружки тёплыми вместо чая и кофе: против застоя желчи и сладжа, мягко бодрят.<\/p>\n<h4>Также можно<\/h4>\n<p>Чёрный чай, пуэр, кофе (до 16:00); какао или цикорий с молоком; подогретая минеральная вода (мягко желчегонная). Но ГКВ, вода со специями и чаи уже закрывают потребность в жидкости.<\/p>",
 "sens1_1": "<h4>Главное за 1 минуту<\/h4>\n<div class=\"lt-note\"><strong>Чувствительное пищеварение<\/strong> — не диагноз, а\nповышенная реактивность ЖКТ на пищу, напитки, растяжение, кислоты,\nхолод, стресс. В основе: висцеральная гиперчувствительность, рефлюкс и\nтонкая слизистая пищевода, нарушение желчеоттока (часто дискинезия ЖВП),\nнехватка ферментов тонкой кишки (непереносимости лактозы, глютена),\nдисбиоз, субклиническое воспаление — синдром повышенной кишечной\nпроницаемости.<\/div>\n<h4>Характерные жалобы<\/h4>\n<p>Слабые ноющие боли натощак; изжога, жжение, горечь во рту; дискомфорт\nот холодного и горячего; тошнота от голода и стресса (вплоть до пустой\nрвоты); красный язык, налёт, трещины; вздутие вечером; газы от\nклетчатки; запоры, диарея или их чередование; слизь в стуле; ощущение\nнеполного опорожнения.<\/p>\n<p><strong>Часто сопутствуют:<\/strong> тревожность, хроническая\nусталость, анемия и дефициты (белок, витамины B, жирорастворимые), сухая\nкожа и дерматиты, герпес и кандидоз, нарушения цикла и ПМС, ранняя\nменопауза, со временем — аутоиммунные заболевания.<\/p>\n<h4>Обследования (необязательно для программы)<\/h4>\n<p>Главная цель — понять, <strong>есть ли воспаление<\/strong>. Часто\nнаходят только функциональные нарушения (СРК, ГЭРБ, дискинезия ЖВП,\nдиспепсия), иногда — гастрит, загиб жёлчного и сладж,\nнепереносимости.<\/p>\n<div class=\"lt-tbl\"><table>\n<thead>\n<tr>\n<th><strong>Обследование<\/strong><\/th>\n<th><strong>Что показывает<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>УЗИ брюшной полости + жёлчного под нагрузкой<\/strong><\/td>\n<td>Печень, жёлчный, поджелудочная; тип дискинезии<\/td>\n<\/tr>\n<tr>\n<td><strong>ОАК, ферритин, B12, фолаты; белок, альбумин<\/strong><\/td>\n<td>Дефициты, усвоение белка<\/td>\n<\/tr>\n<tr>\n<td><strong>АЛТ, АСТ, билирубин; СРБ, СОЭ<\/strong><\/td>\n<td>Печень и желчь; уровень воспаления<\/td>\n<\/tr>\n<tr>\n<td><strong>Копрограмма<\/strong><\/td>\n<td>Общая оценка ЖКТ (без локализации)<\/td>\n<\/tr>\n<tr>\n<td><strong>Кал: скрытая кровь, кальпротектин<\/strong><\/td>\n<td>Воспаление в тонкой и толстой кишке<\/td>\n<\/tr>\n<tr>\n<td><strong>ФГДС / «Гастропанель» / pH-метрия<\/strong><\/td>\n<td>Слизистая, H. pylori, кислотность, рефлюкс<\/td>\n<\/tr>\n<tr>\n<td><strong>Водородно-дыхательный тест<\/strong><\/td>\n<td>СИБР, непереносимость лактозы, фруктозы<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<div class=\"lt-warn\"><div><strong>Важно:<\/strong> список назначает и результаты оценивает\nгастроэнтеролог, в комплексе.<\/div><\/div>\n<h4>Цель и план программы (5 недель)<\/h4>\n<p><strong>Цель:<\/strong> восстановить нормальную активность ЖКТ,\nснизить гиперчувствительность, не допустить воспаления — восстановить\nслизистые, успокоить нервную систему, мягко наладить моторику и\nжелчеотток, улучшить усвоение, повысить энергию.<\/p>\n<p><strong>Методы:<\/strong> мягкие сорбенты → успокаивающие чаи → режим\nдня → работа со стрессом → коррекция питания и полноценное меню →\nспеции, травы, фитосоставы → домашние процедуры, гимнастика, йога.<\/p>\n<div class=\"lt-note\"><strong>Темп — спокойный и плавный. Задание: посмотрите уроки первой\nнедели и подготовьте травы, специи и продукты.<\/strong><\/div>",
 "sens2_2": "<h4>Главное за 1 минуту<\/h4>\n<div class=\"lt-note\"><p><strong>Чувствительное пищеварение<\/strong> — повышенная\nреактивность ЖКТ на обычные раздражители. Формируется\n<strong>совокупностью факторов<\/strong>, в центре — нервная система и\nстресс; напряжённый живот со временем даёт висцеральную\nгиперчувствительность.<\/p>\n<p><strong>Задание:<\/strong> подумайте, какие факторы сформировали\nчувствительное пищеварение у вас, и напишите в комментариях. Утром лёжа\nпрощупайте живот справа и слева, чтобы понять свой тип запора.<\/p><\/div>\n<h4>10 причин<\/h4>\n<div class=\"lt-tbl\"><table>\n<thead>\n<tr>\n<th><strong>Нервная система<\/strong><\/th>\n<th><strong>Питание и другое<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1. «Слабый» тип нервной системы (по Павлову): тревожность,\nстресс-реактивность, симпатика включается чаще парасимпатики<\/td>\n<td>4. Нерегулярное питание, еда на бегу, долгие перерывы, частые\nперекусы<\/td>\n<\/tr>\n<tr>\n<td>2. Дезадаптация к острому и хроническому стрессу: истощение,\nусталость, нарушения сна<\/td>\n<td>5. Избыток грубой клетчатки: сыроедение, вегетарианство,\nвеганство<\/td>\n<\/tr>\n<tr>\n<td>3. Ослабление защитных факторов слизистой ЖКТ<\/td>\n<td>6. Строгие диеты → дефицит B1 и др. витаминов B, магния, железа,\nцинка<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>7. Неправильное голодание; 8. Ферментопатии (целиакия, глютен,\nлактоза, фруктоза); 9. Нарушения микробиоты; 10. Конституция Вата /\nВетер<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h4>Жалоба → что за ней стоит<\/h4>\n<div class=\"lt-tbl\"><table>\n<thead>\n<tr>\n<th><strong>Где<\/strong><\/th>\n<th><strong>Жалоба<\/strong><\/th>\n<th><strong>Что означает<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Язык<\/td>\n<td>Трещины, «географический», чувствительный<\/td>\n<td>Дефицит B9, B12; дисбиоз ЖКТ и полости рта<\/td>\n<\/tr>\n<tr>\n<td>Пищевод<\/td>\n<td>Изжога, жжение<\/td>\n<td>Гиперчувствительный пищевод, функциональная изжога (реакция на\nнормальные рефлюксы — до 50 в день), ГЭРБ, ГПОД. Проверка: ФГДС, для\nГПОД — рентген<\/td>\n<\/tr>\n<tr>\n<td>Пищевод, желудок<\/td>\n<td>Неприятно холодное и горячее<\/td>\n<td>Ослаблены защитные факторы слизистой<\/td>\n<\/tr>\n<tr>\n<td>Желудок<\/td>\n<td>Отрыжка<\/td>\n<td>Несмыкание сфинктера, ГЭРБ, медленная эвакуация, низкая\nкислотность<\/td>\n<\/tr>\n<tr>\n<td>Желудок<\/td>\n<td>Слабые ноющие боли<\/td>\n<td>Функциональная диспепсия с гиперчувствительностью<\/td>\n<\/tr>\n<tr>\n<td>Правое подреберье<\/td>\n<td>Дискомфорт, слабые боли<\/td>\n<td>Дискинезия ЖВП (гипо- или гипермоторная), сладж, холецистит без\nкамней; риск камней<\/td>\n<\/tr>\n<tr>\n<td>Вокруг пупка<\/td>\n<td>Вздутие через 30–60 мин<\/td>\n<td>Нехватка желчи, ферментов поджелудочной и кишечника<\/td>\n<\/tr>\n<tr>\n<td>Толстая кишка<\/td>\n<td>Вздутие во второй половине дня<\/td>\n<td>СРК, дисбиоз — «визитная карточка» чувствительного типа<\/td>\n<\/tr>\n<tr>\n<td>Кишечник<\/td>\n<td>Диарея, слизь, неполное опорожнение<\/td>\n<td>СРК; нехватка ферментов, нарушение желчеоттока<\/td>\n<\/tr>\n<tr>\n<td>Толстая кишка<\/td>\n<td>Запор<\/td>\n<td>Чаще спастический: слева спазм, «козий» стул через день.\nАтонический: справа застой, стул раз в 2–3 дня<\/td>\n<\/tr>\n<tr>\n<td>Кишечник<\/td>\n<td>Газы от клетчатки<\/td>\n<td>Избыток грубой клетчатки (снизить и вводить постепенно), нехватка\nферментов, дисбиоз<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>",
 "sens2_3": "<h4>Главное за 1 минуту<\/h4>\n<div class=\"lt-note\"><p>Каждый организм уникален, и отклик тела на еду, специи,\nфитосоставы тоже. Чтобы собрать свою формулу ЖКТ, на программе\nиспользуем <strong>два инструмента<\/strong>:<\/p>\n<ul>\n<li><strong>Дневник симптомов и ощущений<\/strong> — связь еды и\nрежима питания с ощущениями;<\/li>\n<li><strong>Трекер самочувствия<\/strong> — как меняется самочувствие\nв целом по дням недели.<\/li>\n<\/ul><\/div>\n<h4>Тест «Где вы сейчас?»<\/h4>\n<div class=\"lt-tbl\"><table>\n<thead>\n<tr>\n<th><strong>Вопрос<\/strong><\/th>\n<th><strong>5 баллов<\/strong><\/th>\n<th><strong>3 балла<\/strong><\/th>\n<th><strong>1 балл<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Часто замечаете связь между едой и самочувствием?<\/td>\n<td>Всегда<\/td>\n<td>Иногда<\/td>\n<td>Никогда<\/td>\n<\/tr>\n<tr>\n<td>Что делаете при тяжести после еды?<\/td>\n<td>Анализирую, что съел(а)<\/td>\n<td>Пью таблетку<\/td>\n<td>Игнорирую<\/td>\n<\/tr>\n<tr>\n<td>Как часто отслеживаете стул?<\/td>\n<td>Ежедневно<\/td>\n<td>Редко<\/td>\n<td>Никогда<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>12–15<\/strong> — вы детектив своего здоровья.\n<strong>6–11<\/strong> — вы на пути: заполняйте Дневник и Трекер.\n<strong>3–5<\/strong> — время начать диалог с телом, сегодня.<\/p>\n<h4>Дневник: что и как записывать<\/h4>\n<p><strong>Отслеживаем:<\/strong> регулярность приёмов пищи; аппетит и\nтягу к еде; стул (регулярность, частота, тип); качество и\nпродолжительность сна (засыпание, просыпания); энергию в течение дня;\nнастроение и стресс; ваши симптомы (кожа, давление, головные боли).<\/p>\n<ul>\n<li><strong>1–2 раза в день<\/strong> (утро и/или вечер), но каждый\nдень.<\/li>\n<li><strong>Честность важнее «как правильно»<\/strong> — записывайте и\nкусочничество, и тягу к сладкому.<\/li>\n<li><strong>Фокус на паттерны<\/strong>, а не на единичные случаи\n(стресс утром → тяга к сладкому днём).<\/li>\n<li><strong>Колонки:<\/strong> приём пищи и время → блюда/напитки\n(можно фотографировать еду днём) → ощущения. Отдельно — стул и\nсон.<\/li>\n<\/ul>\n<h4>Трекер: формат и шкала<\/h4>\n<div class=\"lt-tbl\"><table>\n<thead>\n<tr>\n<th><strong>Формат<\/strong><\/th>\n<th><strong>Шкала (выберите одну)<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Бумажный<\/strong> — распечатка или от руки, со своими\nзначками (лампочка — энергия, «zzz» — сон)<\/td>\n<td><strong>Баллы 1–10<\/strong>: 1 — очень плохо, 10 — отлично<\/td>\n<\/tr>\n<tr>\n<td><strong>Цифровой<\/strong> — Google/Excel с автоподсчётом, удобно\nвносить с телефона сразу<\/td>\n<td><strong>Смайлики<\/strong>: хорошо / нормально / трудный день<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><strong>Цвет<\/strong>: зелёный — отлично, жёлтый — умеренный\nдискомфорт, красный — симптом<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Строки — дни недели, столбцы — ваши параметры (аппетит, тяга к\nсладкому, еда после 20:00, стул, сон, энергия, ваш симптом). В конце —\n<strong>итог дня<\/strong> и <strong>итог недели<\/strong>. Женщинам —\nотмечать день цикла.<\/p>\n<h4>Анализ в конце недели: 3 шага<\/h4>\n<ol>\n<li><strong>Ищите связи.<\/strong> Триггеры ухудшений (бананы →\nвздутие; недосып → тяга к сладкому) и факторы улучшений (бульон на ужин\n→ лёгкий стул утром).<\/li>\n<li><strong>Сравните лучший и худший день.<\/strong> Что ели, как\nспали, какие эмоции? Какие симптомы были и что «ДО» могло их вызвать?\nКакие триггеры повторяются в «красные» дни?<\/li>\n<li><strong>Создавайте заметки.<\/strong> «Когда я ем ___, в животе\n___ и энергия ___»; «Когда я ем/пью ___, хожу в туалет лучше/хуже»;\nзамены: кофе натощак → изжога → цикорий или чай из программы.<\/li>\n<\/ol>\n<div class=\"lt-note\"><strong>Вопрос себе: «Что ЛУЧШЕЕ из этого дня я могу повторить\nзавтра?»<\/strong><\/div>\n<h4>Запомнить: Дневник и Трекер — это эксперимент<\/h4>\n<div class=\"lt-tbl\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th><strong>Правило<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>7<\/strong><\/td>\n<td>дней трекинга — минимум для выявления паттернов<\/td>\n<\/tr>\n<tr>\n<td><strong>3+<\/strong><\/td>\n<td>параметра — минимум для комплексной оценки<\/td>\n<\/tr>\n<tr>\n<td><strong>Анализ<\/strong><\/td>\n<td>лучшего и худшего дня → план на следующую неделю<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>",
 "sens2_4": "<h4>Главное за 1 минуту<\/h4>\n<div class=\"lt-note\"><p><strong>Здоровье ЖКТ = здоровье всего тела.<\/strong> Пищеварение\nвлияет на поступление питательных веществ, энергию и митохондрии, мозг и\nнервную систему, печень, уровень воспаления, сон и настроение, кожу и\nсуставы, репродуктивное здоровье, иммунитет.<\/p>\n<p><strong>ЖКТ — последовательный конвейер.<\/strong> Пища механически и\nхимически обрабатывается, мелкие молекулы всасываются в кровь и лимфу.\nВсе отделы работают в связке, как оркестр: сбой в одном звене влияет на\nвсё пищеварение.<\/p><\/div>\n<h4>Этапы пищеварения<\/h4>\n<div class=\"lt-tbl\"><table>\n<thead>\n<tr>\n<th><strong>Этап<\/strong><\/th>\n<th><strong>Что происходит<\/strong><\/th>\n<th><strong>Хорошая работа — это<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Мозг<\/strong><\/td>\n<td>Пищевой центр гипоталамуса. Голод: состав крови, сигналы нервов ЖКТ,\nвид/запах/мысли о еде → запуск соков. Насыщение: наполнение желудка,\nсостав пищи, гормоны ЖКТ и лептин, осознанная еда<\/td>\n<td>Голод и насыщение приходят естественно и вовремя<\/td>\n<\/tr>\n<tr>\n<td><strong>Рот<\/strong><\/td>\n<td>Анализ вкуса; слюна: размягчение, лизоцим, начало переваривания\nуглеводов; жевание, глотание<\/td>\n<td>Сигнал желудку и поджелудочной готовить соки<\/td>\n<\/tr>\n<tr>\n<td><strong>Желудок<\/strong><\/td>\n<td>3 слоя мышц перемешивают пищу; соляная кислота (pH ≈ 1), пепсин и\nдр.; первичное расщепление белков; транспортные белки для железа и B12;\nбактерицидная обработка; защитный муцин<\/td>\n<td>Расщепление белков; усвоение железа, B12, кальция, цинка, магния,\nмеди; барьер от инфекций; нет тяжести, болей, изжоги, отрыжки<\/td>\n<\/tr>\n<tr>\n<td><strong>Тонкая кишка (7–8 м)<\/strong><\/td>\n<td>12-перстная — переваривание; тощая — всасывание; подвздошная — B12 и\nтранзит. Работают желчь, ферменты поджелудочной и кишечника<\/td>\n<td>Мелкие молекулы всасываются через избирательно проницаемую\nстенку<\/td>\n<\/tr>\n<tr>\n<td><strong>Поджелудочная<\/strong><\/td>\n<td>Проферменты (липаза, протеаза, амилаза, трипсин, химотрипсин) под\nсостав пищи, активируются в 12-перстной кишке; инсулин и глюкагон<\/td>\n<td>Полное переваривание БЖУ, усвоение ПНЖК и витаминов A, E, K, D; нет\nгазов, вздутия, диареи<\/td>\n<\/tr>\n<tr>\n<td><strong>Желчь<\/strong><\/td>\n<td>Молодая (печёночная) → зрелая (пузырная). Щелочная среда, активация\nферментов, эмульгация жиров, перистальтика, бактерицидность<\/td>\n<td>Усвоение жиров, витаминов, аминокислот и сахаров; здоровая\nмикрофлора; регулярный стул<\/td>\n<\/tr>\n<tr>\n<td><strong>Ферменты тонкой кишки<\/strong><\/td>\n<td>Пристеночное пищеварение на щёточной кайме (до 200 м²): сахароза,\nлактоза, изомальтоза, пептиды и др.<\/td>\n<td>Нет брожения и дефицитов, ритмичный стул<\/td>\n<\/tr>\n<tr>\n<td><strong>Толстая кишка<\/strong><\/td>\n<td>Вода, электролиты, витамины K и B; каловые массы; иммунный надзор;\n~100 трлн бактерий: клетчатка, витамины, КЖК, связь с мозгом и\nкожей<\/td>\n<td>Сформированный стул, низкое воспаление, нет патогенов, здоровье\nвсего организма<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<div class=\"lt-note\"><strong>Когда есть?<\/strong> По голоду. Голод — природный регулятор\nпищевого поведения; полное отсутствие голода опасно. Голодом и\nнасыщением можно управлять: питанием, композицией приёмов пищи, режимом,\nработой со стрессом и микробиотой.<\/div>\n<h4>Чек-лист здорового пищеварения<\/h4>\n<p><strong>Это не идеал, а ориентир:<\/strong> если есть 80–90 % пунктов\n— ЖКТ работает хорошо.<\/p>\n<ul class=\"lt-check\"><li>Голод и насыщение приходят естественно и вовремя<\/li><li>Нет постоянной тяги к сладкому, мучному<\/li><li>Здоровый вес<\/li><li>Пища переваривается без тяжести<\/li><li>Нет хронического вздутия, урчания, отрыжки, изжоги<\/li><li>Стул ежедневный, оформленный, без боли (1–3 раза в день)<\/li><li>Кожа чистая, энергия стабильна, настроение ровное<\/li><\/ul>",
